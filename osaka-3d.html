<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오사카 2박3일</title>
<link rel="icon" href="data:,">
<meta name="description" content="오사카 여행 일정을 실제 건물 높이로 세운 3D 도시 지도 위에 보여주는 페이지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* ── 색 ── */
:root {
  --bg: #f3f1ec; --surface: #ffffff; --surface-2: #f8f7f4; --surface-3: #efede8;
  --ink: #1b1d22; --ink-2: #4b505b; --ink-3: #7a7f8a; --line: #e5e2db; --line-2: #d3cfc6;
  --accent: #ff5a36; --accent-2: #e8451f; --accent-ink: #ffffff; --accent-soft: #ffe9e2;
  --link: #1e5bd8; --good: #12925a; --good-bg: #e2f3ea; --warn: #c2410c; --warn-bg: #fff1e0; --bad: #d62a22;
  --bar: #ff5a36; --bar-weak: #ffd2c6;
  --chip: rgba(255, 255, 255, .92); --chip-ink: #1b1d22; --glass: rgba(255, 255, 255, .86);
  --shadow: 0 1px 2px rgba(27, 29, 34, .06), 0 6px 20px rgba(27, 29, 34, .08);
  --radius: 12px;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --f-disp: 'Black Han Sans', 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif;
  --f-num: 'IBM Plex Sans KR', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light;
}

/* ── 바탕 ── */
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--link); }
.small { font-size: 13px; color: var(--ink-3); line-height: 1.5; }
.num { font-variant-numeric: tabular-nums; }

#app { height: 100%; display: flex; flex-direction: column; }

/* 번호 원 */
.bul { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--c, #222); color: #fff; font: 700 13px/1 var(--f-num); flex: none; letter-spacing: -.02em; }
.bul.sm { width: 24px; height: 24px; font-size: 12px; }
.bul.xl { width: 58px; height: 58px; font: 400 30px/1 var(--f-disp); }
.bul.ghost { background: var(--surface); color: var(--c, #222); box-shadow: inset 0 0 0 2px var(--c, #222); }
.bul.ico { font-size: 13px; }

/* ── 머리 ── */
.top { background: var(--surface); display: flex; align-items: center; gap: 16px; padding: 10px 18px 12px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); position: relative; z-index: 5; }
.top::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, #E5171F 0 12.5%, #522886 0 25%, #0078BA 0 37.5%, #019A66 0 50%, #E44D93 0 62.5%, #814721 0 75%, #A9CC51 0 87.5%, #EE7B1A 0); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: #fff; display: grid; place-items: center; font: 400 17px/1 var(--f-disp); flex: none; letter-spacing: -.02em; transform: rotate(-4deg); }
.brand h1 { font: 400 24px/1.1 var(--f-disp); letter-spacing: .01em; white-space: nowrap; }
.brand p { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.dates { display: flex; gap: 6px; margin-left: auto; }
.date-chip { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px 6px 7px; text-align: left; display: flex; align-items: center; gap: 8px; min-width: 128px; transition: background .15s, border-color .15s; }
.date-chip:hover { border-color: var(--line-2); }
.date-chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.date-chip span { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.date-chip b { font: 700 13.5px/1.2 var(--f-num); }
.date-chip small { font-size: 11.5px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.date-chip .now { font-style: normal; font: 700 10px/1 var(--f-body); background: var(--accent); color: #fff; padding: 3px 5px; border-radius: 99px; margin-left: 4px; }
.dday { display: flex; flex-direction: column; align-items: flex-end; flex: none; }
.dday b { font: 400 26px/1 var(--f-disp); color: var(--accent); }
.dday span { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }

/* ── 지도 ── */
.stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 460px; }
.mapwrap { position: relative; overflow: hidden; background: linear-gradient(#bcd7ee, #eef1f2 70%); min-height: 0; }
#map { position: absolute; inset: 0; }
#map canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
.map-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
.lbl { position: absolute; left: 0; top: 0; will-change: transform; pointer-events: none; font-family: var(--f-body); }
.lbl.off { visibility: hidden; }

.lbl.pin { pointer-events: auto; cursor: pointer; display: flex; align-items: center; transform-origin: 13px 100%; padding-bottom: 9px; }
.lbl.pin::after { content: ''; position: absolute; left: 9px; bottom: 1px; width: 8px; height: 8px; background: var(--c); transform: rotate(45deg); border-radius: 0 0 2px 0; box-shadow: 2px 2px 3px rgba(0,0,0,.18); }
.lbl.pin .bul { width: 26px; height: 26px; box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.3); position: relative; z-index: 1; font-size: 12.5px; }
.lbl.pin .nm { background: var(--chip); color: var(--chip-ink); font: 600 12.5px/1 var(--f-body); padding: 6px 9px 6px 14px; margin-left: -10px; border-radius: 0 7px 7px 0; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.lbl.pin .tm { font-style: normal; background: var(--c); color: #fff; font: 700 11px/1 var(--f-num); padding: 6px 7px; border-radius: 0 7px 7px 0; margin-left: -4px; box-shadow: 0 2px 8px rgba(0,0,0,.16); }
.lbl.pin.on { z-index: 3; }
.lbl.pin.on .bul { transform: scale(1.22); }
.lbl.pin.on .nm, .lbl.pin:hover .nm { background: var(--ink); color: #fff; }
.lbl.pin.hide-nm .nm, .lbl.pin.hide-nm .tm { display: none; }
.lbl.pin.alt .bul { background: #fff; color: var(--ink-3); box-shadow: 0 0 0 2px var(--ink-3); width: 20px; height: 20px; font-size: 10px; }
.lbl.pin.alt .nm { font-weight: 500; color: var(--ink-2); font-size: 11.5px; }
.lbl.pin.alt::after { background: var(--ink-3); }
.lbl.pin.edge .bul { background: var(--ink); }
.lbl.pin.edge .nm { background: var(--ink); color: #fff; }
.lbl.leg span { display: inline-flex; align-items: center; gap: 4px; background: var(--chip); color: var(--chip-ink); font: 700 11px/1 var(--f-num); padding: 4px 7px; border-radius: 99px; box-shadow: 0 1px 4px rgba(0,0,0,.22); white-space: nowrap; border: 1.5px solid var(--c); }
.lbl.stn span { display: inline-flex; align-items: center; gap: 4px; font: 600 10.5px/1 var(--f-body); color: var(--ink-2); background: rgba(255,255,255,.85); padding: 3px 6px 3px 3px; border-radius: 99px; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.lbl.stn i { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid var(--c); }
.lbl.hood span { display: block; font: 700 11px/1 var(--f-body); letter-spacing: .2em; color: rgba(27,29,34,.5); text-shadow: 0 0 5px rgba(255,255,255,.9), 0 0 2px rgba(255,255,255,.9); white-space: nowrap; }
.lbl.hood.water span { font-style: italic; letter-spacing: .1em; color: rgba(25,85,135,.62); font-weight: 600; }
.lbl.hood.mark span { letter-spacing: .02em; color: rgba(27,29,34,.62); font-weight: 600; }
.night .lbl.hood span { color: rgba(225,232,245,.62); text-shadow: 0 0 6px rgba(0,0,0,.7); }
.night .lbl.hood.water span { color: rgba(140,190,235,.7); }
.lbl.token { font-size: 26px; line-height: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
.lbl.token b { display: block; animation: bob .9s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.touring .lbl.hood, .touring .lbl.stn { opacity: .0; }

.map-tools { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; align-items: center; z-index: 3; flex-wrap: wrap; justify-content: flex-end; }
.mt, .tod { background: var(--glass); color: var(--ink); border: 1px solid rgba(0,0,0,.06); border-radius: 9px; padding: 7px 11px; font: 600 12.5px/1 var(--f-body); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.mt:hover { background: #fff; }
.mt.on { background: var(--ink); color: #fff; }
.lbl.me { pointer-events: none; }
/* 앱에서 ?day= 로 열면: 일정 패널 없이 지도만 크게 */
.maponly, .maponly body { height: 100%; overflow: hidden; }
.maponly .top, .maponly .panel { display: none; }
.maponly #app { height: 100svh; min-height: 0; }
.maponly .stage { display: block; position: relative; }
.maponly .mapwrap { position: absolute; inset: 0; height: auto; min-height: 0; }
.maponly .map-tools { top: calc(10px + env(safe-area-inset-top, 0px)); }
.me-dot { display: block; width: 18px; height: 18px; border-radius: 50%; background: #1a73e8; border: 3px solid #fff; box-shadow: 0 0 0 7px rgba(26,115,232,.28), 0 2px 8px rgba(0,0,0,.4); }
.tod { display: flex; align-items: center; gap: 8px; }
.tod output { font: 700 12.5px/1 var(--f-num); min-width: 38px; font-variant-numeric: tabular-nums; }
.tod input { width: 130px; accent-color: var(--accent); }
.hint { position: absolute; top: 14px; left: 14px; font-size: 11.5px; color: var(--ink-2); background: var(--glass); padding: 5px 9px; border-radius: 7px; z-index: 2; pointer-events: none; }
.touring .hint, .touring .map-tools { display: none; }
.credit { position: absolute; right: 10px; bottom: 76px; z-index: 2; font-size: 10.5px; color: var(--ink-2); background: rgba(255,255,255,.72); padding: 2px 6px; border-radius: 4px; }
.credit a { color: inherit; }

/* 날짜 카드 */
.daystrip { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 6px; padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); overflow-x: auto; z-index: 3; scrollbar-width: none; }
.daystrip::-webkit-scrollbar { display: none; }
.ds { flex: none; display: flex; align-items: center; gap: 8px; background: var(--glass); color: var(--ink); border: 2px solid transparent; border-radius: 12px; padding: 6px 12px 6px 7px; text-align: left; max-width: 230px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 3px 12px rgba(0,0,0,.12); transition: transform .15s, border-color .15s; }
.ds span { display: flex; flex-direction: column; font: 600 12.5px/1.25 var(--f-body); overflow: hidden; }
.ds span strong { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ds span em { font-style: normal; font: 700 11px/1.3 var(--f-num); color: var(--ink-3); }
.ds:hover { transform: translateY(-2px); }
.ds.on { border-color: var(--c); background: #fff; }
.ds .bul { width: 32px; height: 32px; font-size: 15px; }
.touring .daystrip { display: none; }

/* 미리 체험 카드 */
.tour { position: absolute; left: 14px; bottom: 14px; width: min(440px, calc(100% - 28px)); background: var(--surface); color: var(--ink); border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.28); padding: 14px 16px 12px; z-index: 4; border-top: 6px solid var(--c, #222); }
.tour-top { display: flex; gap: 12px; align-items: flex-start; }
.tour-time { font: 700 12.5px/1.3 var(--f-num); color: var(--ink-3); }
.tour h3 { font: 400 21px/1.2 var(--f-disp); margin-top: 3px; }
.tour .tour-memo { margin-top: 6px; font-size: 13.5px; color: var(--ink-2); max-height: 4.8em; overflow: auto; }
.tour .tour-legs { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--ink-2); }
.tour-ctl { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.tb { background: var(--surface-3); border: 0; border-radius: 9px; min-width: 38px; height: 36px; padding: 0 11px; font: 700 13px/1 var(--f-body); color: var(--ink); }
.tb:hover { background: var(--line-2); }
.tb.big { background: var(--accent); color: #fff; min-width: 48px; }
.tb.on { background: var(--ink); color: #fff; }
#tour-close { margin-left: auto; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; flex: 1 1 100%; margin-top: 2px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line-2); cursor: pointer; }
.dots i.past { background: var(--ink-3); }
.dots i.on { background: var(--c); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--c); }

/* 불러오기 */
.loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 6; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.55), transparent 65%); transition: opacity .6s; }
.loading.done { opacity: 0; pointer-events: none; }
.ld-card { background: var(--surface); border-radius: 16px; padding: 20px 24px; width: min(340px, 86%); text-align: center; box-shadow: 0 16px 50px rgba(0,0,0,.18); }
.ld-card .logo { margin: 0 auto; }
.ld-card p { margin: 12px 0 10px; font-weight: 600; }
.ld-card small { color: var(--ink-3); font-size: 12px; }
.ld-track { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; margin-bottom: 10px; }
.ld-track span { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); transition: transform .2s; }
.loading.fail .ld-card { background: #fff0ee; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 20; box-shadow: var(--shadow); max-width: 90vw; font-size: 14px; }

/* ── 패널 ── */
.panel { background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; overflow-x: auto; background: var(--surface); border-bottom: 1px solid var(--line); scrollbar-width: none; flex: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; background: none; border: 0; color: var(--ink-3); padding: 13px 10px 10px; font: 600 13.5px/1 var(--f-body); border-bottom: 3px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.panel-body { overflow-y: auto; padding: 18px 18px 40px; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
.panel-body > * { flex-shrink: 0; }

.eyebrow { font: 700 11.5px/1.3 var(--f-body); letter-spacing: .06em; color: var(--ink-3); }
.sec h2 { font: 400 26px/1.25 var(--f-disp); margin-top: 4px; }
.lead { color: var(--ink-2); margin-top: 6px; font-size: 14.5px; }
.h3 { font: 700 16px/1.3 var(--f-body); margin-top: 6px; }

.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { background: var(--accent-2); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .35; cursor: default; }
.btn.sm { padding: 6px 10px; font-size: 12.5px; border-radius: 8px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; }
.kpis > div { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; min-width: 0; }
.kpis small { font-size: 11.5px; color: var(--ink-3); }
.kpis b { font-size: 19px; line-height: 1.3; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.kpis span { font-size: 11.5px; color: var(--ink-3); line-height: 1.45; }
.srows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.srow { display: grid; grid-template-columns: 40px minmax(0, 1fr) 14px; gap: 10px; align-items: center; background: var(--surface); border: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; text-align: left; }
.srow:last-child { border-bottom: 0; }
.srow:hover { background: var(--surface-2); }
.srow span { font-size: 12px; font-weight: 700; color: var(--ink-3); }
.srow b { font-size: 13.5px; font-weight: 600; }
.srow em, .dl i { font-style: normal; color: var(--ink-3); font-size: 18px; }
.daylist { display: flex; flex-direction: column; gap: 6px; }
.dl { display: grid; grid-template-columns: 34px minmax(0, 1fr) 14px; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; text-align: left; }
.dl:hover { background: var(--surface-2); border-color: var(--c); }
.dl .bul { width: 34px; height: 34px; font-size: 16px; }
.dl span { display: flex; flex-direction: column; min-width: 0; }
.dl em { font-style: normal; font: 700 11.5px/1.3 var(--f-num); color: var(--ink-3); }
.dl strong { font-size: 15px; }
.dl small { font-size: 12.5px; color: var(--ink-3); }
.note { background: var(--warn-bg); color: var(--ink); border-radius: var(--radius); padding: 11px 14px; font-size: 13.5px; border-left: 4px solid var(--accent); }
.box { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 15px; display: flex; flex-direction: column; gap: 6px; }
.box h4 { font: 700 14.5px/1.3 var(--f-body); }
.box p, .box li { font-size: 13.5px; color: var(--ink-2); }
.box ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }

/* 날짜 머리 */
.dayhead { display: flex; flex-direction: column; gap: 10px; }
.dh-row { display: flex; gap: 14px; align-items: center; }
.dh-txt h2 { font: 400 26px/1.2 var(--f-disp); }
.dh-sub { color: var(--ink-2); font-size: 14px; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.facts span { background: var(--surface-2); padding: 8px 10px; display: flex; flex-direction: column; min-width: 0; }
.facts small { font-size: 11.5px; color: var(--ink-3); }
.facts b { font-size: 16px; font-variant-numeric: tabular-nums; }
.dh-actions { display: flex; gap: 8px; align-items: center; }
.dh-actions .btn.primary { flex: 1; padding: 12px 14px; font-size: 15px; }
.navdays { display: flex; gap: 4px; }
.navdays .btn { width: 44px; padding: 9px 0; font-size: 18px; line-height: 1; }

/* 타임라인 */
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.stop { display: grid; grid-template-columns: 50px 26px minmax(0, 1fr); gap: 0 10px; padding: 10px 8px; border-radius: 12px; cursor: pointer; position: relative; }
.stop:hover { background: var(--surface-2); }
.stop.sel { background: var(--accent-soft); }
.stop.now { box-shadow: inset 3px 0 0 var(--accent); }
.stop time { font: 700 14px/26px var(--f-num); font-variant-numeric: tabular-nums; color: var(--ink); }
.stop.far, .stop.soft { opacity: .78; }
.st-body h3 { font: 700 15.5px/1.35 var(--f-body); padding-top: 2px; }
.st-body .memo { margin-top: 5px; font-size: 13.5px; color: var(--ink-2); }
.st-body .meta { margin-top: 5px; font-size: 12.5px; color: var(--ink-3); display: flex; flex-direction: column; gap: 2px; }
.st-body .meta a { color: var(--link); font-weight: 600; text-decoration: none; }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.links a, .links button { font: 600 12px/1 var(--f-body); padding: 6px 9px; border-radius: 8px; background: var(--surface-3); color: var(--ink); text-decoration: none; border: 0; }
.links a:hover, .links button:hover { background: var(--line-2); }
.links a.go { background: var(--ink); color: #fff; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.tag { font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--surface-3); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tag.ok { background: var(--good-bg); color: var(--good); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.now { background: var(--accent); color: #fff; }
.tag.main { background: var(--ink); color: #fff; }
.warn-line { font-size: 13px; color: var(--warn); font-weight: 600; margin-top: 5px; }
details.alts { margin-top: 7px; border: 1px dashed var(--line-2); border-radius: 10px; padding: 0 10px; }

details.alts[open] { padding-bottom: 8px; }
.alt { padding: 8px 0; border-top: 1px solid var(--line); }

.leg { display: flex; gap: 8px; align-items: baseline; margin-left: 68px; padding: 3px 8px 3px 14px; border-left: 3px dotted var(--line-2); font-size: 12.5px; color: var(--ink-3); cursor: pointer; }
.leg:hover { color: var(--ink); }
.leg-mode { flex: none; white-space: nowrap; font: 700 11px/1.55 var(--f-body); padding: 0 6px; border-radius: 5px; background: var(--surface-3); color: var(--ink-2); }

.leg.rail { border-left-style: solid; border-left-color: var(--c); }
.st-body .timeline .leg { margin-left: 0; }
.stop.flash, .card.flash, .fr.flash { animation: flash 1.2s ease; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* 이동 */
.cmp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.cmp > div { border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 12px; display: flex; flex-direction: column; gap: 4px; border-top: 4px solid var(--c); background: var(--surface); }
.cmp > div.main { box-shadow: 0 0 0 1.5px var(--ink); }

.moves { display: flex; flex-direction: column; gap: 6px; }

.mv:hover { background: var(--surface-2); }
.mv-h { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 14px; }
.mv-h time { font: 700 12.5px/1 var(--f-num); color: var(--ink-3); }
.seg { display: grid; grid-template-columns: max-content minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-size: 13px; }
.seg .leg-mode { justify-self: start; }
.seg small { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
.seg .via { grid-column: 2 / 4; font-size: 11.5px; color: var(--ink-3); margin-top: -3px; }

/* 맛집 */
.foodlist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.fr { display: flex; justify-content: space-between; gap: 12px; padding: 11px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.fr:last-child { border-bottom: 0; }
.fr:hover { background: var(--surface-2); }
.fr > div:first-child { display: flex; flex-direction: column; min-width: 0; gap: 2px; }

.hero-num { margin-top: 6px; display: flex; flex-direction: column; }
.hero-num b { font: 700 44px/1.1 var(--f-num); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

.cr-k small { font-weight: 500; color: var(--ink-3); font-size: 11.5px; }
.cr-bar { height: 20px; display: flex; align-items: center; border-left: 1px solid var(--line-2); }
.cr-bar span { display: block; height: 18px; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.cr-bar span.weak { background: var(--bar-weak); }
.cr-v { text-align: right; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11.5px; color: var(--ink-3); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line-2); }
.tbl td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
.tbl td.r, .tbl th.r { text-align: right; white-space: nowrap; }
.tbl small { display: block; color: var(--ink-3); font-size: 11.5px; }

/* 준비 */
.meter { height: 8px; border-radius: 4px; background: var(--good-bg); overflow: hidden; margin-top: 10px; }
.meter span { display: block; height: 100%; background: var(--good); border-radius: 4px; transition: width .3s; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.checks li label { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); cursor: pointer; background: var(--surface); }
.checks input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--good); }
.checks span { display: flex; flex-direction: column; font-size: 14px; }
.checks small { font-size: 12.5px; color: var(--ink-3); }

const RAD = Math.PI / 180;
const LAT = META.origin.lat;
const LON = META.origin.lon;

/** 날짜(YYYY-MM-DD)와 일본 시각(시)에서 해의 고도·방위(도) */
function sunPos(date, hJst) {
  const [y, m, d] = date.split('-').map(Number);
  const jd = (Date.UTC(y, m - 1, d) + (hJst - 9) * 3600e3) / 86400000 + 2440587.5;
  const T = (jd - 2451545) / 36525;
  const L0 = (((280.46646 + T * (36000.76983 + T * 0.0003032)) % 360) + 360) % 360;
  const M = 357.52911 + T * (35999.05029 - 0.0001537 * T);
  const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
  const Mr = M * RAD;
  const C = Math.sin(Mr) * (1.914602 - T * (0.004817 + 0.000014 * T)) + Math.sin(2 * Mr) * (0.019993 - 0.000101 * T) + Math.sin(3 * Mr) * 0.000289;
  const omega = 125.04 - 1934.136 * T;
  const lambda = L0 + C - 0.00569 - 0.00478 * Math.sin(omega * RAD);
  const eps0 = 23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60;
  const eps = eps0 + 0.00256 * Math.cos(omega * RAD);
  const decl = Math.asin(Math.sin(eps * RAD) * Math.sin(lambda * RAD));
  const yy = Math.tan((eps * RAD) / 2) ** 2;
  const L0r = L0 * RAD;
  const eqTime =
    (4 / RAD) *
    (yy * Math.sin(2 * L0r) - 2 * e * Math.sin(Mr) + 4 * e * yy * Math.sin(Mr) * Math.cos(2 * L0r) - 0.5 * yy * yy * Math.sin(4 * L0r) - 1.25 * e * e * Math.sin(2 * Mr));
  const tst = ((((hJst - 9) * 60 + eqTime + 4 * LON) % 1440) + 1440) % 1440;
  const ha = (tst / 4 - 180) * RAD;
  const lat = LAT * RAD;
  const cosZ = Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(ha);
  const el = 90 - Math.acos(clamp(cosZ, -1, 1)) / RAD;
  const az = (Math.atan2(Math.sin(ha), Math.cos(ha) * Math.sin(lat) - Math.tan(decl) * Math.cos(lat)) / RAD + 540) % 360;
  return { el, az };
}

/** 해 뜨는/지는 시각(일본 시각, 시). 대기 굴절을 넣은 -0.833° 기준. */
function sunCross(date, rising) {
  let a = rising ? 4 : 14;
  let b = rising ? 9 : 20;
  for (let i = 0; i < 40; i++) {
    const m = (a + b) / 2;
    const up = sunPos(date, m).el > -0.833;
    if (up === rising) b = m;
    else a = m;
  }
  return (a + b) / 2;
}

function b64bytes(s) {
  const bin = atob(s.replace(/\s+/g, ''));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function gunzip(bytes) {
  if ('DecompressionStream' in window) {
    const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Uint8Array(await new Response(st).arrayBuffer());
  }
  const { gunzipSync } = await import('https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js');
  return gunzipSync(bytes);
}

/** 가변 길이 정수 읽개 */
class Reader {
  constructor(buf, [off, len]) {
    this.b = buf;
    this.p = off;
    this.end = off + len;
  }
  u() {
    let v = 0;
    let s = 1;
    let x;
    do {
      x = this.b[this.p++];
      v += (x & 127) * s;
      s *= 128;
    } while (x & 128);
    return v;
  }
  s() {
    const v = this.u();
    return v % 2 ? -(v + 1) / 2 : v / 2;
  }
}

function resize() {
  const { host, renderer, cam } = map;
  const w = host.clientWidth || 1;
  const h = host.clientHeight || 1;
  renderer.setSize(w, h, false);
  cam.aspect = w / h;
  // 미리 체험 카드가 지도 아래쪽을 가리는 휴대폰에서는 화면 중심을 위로 올린다.
  if (map.lift) cam.setViewOffset(w, h, 0, h * map.lift, w, h);
  else cam.clearViewOffset();
  cam.updateProjectionMatrix();
  U.pix.value = (2 * Math.tan((cam.fov * RAD) / 2)) / h;
  map.dirty = true;
}

function clampTarget() {
  const t = map.controls.target;
  const b = META.box;
  t.x = clamp(t.x, b.x0 + 150, b.x1 - 150);
  t.z = clamp(t.z, -b.y1 + 150, -b.y0 - 150);
  t.y = 0;
}

// ── 그리기 반복 ───────────────────────────────────────────

let lastT = 0;
const perf = { acc: 0, n: 0, ratio: 2 };
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (t - (lastT || t)) / 1000);
  lastT = t;
  if (!map.ready) return;
  let active = false;
  if (map.anims.length) {
    active = true;
    for (const a of map.anims.slice()) {
      a.t += dt / a.dur;
      const k = Math.min(1, a.t);
      a.step(k);
      if (k >= 1) {
        map.anims.splice(map.anims.indexOf(a), 1);
        a.done?.();
      }
    }
  }
  tourTick(dt);
  if (map.controls.update()) active = true;
  if (!active && !map.dirty) return;
  map.dirty = false;
  const t0 = performance.now();
  render();
  // 느린 기기에서는 화면 해상도를 조금씩 낮춘다.
  perf.acc += performance.now() - t0 + dt * 1000;
  if (++perf.n >= 40) {
    const avg = perf.acc / perf.n;
    if (avg > 34 && perf.ratio > 1) {
      perf.ratio = Math.max(1, perf.ratio - 0.25);
      map.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, perf.ratio));
      resize();
    }
    perf.acc = 0;
    perf.n = 0;
  }
}

function render() {
  const { cam, controls, renderer, scene } = map;
  const dist = cam.position.distanceTo(controls.target);
  const near = clamp(dist / 160, 1, 60);
  const far = Math.max(30000, dist * 10);
  if (Math.abs(cam.near - near) > near * 0.2 || cam.far !== far) {
    cam.near = near;
    cam.far = far;
    cam.updateProjectionMatrix();
  }
  scene.fog.near = 2600 + dist * 1.1;
  scene.fog.far = scene.fog.near + 9000 + dist * 2.2;
  cam.updateMatrixWorld();
  map.skyMat.uniforms.uInvProj.value.copy(cam.projectionMatrixInverse);
  map.skyMat.uniforms.uCamWorld.value.copy(cam.matrixWorld);
  renderer.render(scene, cam);
  map.dist = dist;
  updateLabels();
}

/** 바닥에 붙은 띠(도로·선로·경로). 멀리서도 최소 굵기를 지킨다. */
function ribbonMaterial(color, { minPx = 1, opacity = 1, dash = 0, depthTest = true, order = 0 } = {}) {
  const m = new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity, depthWrite: false, depthTest, side: THREE.DoubleSide });
  const uMinPx = { value: minPx };
  const uDash = { value: dash };
  m.userData = { uMinPx, uDash, order };
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uPix = U.pix;
    sh.uniforms.uMinPx = uMinPx;
    sh.uniforms.uDash = uDash;
    sh.vertexShader = sh.vertexShader
      .replace(
        '#include <common>',
        `#include <common>
attribute vec3 aSide; attribute float aDist; uniform float uPix; uniform float uMinPx; varying float vDist; varying float vScale;`,
      )
      .replace(
        '#include <begin_vertex>',
        `float camD = distance(cameraPosition, position);
float hw = max(aSide.z, camD * uPix * uMinPx * 0.5);
vec3 transformed = position + vec3(aSide.x, 0.0, aSide.y) * hw;
vDist = aDist; vScale = max(hw * 2.0, 1.0);`,
      );
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
uniform float uDash; varying float vDist; varying float vScale;`)
      .replace(
        '#include <color_fragment>',
        `#include <color_fragment>
if (uDash > 0.5 && fract(vDist / (vScale * 3.2)) > 0.55) discard;`,
      );
  };
  m.customProgramCacheKey = () => 'ribbon';
  return m;
}

function buildingMaterial() {
  const m = new THREE.MeshLambertMaterial({ color: '#ffffff' });
  const cats = CAT_COLORS.map((c) => {
    const col = new THREE.Color(c);
    return new THREE.Vector3(col.r, col.g, col.b);
  });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uNight = U.night;
    sh.uniforms.uLit = U.lit;
    sh.uniforms.uCat = { value: cats };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
attribute vec4 aInfo; varying vec4 vInfo; varying vec3 vWP; varying vec3 vWN;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
vInfo = aInfo; vWP = (modelMatrix * vec4(transformed, 1.0)).xyz; vWN = normal;`);
    sh.fragmentShader = sh.fragmentShader
      .replace(
        '#include <common>',
        `#include <common>
varying vec4 vInfo; varying vec3 vWP; varying vec3 vWN; uniform float uNight; uniform float uLit; uniform vec3 uCat[8];
float hsh(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float gWin; vec2 gCell; float gAA; float gSeed;`,
      )
      .replace(
        '#include <color_fragment>',
        `#include <color_fragment>
{
  gSeed = vInfo.x / 255.0;
  int cat = int(vInfo.y + 0.5);
  float roof = vInfo.z;
  vec3 base = uCat[cat] * (0.92 + 0.13 * gSeed);
  base *= mix(1.0, 0.95, roof);
  base *= mix(0.8, 1.0, smoothstep(0.0, 10.0, vWP.y));
  vec2 t = normalize(vec2(-vWN.z, vWN.x) + 1e-5);
  float u = dot(vWP.xz, t);
  vec2 cell = vec2(u / 3.1, (vWP.y - 0.4) / 3.3);
  gCell = floor(cell);
  vec2 f = fract(cell);
  float fw = max(fwidth(cell.x), fwidth(cell.y));
  gAA = 1.0 - smoothstep(0.22, 0.7, fw);
  float w = step(0.18, f.x) * step(f.x, 0.82) * step(0.3, f.y) * step(f.y, 0.82);
  float hasWin = (1.0 - roof) * step(3.4, vWP.y) * ((cat == 3 || cat == 4 || cat == 7) ? 0.0 : 1.0);
  gWin = mix(0.42, w, gAA) * hasWin;
  base = mix(base, base * vec3(0.78, 0.84, 0.93), gWin * 0.5 * (1.0 - uNight));
  base *= 1.0 - gWin * 0.5 * uNight;
  diffuseColor.rgb = base;
}`,
      )
      .replace(
        '#include <emissivemap_fragment>',
        `#include <emissivemap_fragment>
{
  float lit = uLit * (0.45 + 1.0 * fract(gSeed * 7.13));
  float on = step(1.0 - lit, hsh(gCell * 1.37 + gSeed * 91.7));
  float glow = mix(lit * 0.45, on, gAA) * gWin;
  vec3 wc = mix(vec3(1.0, 0.72, 0.4), vec3(0.78, 0.87, 1.0), step(0.8, hsh(gCell * 2.11 + gSeed * 13.0)));
  float shop = (1.0 - vInfo.z) * (1.0 - step(3.4, vWP.y)) * step(0.3, vWP.y) * step(fract(gSeed * 3.7), 0.65) * (abs(vWN.y) < 0.5 ? 1.0 : 0.0);
  totalEmissiveRadiance += (wc * glow * 1.05 + vec3(1.0, 0.82, 0.55) * shop * 0.6) * uNight;
}`,
      );
  };
  m.customProgramCacheKey = () => 'osaka-bld-1';
  return m;
}

// ── 띠 만들기 ─────────────────────────────────────────────

/** lines: [{pts: [[x,y],...], hw, y}] → 띠 지오메트리(위치·옆방향·누적거리) */
function ribbonGeometry(lines) {
  let nv = 0;
  let ni = 0;
  for (const l of lines) {
    nv += l.pts.length * 2;
    ni += (l.pts.length - 1) * 6;
  }
  const pos = new Float32Array(nv * 3);
  const side = new Float32Array(nv * 3);
  const dist = new Float32Array(nv);
  const idx = nv > 65535 ? new Uint32Array(ni) : new Uint16Array(ni);
  let v = 0;
  let k = 0;
  for (const l of lines) {
    const p = l.pts;
    const n = p.length;
    let acc = 0;
    for (let i = 0; i < n; i++) {
      if (i > 0) acc += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
      let dx0 = 0, dy0 = 0, dx1 = 0, dy1 = 0;
      if (i > 0) {
        dx0 = p[i][0] - p[i - 1][0];
        dy0 = p[i][1] - p[i - 1][1];
        const L = Math.hypot(dx0, dy0) || 1;
        dx0 /= L;
        dy0 /= L;
      }
      if (i < n - 1) {
        dx1 = p[i + 1][0] - p[i][0];
        dy1 = p[i + 1][1] - p[i][1];
        const L = Math.hypot(dx1, dy1) || 1;
        dx1 /= L;
        dy1 /= L;
      }
      if (i === 0) [dx0, dy0] = [dx1, dy1];
      if (i === n - 1) [dx1, dy1] = [dx0, dy0];
      let tx = dx0 + dx1;
      let ty = dy0 + dy1;
      const tl = Math.hypot(tx, ty);
      if (tl < 1e-6) {
        tx = dx1;
        ty = dy1;
      } else {
        tx /= tl;
        ty /= tl;
      }
      // 꺾이는 곳은 옆으로 더 벌린다(너무 뾰족하면 줄인다).
      let nx = -ty;
      let ny = tx;
      const miter = 1 / Math.max(0.35, nx * -dy1 + ny * dx1);
      nx *= Math.min(miter, 2.5);
      ny *= Math.min(miter, 2.5);
      for (const s of [1, -1]) {
        pos[v * 3] = p[i][0];
        pos[v * 3 + 1] = l.y;
        pos[v * 3 + 2] = -p[i][1];
        side[v * 3] = nx * s;
        side[v * 3 + 1] = -ny * s;
        side[v * 3 + 2] = l.hw;
        dist[v] = acc;
        v++;
      }
      if (i < n - 1) {
        const a = v - 2;
        idx[k++] = a;
        idx[k++] = a + 1;
        idx[k++] = a + 2;
        idx[k++] = a + 1;
        idx[k++] = a + 3;
        idx[k++] = a + 2;
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSide', new THREE.BufferAttribute(side, 3));
  g.setAttribute('aDist', new THREE.BufferAttribute(dist, 1));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.computeBoundingSphere();
  // 띠는 옆으로 벌어지므로 경계를 넉넉히
  g.boundingSphere.radius += 60;
  return g;
}

// ── 도시 세우기 ───────────────────────────────────────────

async function buildCity(bin, progress) {
  const { scene } = map;
  const ix = META.index;
  const Q = META.quant;
  const box = META.box;

  // 바깥 땅과 바다(사각형 전체를 바다로 깔고 그 위에 땅을 덮는다)
  const outside = new THREE.Mesh(new THREE.PlaneGeometry(240000, 240000).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ depthWrite: false }));
  outside.position.copy(map.center);
  outside.renderOrder = -30;
  map.mats.outside = outside.material;
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(box.x1 - box.x0, box.y1 - box.y0).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ depthWrite: false }));
  sea.position.copy(map.center);
  sea.renderOrder = -29;
  map.mats.sea = sea.material;
  scene.add(outside, sea);

  // 바닥 다각형
  {
    const S = ix.polygons;
    const rk = new Reader(bin, S.streams.kind);
    const rr = new Reader(bin, S.streams.rings);
    const rv = new Reader(bin, S.streams.verts);
    const rxy = new Reader(bin, S.streams.xy);
    const groups = {};
    let px = 0;
    let py = 0;
    for (let i = 0; i < S.count; i++) {
      const kind = rk.u();
      const nr = rr.u();
      const rings = [];
      for (let r = 0; r < nr; r++) {
        const nv = rv.u();
        const ring = [];
        for (let j = 0; j < nv; j++) {
          px += rxy.s();
          py += rxy.s();
          ring.push(new THREE.Vector2(px * Q, py * Q));
        }
        rings.push(ring);
      }
      const g = (groups[kind] ??= { pos: [], idx: [] });
      const base = g.pos.length / 3;
      const tris = THREE.ShapeUtils.triangulateShape(rings[0], rings.slice(1));
      for (const ring of rings) for (const p of ring) g.pos.push(p.x, 0, -p.y);
      for (const t of tris) g.idx.push(base + t[0], base + t[1], base + t[2]);
    }
    for (const [kind, g] of Object.entries(groups)) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(g.pos, 3));
      geo.setIndex(g.idx);
      const mat = new THREE.MeshBasicMaterial({ depthWrite: false, side: THREE.DoubleSide });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.renderOrder = POLY_ORDER[kind] ?? -26;
      mesh.frustumCulled = false;
      map.mats[POLY_KEY[kind]] = mat;
      scene.add(mesh);
    }
  }
  progress(0.08);
  await nextFrame();

  // 도로·선로·운하
  {
    const S = ix.lines;
    const rk = new Reader(bin, S.streams.kind);
    const rc = new Reader(bin, S.streams.color);
    const rv = new Reader(bin, S.streams.verts);
    const rxy = new Reader(bin, S.streams.xy);
    const groups = new Map();
    let px = 0;
    let py = 0;
    for (let i = 0; i < S.count; i++) {
      const kind = rk.u();
      const color = rc.u();
      const nv = rv.u();
      const pts = [];
      for (let j = 0; j < nv; j++) {
        px += rxy.s();
        py += rxy.s();
        pts.push([px * Q, py * Q]);
      }
      const key = `${kind}|${kind === 22 || kind === 25 ? color : 0}`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push({ pts, hw: LINE_STYLE[kind]?.[0] ?? 2, y: 0 });
    }
    for (const [key, list] of groups) {
      const [kind, color] = key.split('|').map(Number);
      const [, minPx, order] = LINE_STYLE[kind] ?? [2, 1, -12];
      const sub = kind === 22 || kind === 25;
      const mat = ribbonMaterial('#ffffff', { minPx, opacity: sub ? (kind === 22 ? 0.42 : 0.85) : 1 });
      if (sub) mat.color.set(color ? META.palette[color] : '#8a8f99');
      else map.mats[`k${kind}`] = mat;
      const mesh = new THREE.Mesh(ribbonGeometry(list), mat);
      mesh.renderOrder = order;
      mesh.frustumCulled = false;
      scene.add(mesh);
    }
  }
  progress(0.16);
  await nextFrame();

  // 나무
  {
    const S = ix.trees;
    const rxy = new Reader(bin, S.streams.xy);
    if (S.count) {
    const geo = new THREE.IcosahedronGeometry(1, 0).scale(4.2, 5, 4.2).translate(0, 6, 0);
    const mat = new THREE.MeshLambertMaterial({ color: '#ffffff', flatShading: true });
    const mesh = new THREE.InstancedMesh(geo, mat, S.count);
    const m4 = new THREE.Matrix4();
    const col = new THREE.Color();
    let px = 0;
    let py = 0;
    for (let i = 0; i < S.count; i++) {
      px += rxy.s();
      py += rxy.s();
      const r = Math.sin(i * 12.9898) * 43758.5453;
      const f = r - Math.floor(r);
      const s = 0.75 + f * 0.6;
      m4.makeRotationY(f * 6.28).scale(new THREE.Vector3(s, s * (0.9 + f * 0.3), s)).setPosition(px * Q, 0, -py * Q);
      mesh.setMatrixAt(i, m4);
      mesh.setColorAt(i, col.setHSL(0.27 + f * 0.06, 0.38 + f * 0.12, 0.42 + f * 0.1));
    }
    mesh.computeBoundingSphere();
    map.mats.tree = mat;
    scene.add(mesh);
    }
  }
  progress(0.2);
  await nextFrame();

  // 건물: 400m 칸마다 하나로 합쳐 그린다.
  {
    const S = ix.buildings;
    const rr = new Reader(bin, S.streams.rings);
    const rv = new Reader(bin, S.streams.verts);
    const rh = new Reader(bin, S.streams.h);
    const rm = new Reader(bin, S.streams.min);
    const rc = new Reader(bin, S.streams.cat);
    const rxy = new Reader(bin, S.streams.xy);
    const mat = buildingMaterial();
    map.mats.building = mat;
    const cell = META.cell;
    const chunks = new Map();
    let px = 0;
    let py = 0;
    let verts = 0;
    const flush = (ch) => {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(ch.pos, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(ch.nor, 3));
      g.setAttribute('aInfo', new THREE.Uint8BufferAttribute(ch.inf, 4));
      g.setIndex(ch.pos.length / 3 > 65535 ? new THREE.Uint32BufferAttribute(ch.idx, 1) : new THREE.Uint16BufferAttribute(ch.idx, 1));
      g.computeBoundingSphere();
      const mesh = new THREE.Mesh(g, mat);
      scene.add(mesh);
      verts += ch.pos.length / 3;
    };
    for (let i = 0; i < S.count; i++) {
      const nr = rr.u();
      const h = rh.u() / 10;
      const min = rm.u() / 10;
      const cat = rc.u() >> 2;
      const rings = [];
      for (let r = 0; r < nr; r++) {
        const nv = rv.u();
        const ring = new Array(nv);
        for (let j = 0; j < nv; j++) {
          px += rxy.s();
          py += rxy.s();
          ring[j] = [px * Q, py * Q];
        }
        rings.push(ring);
      }
      const f = rings[0][0];
      const key = Math.floor((f[1] - box.y0) / cell) * 1000 + Math.floor((f[0] - box.x0) / cell);
      let ch = chunks.get(key);
      if (!ch) chunks.set(key, (ch = { pos: [], nor: [], inf: [], idx: [] }));
      addBuilding(ch, rings, h, min, cat, (Math.imul(i + 1, 2654435761) >>> 24) & 255);
      if (ch.pos.length > 600000) {
        flush(ch);
        chunks.delete(key);
      }
      if (i % 1500 === 0) {
        progress(0.2 + 0.78 * (i / S.count));
        await nextFrame();
      }
    }
    for (const ch of chunks.values()) flush(ch);
    map.buildingVerts = verts;
  }
  progress(1);
}

function addBuilding(ch, rings, h, min, cat, seed) {
  const { pos, nor, inf, idx } = ch;
  for (const ring of rings) {
    const n = ring.length;
    for (let i = 0; i < n; i++) {
      const a = ring[i];
      const b = ring[(i + 1) % n];
      let nx = b[1] - a[1];
      let ny = -(b[0] - a[0]);
      const L = Math.hypot(nx, ny);
      if (L < 1e-6) continue;
      nx /= L;
      ny /= L;
      const v = pos.length / 3;
      pos.push(a[0], min, -a[1], b[0], min, -b[1], b[0], h, -b[1], a[0], h, -a[1]);
      for (let k = 0; k < 4; k++) {
        nor.push(nx, 0, -ny);
        inf.push(seed, cat, 0, 0);
      }
      idx.push(v, v + 1, v + 2, v, v + 2, v + 3);
    }
  }
  const contour = rings[0].map((p) => new THREE.Vector2(p[0], p[1]));
  const holes = rings.slice(1).map((r) => r.map((p) => new THREE.Vector2(p[0], p[1])));
  let tris;
  try {
    tris = THREE.ShapeUtils.triangulateShape(contour, holes);
  } catch {
    return;
  }
  const all = rings.flat();
  const v0 = pos.length / 3;
  for (const p of all) {
    pos.push(p[0], h, -p[1]);
    nor.push(0, 1, 0);
    inf.push(seed, cat, 1, 0);
  }
  for (const t of tris) {
    const A = all[t[0]];
    const B = all[t[1]];
    const C = all[t[2]];
    const cross = (B[0] - A[0]) * (C[1] - A[1]) - (B[1] - A[1]) * (C[0] - A[0]);
    if (cross >= 0) idx.push(v0 + t[0], v0 + t[1], v0 + t[2]);
    else idx.push(v0 + t[0], v0 + t[2], v0 + t[1]);
  }
}

// ── 시간(해·달·창문 불빛) ─────────────────────────────────

const C = (h) => new THREE.Color(h);
const SKY = {
  dayTop: C('#79aee0'), dayHor: C('#dfe9f1'),
  duskTop: C('#5d76b3'), duskHor: C('#f4b58a'),
  nightTop: C('#060b18'), nightHor: C('#1b2640'),
};

function setTime(h, date) {
  map.time = h;
  date ??= DAYS[map.dayIndex].date;
  const sp = sunPos(date, h);
  const night = smooth(3, -7, sp.el);
  const dusk = Math.exp(-(((sp.el - 2) / 6.5) ** 2));
  U.night.value = night;
  const az = sp.az * RAD;
  const el = Math.max(sp.el, 2) * RAD;
  const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el));
  map.sun.position.copy(map.controls.target).addScaledVector(dir, 3000);
  map.sun.target.position.copy(map.controls.target);
  map.sun.intensity = 2.3 * smooth(-3, 8, sp.el);
  map.sun.color.setRGB(1, 1, 1).lerp(C('#ffb27a'), dusk * 0.85);
  map.hemi.intensity = lerp(1.65, 0.32, night);
  map.hemi.color.set('#ffffff').lerp(C('#5f74a6'), night);
  map.hemi.groundColor.set('#b9b2a6').lerp(C('#1d2232'), night);
  map.moon.intensity = 0.55 * night;

  const top = SKY.dayTop.clone().lerp(SKY.duskTop, dusk * 0.6).lerp(SKY.nightTop, night);
  const hor = SKY.dayHor.clone().lerp(SKY.duskHor, dusk * 0.75).lerp(SKY.nightHor, night);
  map.sky.top.copy(top);
  map.sky.hor.copy(hor);
  map.sky.sunDir.copy(dir);
  map.sky.sunCol.set('#fff3dc').lerp(C('#ff9c5a'), dusk);
  map.scene.fog.color.copy(hor);
  map.renderer.setClearColor(hor);

  for (const [k, mat] of Object.entries(map.mats)) {
    const d = PAL.day[k];
    const n = PAL.night[k];
    if (!d || !mat.color) continue;
    mat.color.set(d).lerp(C(n), night);
  }
  for (const m of map.routeMats ?? []) m.userData.night?.(night);
  document.body.classList.toggle('night', night > 0.5);
  const out = $('#tod-out');
  if (out) out.textContent = hm(h);
  const input = $('#tod');
  if (input && Math.abs(+input.value - h) > 0.01) input.value = String(Math.round(h * 4) / 4);
  requestRender();
}

// ── 카메라 ────────────────────────────────────────────────

/** 지금 카메라를 (기준점, 거리, 기울기, 방향)으로 */
function camState() {
  const { cam, controls } = map;
  const off = cam.position.clone().sub(controls.target);
  const s = new THREE.Spherical().setFromVector3(off);
  return { target: controls.target.clone(), dist: s.radius, polar: s.phi, az: s.theta };
}

/** 카메라를 부드럽게 옮긴다. 먼 거리는 살짝 올라갔다 내려온다. */
function flyTo({ target, dist, polar, az }, dur = 1.4) {
  const a = camState();
  const b = { target: target ?? a.target, dist: dist ?? a.dist, polar: polar ?? a.polar, az: az ?? a.az };
  let dAz = b.az - a.az;
  dAz = Math.atan2(Math.sin(dAz), Math.cos(dAz));
  const travel = a.target.distanceTo(b.target);
  const hop = Math.max(0, travel * 0.55 - (a.dist + b.dist) / 2);
  map.anims = map.anims.filter((x) => !x.camera);
  return new Promise((done) => {
    map.anims.push({
      camera: true,
      t: 0,
      dur: travel < 1 && Math.abs(a.dist - b.dist) < 1 ? 0.3 : dur,
      step(k) {
        const e = ease(k);
        const t = a.target.clone().lerp(b.target, e);
        const d = Math.exp(lerp(Math.log(a.dist), Math.log(b.dist), e)) + hop * Math.sin(Math.PI * e);
        const s = new THREE.Spherical(d, lerp(a.polar, b.polar, e), a.az + dAz * e);
        map.controls.target.copy(t);
        map.cam.position.copy(t).add(new THREE.Vector3().setFromSpherical(s));
        map.cam.lookAt(t);
        map.dirty = true;
      },
      done,
    });
  });
}

/** 점들([x,y])이 화면에 다 들어오게 */
function fitPoints(pts, { pad = 1.3, polar = 0.82, dur = 1.4, minDist = 260, az } = {}) {
  if (!pts.length) return Promise.resolve();
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of pts) {
    x0 = Math.min(x0, x);
    y0 = Math.min(y0, y);
    x1 = Math.max(x1, x);
    y1 = Math.max(y1, y);
  }
  const { cam } = map;
  const tanV = Math.tan((cam.fov * RAD) / 2);
  const w = (x1 - x0) * pad;
  const h = (y1 - y0) * pad;
  const r = Math.max(h / 2 / tanV, w / 2 / (tanV * cam.aspect)) * 1.08;
  return flyTo({ target: W((x0 + x1) / 2, (y0 + y1) / 2), dist: Math.max(minDist, r), polar, az }, dur);
}

function flyToPlace(x, y, { dist = 520, polar = 0.95, dur = 1.5 } = {}) {
  return flyTo({ target: W(x, y), dist, polar }, dur);
}

// ── 이름표 ────────────────────────────────────────────────

/**
 * kind: pin | leg | stn | hood | token
 * prio가 큰 것부터 자리를 잡고, 겹치면 숨긴다(핀은 이름만 숨긴다).
 */
function addLabel(kind, html, x, y, { prio = 0, h = 0, cls = '', css = '', group = 'base', minD = 0, maxD = Infinity, onClick } = {}) {
  const el = document.createElement('div');
  el.className = `lbl ${kind} ${cls} off`;
  if (css) el.style.cssText = css;
  el.style.zIndex = String(Math.round(prio * 10));
  el.innerHTML = html;
  $('#labels').appendChild(el);
  const l = { kind, el, pos: W(x, y, h), prio, group, minD, maxD, w: 0, h: 0, bw: 26 };
  if (onClick) el.addEventListener('click', (e) => (e.stopPropagation(), onClick()));
  map.labels.push(l);
  measure(l);
  return l;
}

function measure(l) {
  l.w = l.el.offsetWidth;
  l.h = l.el.offsetHeight;
  const b = l.el.querySelector('.bul');
  if (b) l.bw = b.offsetWidth + 4;
}

function removeLabels(group) {
  map.labels = map.labels.filter((l) => {
    if (l.group !== group) return true;
    l.el.remove();
    return false;
  });
}

const _v = new THREE.Vector3();
function updateLabels() {
  const { cam } = map;
  const w = map.host.clientWidth;
  const h = map.host.clientHeight;
  const dist = map.dist ?? 1000;
  const placed = [];
  const hit = (r) => placed.some((p) => r.x < p.x + p.w && r.x + r.w > p.x && r.y < p.y + p.h && r.y + r.h > p.y);
  const sorted = map.labels.slice().sort((a, b) => b.prio - a.prio);
  for (const l of sorted) {
    _v.copy(l.pos).project(cam);
    const show = _v.z < 1 && dist >= l.minD && dist <= l.maxD && !l.hidden;
    const sx = ((_v.x + 1) / 2) * w;
    const sy = ((1 - _v.y) / 2) * h;
    if (!show || sx < -60 || sx > w + 60 || sy < -40 || sy > h + 60) {
      l.el.classList.add('off');
      continue;
    }
    let x;
    let y;
    if (l.kind === 'pin') {
      x = sx - 13;
      y = sy - l.h;
    } else {
      x = sx - l.w / 2;
      y = sy - l.h / 2;
    }
    if (l.kind === 'pin' || l.kind === 'token') {
      const full = { x, y, w: l.w, h: l.h };
      const small = { x, y, w: l.bw, h: l.h };
      const nmOk = l.kind === 'token' || !hit(full);
      l.el.classList.toggle('hide-nm', !nmOk && !l.el.classList.contains('on'));
      placed.push(nmOk || l.el.classList.contains('on') ? full : small);
    } else {
      const r = { x: x - 3, y: y - 2, w: l.w + 6, h: l.h + 4 };
      if (hit(r)) {
        l.el.classList.add('off');
        continue;
      }
      placed.push(r);
    }
    l.el.classList.remove('off');
    l.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
  }
}

/** 동네·물·랜드마크 이름표(늘 있는 것) */
function addBaseLabels() {
  for (const hd of META.hoods) addLabel('hood', `<span>${esc(hd.ko)}</span>`, hd.x, hd.y, { prio: 1, minD: 700 });
  for (const wl of META.waterLabels) addLabel('hood', `<span>${esc(wl.ko)}</span>`, wl.x, wl.y, { prio: 0.5, cls: 'water', minD: 500 });
  const KO = { あべのハルカス: '아베노 하루카스' };
  for (const lm of META.landmarks) {
    const ko = Object.entries(KO).find(([ja]) => lm.name.includes(ja))?.[1];
    if (ko) addLabel('hood', `<span>${esc(ko)} ${lm.h}m</span>`, lm.x, lm.y, { prio: 2, cls: 'mark', h: lm.h + 8, maxD: 6000 });
  }
}

// ── 날짜별 동선: 핀, 경로선, 구간 칩, 역 ─────────────────────

/** 그날 핀 목록. 숙소·공항은 그림, 나머지는 순서 번호. */
function dayPins(di) {
  const d = DAYS[di];
  const pins = [];
  const get = (place) => {
    let p = pins.find((x) => x.place === place);
    if (!p) pins.push((p = { place, items: [], via: false }));
    return p;
  };
  d.items.forEach((it, i) => {
    if (it.place) get(it.place).items.push(i);
    for (const v of it.via) {
      const p = get(v);
      p.via = true;
      p.items.push(i);
    }
  });
  let n = 0;
  for (const p of pins) {
    if (p.place === 'hotel') p.icon = '숙';
    else if (p.place === 'kix') p.icon = '✈';
    else if (!p.via) p.n = ++n;
  }
  for (const p of pins) if (p.via) p.icon = '·';
  return pins;
}

/** 일정 항목 하나의 번호 원 글자 */
function itemBullet(di, i) {
  const it = DAYS[di].items[i];
  if (it.far) return '✈';
  if (it.move) return '→';
  const p = map.pins?.[di]?.find((x) => x.place === it.place) ?? dayPins(di).find((x) => x.place === it.place);
  return p ? (p.n ?? p.icon) : '·';
}

function pathMid(path) {
  let total = 0;
  for (let i = 1; i < path.length; i++) total += Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]);
  let acc = 0;
  for (let i = 1; i < path.length; i++) {
    const s = Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]);
    if (acc + s >= total / 2) {
      const t = (total / 2 - acc) / (s || 1);
      return [lerp(path[i - 1][0], path[i][0], t), lerp(path[i - 1][1], path[i][1], t)];
    }
    acc += s;
  }
  return path[0];
}

function pointAt(path, k) {
  let total = 0;
  const seg = [];
  for (let i = 1; i < path.length; i++) {
    const s = Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]);
    seg.push(s);
    total += s;
  }
  let want = total * clamp(k, 0, 1);
  for (let i = 1; i < path.length; i++) {
    if (want <= seg[i - 1]) {
      const t = want / (seg[i - 1] || 1);
      return [lerp(path[i - 1][0], path[i][0], t), lerp(path[i - 1][1], path[i][1], t)];
    }
    want -= seg[i - 1];
  }
  return path.at(-1);
}

const airportKm = () => {
  const e = TRIP.airportEdge;
  const k = PLACES.kix;
  return e ? Math.round(Math.hypot(k.x - e[0], k.y - e[1]) / 1000) : 40;
};

function placeXY(key) {
  if (key === 'kix') return TRIP.airportEdge ?? [PLACES.namba.x, PLACES.namba.y - 4000];
  const p = PLACES[key];
  return [p.x, p.y];
}

function legLabel(L) {
  if (L.mode === 'walk') return `도보 ${L.min}분`;
  return LINES[L.line].name;
}

function stationKo(ref) {
  if (ref === 'kix') return '간사이공항';
  if (ref.startsWith('st:')) return TRIP.stations[ref.slice(3)].ko;
  return PLACES[ref]?.short ?? ref;
}

/** 철도 구간 설명: 몇 정거장, 대략 몇 분 */
function railInfo(L) {
  if (L.line === 'NK' || L.line === 'RP') {
    const opt = TRIP.airport.find((o) => (L.line === 'NK' ? o.match.includes('공항급행') : o.match.includes('라피트')));
    return { stops: null, mins: opt?.mins ?? '', text: `${stationKo(L.from)} → ${stationKo(L.to)}` };
  }
  const n = Math.max(1, (L.stops?.length ?? 2) - 1);
  return { stops: n, mins: `약 ${n * 2 + 1}분`, text: `${stationKo(L.from)} → ${stationKo(L.to)}`, via: (L.stops ?? []).slice(1, -1) };
}

function drawDay(di) {
  const { scene } = map;
  removeLabels('day');
  if (map.routeGroup) {
    scene.remove(map.routeGroup);
    map.routeGroup.traverse((o) => {
      o.geometry?.dispose();
      o.material?.dispose?.();
    });
  }
  const d = DAYS[di];
  const g = new THREE.Group();
  map.routeGroup = g;
  map.routeMats = [];
  scene.add(g);
  map.pins ??= {};
  const pins = (map.pins[di] = dayPins(di));

  // 경로선: 흰 테두리 + 색 띠, 그리고 건물에 가려도 흐리게 보이는 한 벌 더
  const add = (lines, color, { hw, minPx, dash = 0, y }) => {
    if (!lines.length) return;
    const list = lines.map((p) => ({ pts: p, hw, y }));
    const geoCase = ribbonGeometry(lines.map((p) => ({ pts: p, hw: hw * 1.6, y: y - 0.1 })));
    const geo = ribbonGeometry(list);
    const mCase = ribbonMaterial('#ffffff', { minPx: minPx + 3.5 });
    const m = ribbonMaterial(color, { minPx, dash });
    const ghost = ribbonMaterial(color, { minPx, dash, opacity: 0.32, depthTest: false });
    const a = new THREE.Mesh(geoCase, mCase);
    const b = new THREE.Mesh(geo, m);
    const c = new THREE.Mesh(geo, ghost);
    a.renderOrder = 10;
    b.renderOrder = 11;
    c.renderOrder = 12;
    for (const x of [a, b, c]) {
      x.frustumCulled = false;
      g.add(x);
    }
    mCase.userData.night = (n) => mCase.color.set('#ffffff').lerp(new THREE.Color('#2a3142'), n * 0.7);
    map.routeMats.push(mCase);
  };
  const walk = [];
  const rails = {};
  for (const id of d.legs) {
    const L = LEGS[id];
    if (L.mode === 'walk') walk.push(L.path);
    else (rails[L.line] ??= []).push(L.path);
  }
  for (const [line, paths] of Object.entries(rails)) add(paths, LINES[line].color, { hw: 5.5, minPx: 5.5, y: 2.2 });
  add(walk, d.color, { hw: 3.2, minPx: 4.5, dash: 1, y: 1.6 });

  // 구간 칩
  for (const id of d.legs) {
    const L = LEGS[id];
    if (L.mode === 'walk' && L.dist < 120) continue;
    const [x, y] = pathMid(L.path);
    const c = L.mode === 'walk' ? d.color : LINES[L.line].color;
    addLabel('leg', `<span style="--c:${c}">${L.mode === 'walk' ? '🚶' : 'Ⓜ'} ${esc(legLabel(L))}</span>`, x, y, {
      group: 'day',
      prio: 3,
      maxD: L.mode === 'walk' ? 3200 : 9000,
      h: 4,
      onClick: () => focusLeg(id),
    });
  }

  // 역
  const seen = new Set();
  for (const id of d.legs) {
    const L = LEGS[id];
    if (L.mode !== 'rail') continue;
    for (const ref of [L.from, L.to]) {
      if (!ref.startsWith('st:') || seen.has(ref)) continue;
      seen.add(ref);
      const s = TRIP.stations[ref.slice(3)];
      addLabel('stn', `<span><i style="--c:${LINES[L.line].color}"></i>${esc(s.ko)}역</span>`, s.x, s.y, { group: 'day', prio: 2.5, maxD: 6000, h: 3 });
    }
  }

  // 핀
  for (const p of pins) {
    const [x, y] = placeXY(p.place);
    const it = d.items[p.items[0]];
    const pl = PLACES[p.place];
    let html;
    let cls = '';
    let css = `--c:${d.color}`;
    if (p.place === 'kix') {
      html = `<b class="bul ico">✈</b><span class="nm">간사이공항 방면 · 약 ${airportKm()}km</span>`;
      cls = 'edge';
      css = '--c:#1b1d22';
    } else if (p.via) {
      html = `<b class="bul ghost">·</b><span class="nm">${esc(pl.short)}</span>`;
    } else {
      html = `<b class="bul${p.icon ? ' ico' : ''}">${p.n ?? p.icon}</b><span class="nm">${esc(pl.short)}</span>${p.place === 'hotel' ? '' : `<em class="tm">${esc(it.time)}</em>`}`;
    }
    p.label = addLabel('pin', html, x, y, {
      group: 'day',
      prio: p.place === 'kix' ? 9 : p.via ? 4 : 6 - p.items[0] * 0.01,
      cls,
      css,
      onClick: () => selectItem(di, p.items[0]),
    });
    // 바닥 표시
    if (p.place !== 'kix') {
      const ring = new THREE.Mesh(new THREE.RingGeometry(p.via ? 5 : 8, p.via ? 8 : 13, 28).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: d.color, depthWrite: false }));
      ring.position.set(x, 0.6, -y);
      ring.renderOrder = 13;
      g.add(ring);
    }
  }
  // 대안 장소(작게)
  d.items.forEach((it, i) => {
    for (const alt of it.alts) {
      if (!alt.place) continue;
      const pl = PLACES[alt.place];
      addLabel('pin', `<b class="bul">대</b><span class="nm">대안 · ${esc(pl.short)}</span>`, pl.x, pl.y, {
        group: 'day',
        prio: 2,
        cls: 'alt',
        css: '--c:#7a7f8a',
        maxD: 2600,
        onClick: () => selectItem(di, i),
      });
    }
  });

  // 고른 곳을 비추는 빛기둥
  const beam = new THREE.Mesh(
    new THREE.CylinderGeometry(4, 4, 160, 20, 1, true).translate(0, 80, 0),
    new THREE.MeshBasicMaterial({ color: d.color, transparent: true, opacity: 0.3, depthWrite: false, side: THREE.DoubleSide }),
  );
  beam.visible = false;
  beam.renderOrder = 14;
  g.add(beam);
  map.beam = beam;
  requestRender();
}

function markSelected(di, i) {
  const pins = map.pins?.[di] ?? [];
  const it = i == null ? null : DAYS[di].items[i];
  for (const p of pins) {
    if (!p.label) continue;
    const on = !!it && p.place === it.place;
    p.label.el.classList.toggle('on', on);
    p.label.el.style.zIndex = on ? '999' : String(Math.round(p.label.prio * 10));
  }
  if (map.beam) {
    const key = it?.place;
    map.beam.visible = !!key && key !== 'kix';
    if (map.beam.visible) {
      const [x, y] = placeXY(key);
      map.beam.position.set(x, 0, -y);
    }
  }
  requestRender();
}

function legsPoints(ids) {
  return ids.flatMap((id) => LEGS[id].path);
}

/** 그날 동선 점들(공항 철도 구간·공항 표시는 빼서 시내가 크게 보이게) */
function dayPoints(di) {
  const pts = legsPoints(DAYS[di].legs.filter((id) => !['NK', 'RP'].includes(LEGS[id].line)));
  for (const p of map.pins?.[di] ?? dayPins(di)) if (p.place !== 'kix') pts.push(placeXY(p.place));
  return pts;
}

function fitDay(di, dur = 1.6) {
  return fitPoints(dayPoints(di), { pad: 1.3, polar: 0.78, dur });
}

function overview(dur = 1.8) {
  const pts = META.areas.flatMap((a) => [
    [a.box.x0, a.box.y0],
    [a.box.x1, a.box.y1],
  ]);
  return fitPoints(pts, { pad: 1.05, polar: 0.72, dur });
}

function focusLeg(id) {
  return fitPoints(LEGS[id].path, { pad: 1.35, polar: 0.8, dur: 1.2, minDist: 380 });
}

const TABS = [
  ['home', '한눈에'],
  ['plan', '일정'],
  ['move', '이동'],
  ['food', '맛집'],
  ['money', '예산'],
  ['prep', '준비'],
];
const CHECK_KEY = 'osaka3d-checks-v1';

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => (el.hidden = true), 2600);
}

const isPhone = () => window.matchMedia('(max-width: 860px)').matches;
const rangeText = () => {
  const [a, b] = [TRIP.trip.start, TRIP.trip.end];
  return `${a.replace(/-/g, '.')}(${DOW[new Date(a + 'T00:00:00Z').getUTCDay()]}) – ${b.slice(5).replace('-', '.')}(${DOW[new Date(b + 'T00:00:00Z').getUTCDay()]})`;
};
const dirLink = (it) => {
  if (it.place === 'hotel') {
    const p = PLACES.hotel;
    return `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=walking`;
  }
  return it.dir;
};
const totalBudget = () => TRIP.budget.items.reduce((s, b) => s + b.price, 0);
const optionalBudget = () => TRIP.budget.items.filter((b) => b.optional).reduce((s, b) => s + b.price, 0);

function ddays(iso) {
  const now = jstNow();
  return Math.round((Date.parse(iso + 'T00:00:00Z') - Date.parse(now.date + 'T00:00:00Z')) / 86400000);
}

  ).join('');

    <div><small>항공</small><b class="num">${t.flights.out.dep}–${t.flights.out.arr}</b><span>${dateLabel(t.flights.out.date)} ${t.flights.out.from} → ${t.flights.out.to}<br>귀국 ${dateLabel(t.flights.back.date)} ${t.flights.back.dep} ${t.flights.back.from} 출발</span></div>
    <div><small>숙소</small><b>福の屋2 · 코즈</b><span>${stay ? `${dateLabel(stay.checkin)}~${dateLabel(stay.checkout)} 2박 · ${esc(stay.price)}${stayPer ? ` → 1인 약 ${yen(stayPer)}` : ''}` : esc(PLACES.hotel.addr)}</span></div>

// ── 일정 ──────────────────────────────────────────────────

function legRow(id, d, example) {
  const L = LEGS[id];
  if (L.mode === 'walk') {
    return `<li class="leg" data-leg="${id}" style="--c:${d.color}"><span class="leg-mode">도보 ${L.min}분</span><span>${esc(stationKo(L.from))} → ${esc(stationKo(L.to))} · ${km(L.dist)}</span></li>`;
  }
  const line = LINES[L.line];
  const r = railInfo(L);
  return `<li class="leg rail" data-leg="${id}" style="--c:${line.color}"><span class="leg-mode rail">${esc(line.name)}</span><span>${esc(r.text)}${r.stops ? ` · ${r.stops}정거장` : ''} · ${esc(r.mins)}${example ? ' · 예시 경로' : ''}${r.via?.length ? `<br><small>지나는 역: ${r.via.map(esc).join(' · ')}</small>` : ''}</span></li>`;
}

function itemTags(it, isNow) {
  const tags = [];
  if (isNow) tags.push('<span class="tag now">지금</span>');
  if (it.alts.length && it.prio === '대표') tags.push('<span class="tag main">대표</span>');
  if (it.booked) tags.push(`<span class="tag ok">✓ ${esc(it.booked)}</span>`);
  if (it.price) tags.push(`<span class="tag">1인 ${yen(it.price)}</span>`);
  else if (it.priceLabel) tags.push(`<span class="tag">${esc(it.priceLabel)}</span>`);
  if (it.hours) tags.push(`<span class="tag warn">🕒 ${esc(it.hours)}</span>`);
  if (it.example) tags.push('<span class="tag">지하철은 예시 경로</span>');
  return tags.length ? `<div class="tags">${tags.join('')}</div>` : '';
}

function itemLinks(it, di, i) {
  const out = [];
  const dir = dirLink(it);
  if (dir) out.push(`<a class="go" href="${esc(dir)}" target="_blank" rel="noopener">길찾기</a>`);
  if (it.map) out.push(`<a href="${esc(it.map)}" target="_blank" rel="noopener">구글 지도</a>`);
  if (it.home) out.push(`<a href="${esc(it.home)}" target="_blank" rel="noopener">홈페이지</a>`);
  if (it.place || it.move) out.push(`<button data-act="fly" data-day="${di}" data-item="${i}">3D 지도에서 보기</button>`);
  return `<div class="links">${out.join('')}</div>`;
}

function renderPlan() {
  const di = state.day;
  const d = DAYS[di];
  const sunset = sunCross(d.date, false);
  const n = dayPins(di).filter((p) => p.n).length;
  let html = `<section class="dayhead">
    <div class="dh-row"><b class="bul xl" style="--c:${d.color}">${d.n}</b>
      <div class="dh-txt"><p class="eyebrow">DAY ${d.n} · ${dateLabel(d.date)}</p><h2>${esc(d.title)}</h2></div></div>
    <p class="dh-sub">${esc(d.desc)}</p>
    <div class="facts">
      <span><small>걷는 거리</small><b>${d.walkKm}km</b></span>
      <span><small>1인 예상 비용</small><b>${yen(d.cost)}</b></span>
      <span><small>해 지는 시간</small><b>${hm(sunset)}</b></span>
      <span><small>들르는 곳</small><b>${n}곳</b></span>
    </div>
    <div class="dh-actions"><button class="btn primary" data-act="tour">▶ 이 날 미리 체험하기</button>
      <div class="navdays"><button class="btn ghost" data-act="prevday" ${di === 0 ? 'disabled' : ''} aria-label="이전 날">‹</button><button class="btn ghost" data-act="nextday" ${di === DAYS.length - 1 ? 'disabled' : ''} aria-label="다음 날">›</button></div>
    </div>
  </section><ol class="timeline">`;
  d.items.forEach((it, i) => {
    for (const id of it.legs) if (!it.move) html += legRow(id, d, it.example);
    const isNow = state.nowDay === di && state.nowItem === i;
    const cls = ['stop', it.far ? 'far' : '', it.soft ? 'soft' : '', state.sel === i ? 'sel' : '', isNow ? 'now' : ''].filter(Boolean).join(' ');
    const pl = it.place ? PLACES[it.place] : null;
    html += `<li class="${cls}" data-item="${i}" id="stop-${di}-${i}">
      <time>${esc(it.time)}</time>
      <b class="bul sm${it.move || it.far ? ' ghost' : ''}" style="--c:${d.color}">${itemBullet(di, i)}</b>
      <div class="st-body">
        <h3>${esc(it.name)}</h3>
        ${itemTags(it, isNow)}
        ${it.warn ? `<p class="warn-line">⚠ ${esc(it.warn)}</p>` : ''}
        ${it.memo ? `<p class="memo">${esc(it.memo)}</p>` : ''}
        <div class="meta">
          ${pl && !pl.offmap ? `<span>📍 ${esc(pl.name)}${pl.addr ? ` · ${esc(pl.addr)}` : ''}</span>` : it.addr ? `<span>📍 ${esc(it.addr)}</span>` : ''}
          ${it.phone ? `<span>☎ <a href="tel:${esc(it.phone.replace(/[^\d+]/g, ''))}">${esc(it.phone)}</a></span>` : ''}
        </div>
        ${it.move ? `<ol class="timeline" style="margin-top:6px">${it.legs.map((id) => legRow(id, d, it.example)).join('')}</ol>` : ''}
        ${itemLinks(it, di, i)}
        ${
          it.alts.length
            ? `<details class="alts"><summary>대안 ${it.alts.length}개 보기</summary>${it.alts
                .map(
                  (a) => `<div class="alt"><b>${esc(a.name)}</b> ${a.price ? `<span class="tag">1인 ${yen(a.price)}</span>` : ''}
                <p>${esc(a.memo)}</p>${a.place || a.dir ? `<div class="links">${a.dir ? `<a href="${esc(a.dir)}" target="_blank" rel="noopener">길찾기</a>` : ''}${a.place ? `<button data-act="flyplace" data-place="${a.place}">3D 지도에서 보기</button>` : ''}</div>` : ''}</div>`,
                )
                .join('')}</details>`
            : ''
        }
      </div></li>`;
    for (const id of it.after) html += legRow(id, d);
  });
  for (const id of d.endLegs ?? []) html += legRow(id, d);
  html += '</ol>';
  return html;
}

function renderMove() {
  let html = `<section class="sec"><p class="eyebrow">이동 · 공항과 지하철</p><h2>공항 ↔ 난바, 4가지 방법</h2>
    <p class="lead">갈 때는 예약 없이 타는 난카이 공항급행, 돌아올 때는 13:00 라피트예요.</p></section><div class="cmp">`;
  for (const o of TRIP.airport) {
    html += `<div class="${o.main ? 'main' : ''}" style="--c:${o.color}"><h4>${esc(o.short)}${o.main ? '<span class="tag main">대표</span>' : ''}</h4>
      <b class="p">${o.price ? yen(o.price) : '-'}</b>
      <ul><li>⏱ ${esc(o.mins)}</li><li>🔁 ${esc(o.every)}</li><li>🚉 ${esc(o.transfer)}</li><li>🎫 ${esc(o.book)}</li></ul></div>`;
  }
  html += `</div><p class="small">시간·간격·요금은 일정 메모에 적힌 값이에요. 지도에는 지도 범위 끝까지만 선로를 그리고, 그 너머는 "간사이공항 방면" 표시로 대신해요.</p>
    <h3 class="h3">날짜별 철도 구간</h3><div class="moves">`;

      html += `<button class="mv" data-legs="${ids.join(',')}" data-day="${di}">
        <span class="mv-h"><b class="bul sm" style="--c:${d.color}">${d.n}</b><time>${esc(it.time)}</time>${esc(it.name)}${it.example ? '<span class="tag">예시 경로</span>' : ''}</span>`;
      for (const id of ids) {

          html += `<span class="seg"><span class="leg-mode">도보</span><span>${esc(stationKo(L.from))} → ${esc(stationKo(L.to))}</span><small>${L.min}분 · ${km(L.dist)}</small></span>`;
        } else {
          const r = railInfo(L);
          html += `<span class="seg" style="--c:${LINES[L.line].color}"><span class="leg-mode rail">${esc(LINES[L.line].name)}</span><span>${esc(r.text)}</span><small>${r.stops ? `${r.stops}정거장 · ` : ''}${esc(r.mins)}</small>${r.via?.length ? `<span class="via">지나는 역: ${r.via.map(esc).join(' · ')}</span>` : ''}</span>`;
        }
      }
      html += '</button>';
    });
  });
  const trans = TRIP.budget.items.filter((b) => b.cat === '교통');
  html += `</div><p class="small">Day2 지하철은 예시 경로예요. 탈 때는 구글 지도 길찾기로 한 번 더 확인하세요. 정거장 수는 OpenStreetMap 노선에서 센 값이고, 시간은 정거장당 2분으로 어림했어요.</p>
    <div class="box"><h4>교통비 (1인)</h4><ul>${trans.map((b) => `<li>${esc(b.name)} <b>${yen(b.price)}</b>${b.note ? ` · <span class="small">${esc(b.note)}</span>` : ''}</li>`).join('')}</ul></div>`;

    <p class="lead">예약한 곳은 초록 표시예요. 줄을 누르면 지도에서 위치를 보여 줘요.</p></section><div class="foodlist">`;

          <span class="small"><a href="${esc(x.dir)}" target="_blank" rel="noopener">길찾기</a> · <a href="${esc(x.map)}" target="_blank" rel="noopener">구글 지도</a></span></div>
          <div class="fr-r"><b>${x.price ? yen(x.price) : '-'}</b>${book}</div></div>`;
