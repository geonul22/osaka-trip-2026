// ── 예산 ──────────────────────────────────────────────────

function bars(rows, max) {
  return `<div class="chart">${rows
    .map((r) => `<div class="crow"><span class="cr-k">${esc(r.k)}${r.sub ? `<small>${esc(r.sub)}</small>` : ''}</span><span class="cr-bar"><span${r.weak ? ' class="weak"' : ''} style="width:${((r.v / max) * 100).toFixed(1)}%"></span></span><span class="cr-v">${yen(r.v)}</span></div>`)
    .join('')}</div>`;
}

function renderMoney() {
  const items = TRIP.budget.items;
  const total = totalBudget();
  const opt = optionalBudget();
  const people = TRIP.trip.people;
  const cats = {};
  for (const b of items) cats[b.cat] = (cats[b.cat] ?? 0) + b.price;
  const catRows = Object.entries(cats)
    .sort((a, b) => b[1] - a[1])
    .map(([k, v]) => ({ k, v, sub: `${Math.round((v / total) * 100)}%` }));
  const dayRows = DAYS.map((d) => ({ k: `Day${d.n}`, sub: dateLabel(d.date), v: d.cost }));
  const maxC = Math.max(...catRows.map((r) => r.v));
  const maxD = Math.max(...dayRows.map((r) => r.v));
  let html = `<section class="sec"><p class="eyebrow">예산 · 1인 기준</p>
    <div class="hero-num"><b>${yen(total)}</b><span>1인 예상 비용 · 선택 항목 빼면 ${yen(total - opt)} · 5명이면 ${yen(total * people)}</span></div></section>
    <h3 class="h3">항목별</h3>${bars(catRows, maxC)}
    <h3 class="h3">날짜별</h3>${bars(dayRows, maxD)}
    <h3 class="h3">자세히</h3><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>항목</th><th>날짜</th><th class="r">1인</th></tr></thead><tbody>`;
  for (const b of items.slice().sort((a, c) => a.day - c.day || c.price - a.price)) {
    html += `<tr><td>${esc(b.name)}${b.optional ? ' <span class="tag">선택</span>' : ''}${b.note ? `<small>${esc(b.note)}</small>` : ''}</td><td>${b.day ? `Day${b.day}` : '-'}</td><td class="r">${yen(b.price)}</td></tr>`;
  }
  html += `</tbody></table></div><div class="box"><h4>참고</h4><ul>${TRIP.budget.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul></div>`;
  if (TRIP.stay) html += `<p class="small">숙박비(${esc(TRIP.stay.price)})는 위 금액에 들어 있지 않아요.</p>`;
  return html;
}

// ── 준비 ──────────────────────────────────────────────────

function checkState() {
  const saved = store.get(CHECK_KEY, {});
  return TRIP.checklist.map((c) => ({ ...c, done: saved[c.id] ?? c.done }));
}
function prepCounts() {
  const list = checkState();
  return { done: list.filter((c) => c.done).length, total: list.length };
}

function renderPrep() {
  const list = checkState();
  const { done, total } = prepCounts();
  const stay = TRIP.stay;
  let html = `<section class="sec"><p class="eyebrow">준비 · 이 기기에 체크가 저장돼요</p><h2>할 일 ${done}/${total}</h2>
    <div class="meter"><span style="width:${((done / total) * 100).toFixed(0)}%"></span></div></section>`;
  const group = (g, title) => {
    const rows = list.filter((c) => c.group === g);
    if (!rows.length) return '';
    let h = `<h3 class="h3">${title}</h3><ul class="checks">`;
    for (const c of rows) {
      const left = c.due ? ddays(c.due) : null;
      const hot = !c.done && left != null && left <= 3;
      const when = c.due ? (c.done ? '완료' : left < 0 ? `${-left}일 지남` : left === 0 ? '오늘까지' : `D-${left}`) : c.done ? '완료' : '';
      h += `<li class="${c.done ? 'done' : ''}${hot ? ' hot' : ''}"><label><input type="checkbox" data-check="${c.id}" ${c.done ? 'checked' : ''}>
        <span>${esc(c.item)}${c.note ? `<small>${esc(c.note)}</small>` : ''}${c.due ? `<small>${dateLabel(c.due)}까지 · ${esc(c.src)}</small>` : ''}</span><em>${when}</em></label></li>`;
    }
    return h + '</ul>';
  };
  html += group('before', '출발 전');
  html += group('during', '여행 중 챙길 것');
  if (stay) {
    const left = ddays(stay.cancelBy);
    html += `<div class="box"><h4>숙소 · ${esc(stay.name)}</h4>
      <p>${dateLabel(stay.checkin)} 체크인 → ${dateLabel(stay.checkout)} 체크아웃 · ${esc(stay.price)}</p>
      <p><b>무료취소 마감 ${dateLabel(stay.cancelBy)}</b> ${left >= 0 ? `(D-${left})` : '(지남)'}</p>
      <p class="small">${esc(stay.note)}</p></div>`;
  }
  return html;
}

// ── 고르기 ────────────────────────────────────────────────

function selectDay(di, { fly = true } = {}) {
  state.day = di;
  state.sel = null;
  map.dayIndex = di;
  if (map.ready) {
    drawDay(di);
    setTime(map.time, DAYS[di].date);
    if (fly) fitDay(di);
  }
  renderHeader();
  renderDayStrip();
  if (['plan', 'home'].includes(state.tab)) renderPanel();
}

function selectItem(di, i, { fly = true, fromList = false } = {}) {
  if (tour.on && !fromList) return;
  if (di !== state.day) selectDay(di, { fly: false });
  state.sel = i;
  markSelected(di, i);
  if (state.tab !== 'plan') {
    state.tab = 'plan';
    renderTabs();
    renderPanel();
  } else {
    $$('.stop.sel').forEach((el) => el.classList.remove('sel'));
  }
  const row = $(`#stop-${di}-${i}`);
  if (row) {
    row.classList.add('sel');
    if (!isPhone()) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    row.classList.remove('flash');
    void row.offsetWidth;
    row.classList.add('flash');
  }
  const it = DAYS[di].items[i];
  if (document.documentElement.classList.contains('maponly')) toast(`${it.time} · ${it.name}`);
  if (fromList && isPhone()) {
    const r = map.host.getBoundingClientRect();
    if (r.bottom < 120) map.host.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  if (!fly) return;
  if (it.move && it.legs.length) fitPoints(legsPoints(it.legs), { pad: 1.2, polar: 0.8 });
  else if (it.place) {
    const [x, y] = placeXY(it.place);
    flyToPlace(x, y, { dist: it.place === 'kix' ? 2200 : 520 });
  } else if (it.far) toast('김포공항은 지도 밖이에요');
}

// ── 이벤트 ────────────────────────────────────────────────

function bindUI() {
  $('#dates').addEventListener('click', (e) => {
    const b = e.target.closest('[data-day]');
    if (b) selectDay(+b.dataset.day);
  });
  $('#daystrip').addEventListener('click', (e) => {
    const b = e.target.closest('[data-day]');
    if (!b) return;
    if (tour.on) stopTour();
    selectDay(+b.dataset.day);
  });
  $('#tabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-tab]');
    if (!b) return;
    state.tab = b.dataset.tab;
    renderTabs();
    renderPanel();
  });
  const body = $('#panel-body');
  body.addEventListener('click', (e) => {
    const t = e.target;
    if (t.closest('a') || t.closest('summary') || t.closest('input') || t.closest('label')) return;
    const act = t.closest('[data-act]');
    if (act) {
      const a = act.dataset.act;
      if (a === 'tour') startTour(state.day);
      else if (a === 'prevday') selectDay(state.day - 1);
      else if (a === 'nextday') selectDay(state.day + 1);
      else if (a === 'fly') selectItem(+act.dataset.day, +act.dataset.item, { fromList: true });
      else if (a === 'flyplace') {
        const p = PLACES[act.dataset.place];
        scrollToMap();
        flyToPlace(p.x, p.y);
      }
      return;
    }
    const tab = t.closest('[data-tab]');
    if (tab) {
      state.tab = tab.dataset.tab;
      renderTabs();
      renderPanel();
      return;
    }
    const dl = t.closest('.dl');
    if (dl) {
      state.tab = 'plan';
      renderTabs();
      selectDay(+dl.dataset.day);
      scrollToMap();
      return;
    }
    const leg = t.closest('[data-leg]');
    if (leg) {
      scrollToMap();
      focusLeg(+leg.dataset.leg);
      return;
    }
    const mv = t.closest('.mv');
    if (mv) {
      const di = +mv.dataset.day;
      if (di !== state.day) selectDay(di, { fly: false });
      scrollToMap();
      fitPoints(legsPoints(mv.dataset.legs.split(',').map(Number)), { pad: 1.2, polar: 0.8 });
      return;
    }
    const fr = t.closest('.fr');
    if (fr) {
      const di = +fr.dataset.day;
      if (di !== state.day) selectDay(di, { fly: false });
      const p = PLACES[fr.dataset.place];
      scrollToMap();
      flyToPlace(p.x, p.y);
      return;
    }
    const stop = t.closest('.stop');
    if (stop) selectItem(state.day, +stop.dataset.item, { fromList: true });
  });
  body.addEventListener('change', (e) => {
    const c = e.target.closest('[data-check]');
    if (!c) return;
    const saved = store.get(CHECK_KEY, {});
    saved[c.dataset.check] = c.checked;
    store.set(CHECK_KEY, saved);
    renderPanel();
  });
  $('.map-tools').addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const a = b.dataset.act;
    if (a === 'day') animateTime(13);
    else if (a === 'night') animateTime(20.5);
    else if (a === 'dayfit') fitDay(state.day);
    else if (a === 'overview') overview();
    else if (a === 'locate') locateMe();
  });
  $('#tod').addEventListener('input', (e) => setTime(+e.target.value));
}

// ── 내 위치 ────────────────────────────────────────────────
const GEO_K = { lat0: 34.666, lon0: 135.475, kx: 91657.3, ky: 110934.0 };
const llToXY = (lat, lon) => ({ x: (lon - GEO_K.lon0) * GEO_K.kx, y: (lat - GEO_K.lat0) * GEO_K.ky });
const me = { watch: null, first: true, x: 0, y: 0, has: false };

function meDistanceText() {
  const it = state.sel != null ? DAYS[state.day].items[state.sel] : null;
  const p = it?.place ? placeXY(it.place) : null;
  if (!p) return '';
  const d = Math.hypot(p[0] - me.x, p[1] - me.y);
  const m = d >= 1000 ? `${(d / 1000).toFixed(1)}km` : `${Math.round(d / 10) * 10}m`;
  return ` · ${it.name}까지 직선 ${m}, 걸어서 약 ${Math.max(1, Math.round((d * 1.3) / 75))}분`;
}

function stopLocate() {
  if (me.watch != null) navigator.geolocation.clearWatch(me.watch);
  me.watch = null;
  me.has = false;
  removeLabels('me');
  $('#btn-locate')?.classList.remove('on');
}

function onFix(pos) {
  const { x, y } = llToXY(pos.coords.latitude, pos.coords.longitude);
  if (Math.abs(x) > 25000 || Math.abs(y) > 25000) {
    stopLocate();
    toast('지금 위치가 오사카에서 너무 멀어요. 오사카에서 눌러 보세요');
    return;
  }
  me.x = x;
  me.y = y;
  me.has = true;
  removeLabels('me');
  addLabel('me', '<span class="me-dot"></span>', x, y, { prio: 99, group: 'me', h: 2 });
  if (me.first) {
    me.first = false;
    flyToPlace(x, y, { dist: 700, polar: 0.95, dur: 1.2 });
    toast('내 위치를 찾았어요' + meDistanceText());
  }
}

function locateMe() {
  if (!navigator.geolocation) return toast('이 브라우저는 위치 기능을 지원하지 않아요');
  if (!map.ready) return toast('지도를 불러오는 중이에요. 잠깐만요');
  if (me.watch != null) {
    // 이미 켜져 있으면: 내 위치로 다시 이동하고, 고른 장소까지의 거리를 알려 준다.
    if (me.has) {
      flyToPlace(me.x, me.y, { dist: 700, polar: 0.95, dur: 1.0 });
      toast('내 위치' + (meDistanceText() || ' · 일정에서 장소를 고르면 거리를 알려 드려요'));
    }
    return;
  }
  me.first = true;
  $('#btn-locate')?.classList.add('on');
  me.watch = navigator.geolocation.watchPosition(
    onFix,
    (err) => {
      stopLocate();
      toast(err.code === 1 ? '위치 허용이 꺼져 있어요. 브라우저 설정에서 허용해 주세요' : '위치를 찾지 못했어요. 밖에서 다시 눌러 보세요');
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
  );
}

function scrollToMap() {
  if (!isPhone()) return;
  const r = map.host.getBoundingClientRect();
  if (r.bottom < 160 || r.top < -r.height / 2) map.host.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function animateTime(to, dur = 0.9) {
  const from = map.time;
  map.anims = map.anims.filter((a) => !a.clock);
  map.anims.push({ clock: true, t: 0, dur, step: (k) => setTime(lerp(from, to, ease(k))) });
}

/** 일본 시각으로 여행 중이면 그날·지금 일정을 표시한다. */
function updateNow() {
  const now = jstNow();
  const di = DAYS.findIndex((d) => d.date === now.date);
  if (di < 0) {
    state.nowDay = state.nowItem = null;
    return false;
  }
  state.nowDay = di;
  let idx = null;
  DAYS[di].items.forEach((it, i) => {
    if (toH(it.time) <= now.h) idx = i;
  });
  state.nowItem = idx;
  return true;
}

// ── 이 날 미리 체험하기: 카메라가 동선을 따라가며 장소마다 멈춘다 ──

const tour = { on: false, playing: true, speed: 1, voice: false, token: 0, di: 0, idx: 0, waits: [], moves: [], tokenLabel: null };

function tourTick(dt) {
  if (!tour.on || !tour.playing) return;
  const k = dt * tour.speed;
  for (const w of tour.waits.slice()) {
    w.left -= k;
    if (w.left <= 0) {
      tour.waits.splice(tour.waits.indexOf(w), 1);
      w.res();
    }
  }
  for (const a of tour.moves.slice()) {
    a.t = Math.min(1, a.t + k / a.dur);
    a.step(a.t);
    if (a.t >= 1) {
      tour.moves.splice(tour.moves.indexOf(a), 1);
      a.res();
    }
  }
  if (tour.moves.length) map.dirty = true;
}

const twait = (sec) => new Promise((res) => tour.waits.push({ left: sec, res }));
const tmove = (dur, step) => new Promise((res) => tour.moves.push({ t: 0, dur, step, res }));

function flushTour() {
  for (const w of tour.waits.splice(0)) w.res();
  for (const m of tour.moves.splice(0)) m.res();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

function spokenTime(t) {
  const [h, m] = t.split(':').map(Number);
  const ap = h < 12 ? '오전' : '오후';
  const hh = h % 12 === 0 ? 12 : h % 12;
  return `${ap} ${hh}시${m ? ` ${m}분` : ''}`;
}

function speak(text) {
  if (!tour.voice || !('speechSynthesis' in window)) return Promise.resolve();
  return new Promise((res) => {
    let done = false;
    const fin = () => {
      if (!done) {
        done = true;
        res();
      }
    };
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = tour.speed > 1 ? 1.35 : 1.05;
      const v = speechSynthesis.getVoices().find((x) => /^ko/i.test(x.lang));
      if (v) u.voice = v;
      u.onend = fin;
      u.onerror = fin;
      speechSynthesis.speak(u);
      setTimeout(fin, 20000);
    } catch {
      fin();
    }
  });
}

function startTour(di) {
  if (!map.ready) return;
  if (di !== state.day) selectDay(di, { fly: false });
  stopTour(true);
  tour.on = true;
  tour.playing = true;
  tour.di = di;
  $('#mapwrap').classList.add('touring');
  $('#tour').hidden = false;
  $('#tour').style.setProperty('--c', DAYS[di].color);
  $('#tour-dots').innerHTML = DAYS[di].items.map((_, i) => `<i data-i="${i}" title="${esc(DAYS[di].items[i].time)}"></i>`).join('');
  setPlayButton();
  scrollToMap();
  map.lift = isPhone() ? 0.2 : 0;
  resize();
  tour.tokenLabel = addLabel('token', '<b>🚶</b>', PLACES.hotel.x, PLACES.hotel.y, { group: 'tour', prio: 10, h: 10 });
  tour.tokenLabel.hidden = true;
  runTour(0);
}

function stopTour(quiet) {
  tour.token++;
  flushTour();
  tour.on = false;
  removeLabels('tour');
  tour.tokenLabel = null;
  $('#mapwrap').classList.remove('touring');
  $('#tour').hidden = true;
  if (map.lift) {
    map.lift = 0;
    resize();
  }
  if (!quiet) requestRender();
}

async function runTour(from) {
  const tok = ++tour.token;
  flushTour();
  const d = DAYS[tour.di];
  for (let i = from; i < d.items.length; i++) {
    if (tok !== tour.token) return;
    tour.idx = i;
    await playItem(tour.di, i, tok);
  }
  if (tok !== tour.token) return;
  $('#tour-time').textContent = `DAY ${d.n} · ${dateLabel(d.date)}`;
  $('#tour-title').textContent = '하루 미리 체험 끝!';
  $('#tour-memo').textContent = `걷는 거리 약 ${d.walkKm}km · 1인 예상 ${yen(d.cost)}. 다른 날도 미리 다녀와 보세요.`;
  $('#tour-legs').innerHTML = '';
  $('#tour-bul').textContent = '✓';
  tour.playing = false;
  setPlayButton(true);
  fitDay(tour.di);
}

function setPlayButton(ended) {
  const b = $('#tour-play');
  b.textContent = ended ? '↺' : tour.playing ? '⏸' : '▶';
  b.setAttribute('aria-label', ended ? '처음부터' : tour.playing ? '일시정지' : '재생');
  b.dataset.ended = ended ? '1' : '';
}

function showTourCard(di, i) {
  const d = DAYS[di];
  const it = d.items[i];
  $('#tour-bul').textContent = itemBullet(di, i);
  $('#tour-bul').style.setProperty('--c', d.color);
  $('#tour-time').textContent = `DAY ${d.n} · ${it.time} · ${it.type}`;
  $('#tour-title').textContent = it.name;
  const extra = [it.booked ? `✓ ${it.booked}` : '', it.hours ? `🕒 ${it.hours}` : '', it.warn ? `⚠ ${it.warn}` : ''].filter(Boolean).join(' · ');
  $('#tour-memo').textContent = [extra, it.memo].filter(Boolean).join(' — ');
  const legs = [...it.legs, ...it.after];
  $('#tour-legs').innerHTML = legs
    .map((id) => {
      const L = LEGS[id];
      if (L.mode === 'walk') return `<span>🚶 ${esc(stationKo(L.from))} → ${esc(stationKo(L.to))} · 도보 ${L.min}분</span>`;
      const r = railInfo(L);
      return `<span style="color:${LINES[L.line].color}">Ⓜ <b>${esc(LINES[L.line].name)}</b> <span style="color:var(--ink-2)">${esc(r.text)}${r.stops ? ` · ${r.stops}정거장` : ''} · ${esc(r.mins)}</span></span>`;
    })
    .join('');
  $$('#tour-dots i').forEach((el, k) => {
    el.classList.toggle('on', k === i);
    el.classList.toggle('past', k < i);
  });
  state.sel = i;
  markSelected(di, i);
  if (state.tab === 'plan') {
    $$('.stop.sel').forEach((el) => el.classList.remove('sel'));
    const row = $(`#stop-${di}-${i}`);
    if (row) {
      row.classList.add('sel');
      if (!isPhone()) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }
}

const legDur = (L) => (L.mode === 'walk' ? clamp(L.dist / 260, 1.6, 4.5) : clamp(L.dist / 1500, 2.2, 5));

async function runLegs(ids, tA, tB, tok) {
  const total = ids.reduce((s, id) => s + legDur(LEGS[id]), 0) || 1;
  let acc = 0;
  for (const id of ids) {
    const L = LEGS[id];
    const dur = legDur(L);
    await focusLeg(id);
    if (tok !== tour.token) return;
    const tl = tour.tokenLabel;
    tl.el.innerHTML = `<b>${L.mode === 'walk' ? '🚶' : '🚇'}</b>`;
    tl.hidden = false;
    await tmove(dur, (k) => {
      const [x, y] = pointAt(L.path, k);
      tl.pos.set(x, 10, -y);
      setTime(lerp(tA, tB, (acc + k * dur) / total));
    });
    acc += dur;
    if (tok !== tour.token) return;
  }
  if (tour.tokenLabel) tour.tokenLabel.hidden = true;
}

async function playItem(di, i, tok) {
  const d = DAYS[di];
  const it = d.items[i];
  const alive = () => tok === tour.token && tour.on;
  showTourCard(di, i);
  const t1 = toH(it.time);
  const t0 = i > 0 ? toH(d.items[i - 1].time) : t1 - 0.4;
  const lead = Math.max(t0, t1 - 0.6);
  if (it.legs.length) {
    await runLegs(it.legs, lead, t1, tok);
    if (!alive()) return;
  }
  setTime(t1, d.date);
  if (it.place) {
    const [x, y] = placeXY(it.place);
    await flyToPlace(x, y, { dist: it.place === 'kix' ? 2400 : 470, polar: 0.98, dur: 1.5 });
  } else if (it.far && i === 0) {
    await fitPoints([[PLACES.namba.x, PLACES.namba.y], TRIP.airportEdge], { pad: 1.4, polar: 0.8 });
  }
  if (!alive()) return;
  const memo = (it.memo || '').split(/[.·]/)[0].trim();
  const say = speak(`${spokenTime(it.time)}, ${it.name.replace(/\(.*?\)/g, '')}. ${it.booked ? it.booked + '. ' : ''}${memo}`);
  await Promise.all([twait(it.move ? 1.4 : it.far ? 2.4 : 4.2), say]);
  if (!alive()) return;
  if (it.after.length) await runLegs(it.after, t1, t1 + 0.6, tok);
  if (i === d.items.length - 1 && d.endLegs?.length && alive()) await runLegs(d.endLegs, t1 + 0.3, t1 + 1.2, tok);
}

function bindTour() {
  $('#tour-close').addEventListener('click', () => {
    stopTour();
    fitDay(state.day);
  });
  $('#tour-play').addEventListener('click', () => {
    if ($('#tour-play').dataset.ended) {
      tour.playing = true;
      setPlayButton();
      runTour(0);
      return;
    }
    tour.playing = !tour.playing;
    setPlayButton();
    if ('speechSynthesis' in window) tour.playing ? speechSynthesis.resume() : speechSynthesis.pause();
  });
  $('#tour-next').addEventListener('click', () => {
    const n = DAYS[tour.di].items.length;
    tour.playing = true;
    setPlayButton();
    if (tour.idx + 1 < n) runTour(tour.idx + 1);
    else runTour(n);
  });
  $('#tour-speed').addEventListener('click', (e) => {
    tour.speed = tour.speed === 1 ? 2 : 1;
    e.currentTarget.textContent = `${tour.speed}배속`;
    e.currentTarget.classList.toggle('on', tour.speed > 1);
  });
  $('#tour-voice').addEventListener('click', (e) => {
    if (!('speechSynthesis' in window)) {
      toast('이 브라우저는 음성 안내를 지원하지 않아요');
      return;
    }
    tour.voice = !tour.voice;
    e.currentTarget.classList.toggle('on', tour.voice);
    e.currentTarget.setAttribute('aria-pressed', String(tour.voice));
    if (!tour.voice) speechSynthesis.cancel();
    else speechSynthesis.getVoices();
  });
  $('#tour-dots').addEventListener('click', (e) => {
    const i = e.target.closest('[data-i]');
    if (!i) return;
    tour.playing = true;
    setPlayButton();
    runTour(+i.dataset.i);
  });
}

// ── 시작 ──────────────────────────────────────────────────

async function boot() {
  const traveling = updateNow();
  if (traveling) {
    state.day = state.nowDay;
    state.tab = 'plan';
  }
  // 앱에서 ?day=2 처럼 넘어오면 그 날짜(1부터 시작)로 바로 연다.
  let explicitDay = false;
  const qd = new URLSearchParams(location.search).get('day');
  if (qd && /^\d+$/.test(qd) && +qd >= 1 && +qd <= DAYS.length) {
    state.day = +qd - 1;
    state.tab = 'plan';
    explicitDay = true;
    document.documentElement.classList.add('maponly');
  }
  map.dayIndex = state.day;
  renderHeader();
  renderDayStrip();
  renderTabs();
  renderPanel();
  bindUI();
  bindTour();

  const bar = $('#loadbar');
  const txt = $('#loadtxt');
  try {
    initMap();
    const box = META.box;
    // 처음에는 위에서 넓게 내려다본다.
    map.controls.target.copy(W((box.x0 + box.x1) / 2 + 2200, (box.y0 + box.y1) / 2));
    map.cam.position.copy(map.controls.target).add(new THREE.Vector3(1800, 9000, 7000));
    map.controls.update();
    txt.textContent = '데이터 푸는 중…';
    await nextFrame();
    const bin = await gunzip(b64bytes($('#geo-bin').textContent));
    txt.textContent = `건물 ${META.index.buildings.count.toLocaleString('ko-KR')}채 세우는 중…`;
    META.buildingCount = META.index.buildings.count;
    await buildCity(bin, (p) => (bar.style.transform = `scaleX(${p.toFixed(3)})`));
    addBaseLabels();
    map.ready = true;
    drawDay(state.day);
    const now = jstNow();
    setTime(traveling ? now.h : 13, DAYS[state.day].date);
    $('#loading').classList.add('done');
    if (state.tab === 'home') renderPanel();
    await nextFrame();
    if (traveling && !explicitDay && state.nowItem != null) selectItem(state.day, state.nowItem);
    else fitDay(state.day, 2.4);
  } catch (e) {
    console.error(e);
    $('#loading').classList.add('fail');
    txt.textContent = '3D 지도를 그리지 못했어요';
    $('#loadsub').textContent = '이 브라우저에서 WebGL을 쓸 수 없거나 메모리가 부족해요. 아래 일정은 그대로 볼 수 있어요.';
    bar.style.transform = 'scaleX(0)';
  }
  document.fonts?.ready.then(() => {
    map.labels.forEach(measure);
    requestRender();
  });
  // 여행 중이면 1분마다 "지금"을 고친다.
  setInterval(() => {
    const before = `${state.nowDay}|${state.nowItem}`;
    updateNow();
    if (`${state.nowDay}|${state.nowItem}` !== before) {
      renderHeader();
      renderDayStrip();
      if (['plan', 'home'].includes(state.tab)) renderPanel();
    }
  }, 60000);
}

boot();

</script>
