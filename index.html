<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>오사카 3박4일 · 여행 노선도</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오사카 여행">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg: #12172a;
    --bg-soft: #171d34;
    --surface: #1d2440;
    --surface-alt: #232b4d;
    --line: #323b60;
    --cream: #f3ede0;
    --muted: #92a0c4;
    --amber: #e0a458;
    --amber-dim: #4a3a26;
    --move: #7ea6d8;
    --food: #e0a458;
    --sight: #8fc08a;
    --drink: #c98cc9;
    --shop: #5fc4bb;
    --stay: #9aa0b8;
    --alt-line: #4a5378;
    --danger: #e07a7a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;background:var(--bg); color:var(--cream); font-family:'Noto Sans KR',sans-serif;}
  body{padding-bottom:48px;}

  .hero{
    position:relative;
    padding: calc(28px + env(safe-area-inset-top)) 20px 18px;
    background:
      radial-gradient(circle at 85% -10%, rgba(224,164,88,0.16), transparent 55%),
      var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .hero .eyebrow{
    font-size: 12px; letter-spacing: 0.18em; color: var(--amber); font-weight:700;
    text-transform: uppercase;
  }
  .hero h1{
    font-family:'Noto Serif KR', serif; font-weight:700;
    font-size: 26px; margin: 6px 0 8px; line-height:1.3;
  }
  .hero p{ margin:0; color:var(--muted); font-size:13.5px; line-height:1.6;}

  .admin-toggle{
    position:absolute; top: calc(14px + env(safe-area-inset-top)); right:14px;
    width:34px; height:34px; border-radius:50%;
    background: var(--surface); border:1px solid var(--line); color:var(--muted);
    display:flex; align-items:center; justify-content:center; font-size:16px;
    cursor:pointer;
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  body.admin-mode .admin-toggle{ background: var(--amber-dim); border-color:var(--amber); color:var(--amber); }

  .add-day-tab{ flex: 0 0 auto !important; padding-left:10px; padding-right:10px; color: var(--amber); }

  .refresh-toggle{
    position:absolute; top: calc(14px + env(safe-area-inset-top)); right:56px;
    width:34px; height:34px; border-radius:50%;
    background: var(--surface); border:1px solid var(--line); color:var(--muted);
    display:flex; align-items:center; justify-content:center; font-size:17px;
    cursor:pointer; transition: transform .5s ease;
  }
  .refresh-toggle.spin{ animation: spin .6s linear; }
  @keyframes spin{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }

  .update-banner{
    display:none; align-items:center; justify-content:center; gap:8px;
    background: var(--amber-dim); color: var(--amber);
    font-size:12.5px; font-weight:700; padding:9px 12px;
    border-bottom:1px solid var(--line);
  }
  .update-banner.show{ display:flex; }
  .update-banner button{
    background: var(--amber); color:#241a06; border:none; border-radius:6px;
    padding:4px 10px; font-size:12px; font-weight:800; cursor:pointer;
  }

  .trip-switcher{
    display:flex; gap:6px; overflow-x:auto; padding: 10px 12px 4px;
    background: var(--bg-soft);
  }
  .trip-switcher.hidden{ display:none; }
  .trip-chip{
    flex:0 0 auto; padding:6px 13px; border-radius:999px;
    background: var(--surface); border:1px solid var(--line); color:var(--muted);
    font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .trip-chip.active{ background: var(--amber-dim); border-color:var(--amber); color:var(--amber); }
  .trip-chip.add-trip{ color: var(--amber); border-style:dashed; }

  .tabs{
    position: sticky; top:0; z-index: 20;
    display:flex; gap:0;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--line);
    padding: 0 12px;
    overflow-x:auto;
  }
  .tab{
    flex:1; text-align:center; padding: 14px 4px 12px;
    font-size: 13.5px; font-weight:700; color: var(--muted);
    border-bottom: 3px solid transparent;
    cursor:pointer; user-select:none; white-space:nowrap;
    transition: color .2s, border-color .2s;
  }
  .tab .d{ display:block; font-family:'Noto Serif KR',serif; font-size:17px; margin-bottom:2px; }
  .tab.active{ color: var(--cream); border-bottom-color: var(--amber); }

  .day-panel{ display:none; padding: 22px 16px 8px; }
  .day-panel.active{ display:block; }

  .day-meta{
    display:flex; justify-content:space-between; align-items:baseline;
    margin: 0 4px 18px;
    color: var(--muted); font-size:12.5px;
  }
  .day-meta b{ color:var(--cream); font-family:'Noto Serif KR',serif; font-size:15px; font-weight:600;}

  .timeline{ position:relative; padding-left: 68px; }
  .timeline::before{
    content:""; position:absolute; left: 46px; top:6px; bottom: 6px; width:2px;
    background: repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 11px);
  }

  .stop{ position:relative; margin-bottom: 16px; }
  .stop .time{
    position:absolute; left:-68px; top:6px; width:32px; text-align:right;
    font-size:12.5px; font-weight:800; color:var(--cream); font-variant-numeric: tabular-nums;
    line-height:1.15;
  }
  .stop .dot{
    position:absolute; left:-29px; top:7px; width:14px; height:14px; border-radius:50%;
    background: var(--dot-color, var(--move));
    border: 3px solid var(--bg);
    box-shadow: 0 0 0 2px var(--dot-color, var(--move));
    z-index:2;
  }
  .stop.alt .dot{ box-shadow: 0 0 0 2px var(--dot-color, var(--move)); opacity:.55; }
  .stop.alt::after{
    content:""; position:absolute; left:-37px; top:24px; bottom:-16px; width:0;
    border-left: 2px dashed var(--alt-line);
  }

  .gap{ position:relative; height: 24px; margin: -6px 0 -2px; }
  .gap .glabel{
    position:absolute; left:-22px; top:50%; transform:translate(-50%,-50%);
    background: var(--bg); color: var(--muted);
    font-size:10.5px; font-weight:700; white-space:nowrap;
    padding: 3px 9px; border-radius:999px; border:1px solid var(--line);
    z-index:1;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 13px 14px 12px;
  }
  .stop.alt .card{ background: transparent; border-style:dashed; padding: 10px 14px; }

  .card-top{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:6px; }
  .badge{
    font-size:11px; font-weight:700; padding: 3px 9px; border-radius: 999px;
    color: var(--bg); background: var(--dot-color, var(--move));
    letter-spacing: .01em;
  }
  .tag{
    font-size: 10.5px; font-weight:700; padding: 2px 7px; border-radius:6px;
    border:1px solid var(--amber); color: var(--amber);
  }
  .tag.alt{ border-color: var(--muted); color: var(--muted); }
  .price-chip{
    margin-left:auto; font-size:11.5px; font-weight:800; color:var(--amber);
    font-variant-numeric: tabular-nums; white-space:nowrap;
  }
  .price-chip.free{ color: var(--muted); font-weight:700; }

  .name{ font-size: 15.5px; font-weight:700; color:var(--cream); margin: 2px 0 3px; line-height:1.4;}
  .stop.alt .name{ font-size:14px; font-weight:500; color: var(--muted); }
  .addr{ font-size:12.5px; color: var(--muted); margin-bottom:4px; }
  .memo{ font-size:12.5px; color:#c7cde4; line-height:1.55; margin: 4px 0 10px; }

  .links{ display:flex; gap:6px; flex-wrap:wrap; }
  .lnk{
    display:inline-flex; align-items:center; gap:4px;
    font-size:11.5px; font-weight:700; color: var(--cream);
    background: var(--surface-alt); border:1px solid var(--line);
    padding: 6px 10px; border-radius: 8px; text-decoration:none;
  }
  .lnk svg{ width:12px; height:12px; }
  .lnk.primary{ background: var(--amber-dim); border-color: var(--amber); color: var(--amber); }

  .legend{
    display:flex; flex-wrap:wrap; gap: 10px 14px; margin: 4px 4px 20px;
    font-size:11px; color:var(--muted);
  }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:8px; height:8px; border-radius:50%; display:inline-block; }

  footer{ text-align:center; color: var(--muted); font-size:11.5px; padding: 20px 20px 4px; }

  .budget-summary{
    display:flex; gap:10px; margin: 0 4px 20px;
  }
  .bs-row{
    flex:1; background: var(--surface); border:1px solid var(--amber); border-radius:14px;
    padding: 14px 12px; text-align:center;
  }
  .bs-label{ font-size:11.5px; color:var(--muted); font-weight:700; margin-bottom:6px; }
  .bs-value{ font-family:'Noto Serif KR',serif; font-size:20px; font-weight:700; color:var(--amber); }

  .budget-section{ margin: 0 4px 18px; }
  .bsec-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .bsec-sub{ font-size:12px; color:var(--muted); font-weight:700; }

  .budget-row{
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    padding: 9px 12px; background: var(--surface); border:1px solid var(--line);
    border-radius:10px; margin-bottom:6px;
  }
  .br-name{ font-size:13px; color:var(--cream); }
  .br-note{ display:block; font-size:11px; color:var(--muted); margin-top:2px; font-weight:400; }
  .br-price{ font-size:13px; font-weight:700; color:var(--cream); white-space:nowrap; font-variant-numeric: tabular-nums; }

  .budget-notes{
    margin: 20px 4px 4px; padding: 14px 14px 12px; background: var(--surface-alt);
    border:1px dashed var(--line); border-radius:14px;
  }
  .bn-title{ font-size:12.5px; font-weight:800; color:var(--amber); margin-bottom:8px; }
  .bn-item{ font-size:12.5px; color:#c7cde4; line-height:1.7; padding-left:14px; position:relative; }
  .bn-item::before{ content:"·"; position:absolute; left:2px; color:var(--muted); }

  .dday-badge{
    font-size:11.5px; font-weight:800; padding: 4px 10px; border-radius:999px;
    white-space:nowrap; font-variant-numeric: tabular-nums;
  }
  .dday-badge.urgent{ background:#5a2020; color:#ff9b9b; }
  .dday-badge.soon{ background: var(--amber-dim); color: var(--amber); }
  .dday-badge.normal{ background: var(--surface-alt); color: var(--muted); border:1px solid var(--line); }
  .dday-badge.past{ background: var(--surface-alt); color: var(--muted); opacity:.6; }

  .stay-card{
    background: var(--surface); border:1px solid var(--line); border-radius:14px;
    padding: 13px 14px 12px; margin: 0 4px 12px;
  }
  .stay-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .stay-status{
    font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:6px;
    border:1px solid var(--sight); color: var(--sight);
  }
  .stay-status.candidate{ border-color: var(--muted); color: var(--muted); }
  .stay-name{ font-size:15px; font-weight:700; color:var(--cream); margin:2px 0 4px; }
  .stay-dates{ font-size:12px; color:var(--muted); margin-bottom:8px; }
  .stay-row{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:#c7cde4; padding:5px 0; border-top:1px dashed var(--line); }
  .stay-row:first-of-type{ border-top:none; }
  .stay-note{ font-size:11.5px; color:var(--muted); margin-top:6px; line-height:1.5; }

  .section-title{ font-size:12.5px; font-weight:800; color:var(--amber); margin: 18px 4px 10px; letter-spacing:.02em; }
  .section-title:first-child{ margin-top:2px; }

  .check-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding: 10px 12px; background: var(--surface); border:1px solid var(--line);
    border-radius:10px; margin: 0 4px 6px;
  }
  .check-row.done{ opacity:.5; }
  .check-name{ font-size:12.5px; color:var(--cream); }
  .check-date{ display:block; font-size:10.5px; color:var(--muted); margin-top:2px; font-weight:400; }

  /* ---- Photos ---- */
  .photo-row{
    display:flex; gap:6px; align-items:center; margin-top:10px;
    overflow-x:auto; overflow-y:hidden; flex-wrap:nowrap;
    padding-bottom:2px; scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
  }
  .photo-row::-webkit-scrollbar{ height:5px; }
  .photo-row::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  .photo-thumb{
    width:52px; height:52px; min-width:52px; object-fit:cover; border-radius:8px;
    border:1px solid var(--line); cursor:pointer; scroll-snap-align:start;
  }
  .photo-count{
    font-size:10px; color:var(--muted); font-weight:700; min-width:28px;
    text-align:center; flex-shrink:0;
  }

  /* One global "add photo" button instead of one per item — tap it,
     then pick which schedule item the photo belongs to. */
  .photo-fab{
    position:fixed; right:18px; bottom: calc(20px + env(safe-area-inset-bottom));
    width:52px; height:52px; border-radius:50%; z-index:40;
    background: var(--amber); color:#241a06; border:none;
    display:none; align-items:center; justify-content:center;
    box-shadow: 0 6px 18px rgba(0,0,0,.35); cursor:pointer;
  }
  .photo-fab.show{ display:flex; }
  .photo-fab svg{ width:22px; height:22px; }
  /* nudge the FAB up so it doesn't sit under the admin save-bar */
  body:has(.save-bar:not(.hidden)) .photo-fab{ bottom: calc(84px + env(safe-area-inset-bottom)); }

  .picker-row{
    display:flex; align-items:center; gap:10px; width:100%;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:11px 12px; margin-bottom:8px; color:var(--cream);
    font-size:13px; text-align:left; cursor:pointer;
  }
  .picker-row .ptime{ color:var(--amber); font-weight:800; font-size:12px; min-width:42px; }
  .picker-row .pname{ flex:1; }
  .picker-empty{ color:var(--muted); font-size:12.5px; text-align:center; padding:16px 0; }

  .lightbox-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.94); z-index:100;
    display:none; padding:0;
  }
  .lightbox-overlay.show{ display:flex; }
  .lightbox-box{
    display:flex; flex-direction:column; width:100%; height:100dvh;
  }
  .lb-topbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    flex-shrink:0;
  }
  .lb-icon-btn{
    width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2); color:var(--cream);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .lb-icon-btn svg{ width:18px; height:18px; }
  .lightbox-img-wrap{
    position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
  }
  .lightbox-box img{ max-width:100%; max-height:100%; object-fit:contain; touch-action:pan-y; }
  .lb-nav{
    position:absolute; top:50%; transform:translateY(-50%); width:40px; height:40px;
    border-radius:50%; background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.25);
    color:var(--cream); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .lb-nav svg{ width:20px; height:20px; }
  .lb-nav-prev{ left:8px; }
  .lb-nav-next{ right:8px; }
  .lb-nav.hidden{ display:none; }
  .lb-counter{ font-size:12px; color:var(--muted); }
  .lb-info-panel{
    display:none; flex-shrink:0; margin:0 14px 4px; padding:11px 13px;
    background:var(--surface-alt); border:1px solid var(--line); border-radius:12px;
    font-size:12px; color:var(--muted); line-height:1.7;
  }
  .lb-info-panel.show{ display:block; }
  .lb-info-panel .lbi-row b{ color:var(--cream); font-weight:700; }
  .lb-info-panel a{ color:var(--amber); }
  .lightbox-actions{
    display:flex; gap:8px; flex-shrink:0;
    padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  }
  .lb-btn{
    flex:1; padding:11px 14px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); color:var(--cream); font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .lb-btn.danger{ color:var(--danger); border-color:var(--danger); }

  /* ---- Gallery tab ---- */
  .gallery-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin: 0 4px; }
  .gallery-item{ position:relative; }
  .gallery-item img{
    width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px;
    border:1px solid var(--line); cursor:pointer; display:block;
  }
  .gallery-checkbox{
    position:absolute; top:6px; left:6px; z-index:2;
    width:20px; height:20px; cursor:pointer; accent-color:var(--amber);
    background:rgba(0,0,0,.55); border-radius:5px;
  }
  .gallery-cap{ font-size:10px; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gallery-empty{ text-align:center; color:var(--muted); font-size:12.5px; padding:40px 0; }
  .gallery-filter{ display:flex; align-items:center; gap:7px; margin:0 4px 14px; font-size:12.5px; color:var(--muted); cursor:pointer; }
  .gallery-filter input{ accent-color:var(--amber); width:16px; height:16px; cursor:pointer; }

  .gallery-view-toggle{ display:flex; gap:6px; margin:0 4px 12px; }
  .gv-btn{
    flex:1; padding:9px 10px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface-alt); color:var(--muted); font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .gv-btn.active{ background:var(--amber); color:#241605; border-color:var(--amber); }

  .album-section{ margin:0 4px 22px; }
  .album-header{
    display:flex; align-items:baseline; gap:8px; margin-bottom:9px;
    padding-bottom:7px; border-bottom:1px solid var(--line);
  }
  .album-header .ah-day{ font-family:'Noto Serif KR',serif; font-size:14.5px; color:var(--cream); font-weight:700; }
  .album-header .ah-count{ font-size:11.5px; color:var(--muted); }

  /* ---- Settlement (정산) tab ---- */
  .member-chips{ display:flex; flex-wrap:wrap; gap:7px; margin:0 4px 10px; }
  .member-chip{
    display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:20px;
    background:var(--surface-alt); border:1px solid var(--line); font-size:12.5px; color:var(--cream);
  }
  .member-chip button{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; line-height:1; padding:0; }
  .member-add-row{ display:flex; gap:8px; margin:0 4px 18px; }
  .member-add-row input{
    flex:1; padding:9px 11px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); color:var(--cream); font-size:12.5px;
  }
  .member-add-row button{
    padding:9px 14px; border-radius:9px; border:1px solid var(--amber); background:var(--amber);
    color:#241605; font-weight:700; font-size:12.5px; cursor:pointer; white-space:nowrap;
  }
  .settle-empty{ text-align:center; color:var(--muted); font-size:12.5px; padding:30px 20px; }

  .settle-summary{ display:flex; gap:10px; margin:0 4px 16px; }
  .ss-card{
    flex:1; background:var(--surface-alt); border:1px solid var(--line); border-radius:12px;
    padding:12px; text-align:center;
  }
  .ss-card .ss-label{ font-size:11px; color:var(--muted); margin-bottom:4px; }
  .ss-card .ss-value{ font-size:16px; font-weight:800; color:var(--amber); }

  .balance-table{ margin:0 4px 18px; }
  .balance-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 0; border-bottom:1px solid var(--line); font-size:12.5px;
  }
  .balance-row:last-child{ border-bottom:none; }
  .balance-row .bal-name{ color:var(--cream); font-weight:700; flex:1; }
  .balance-row .bal-detail{ color:var(--muted); font-size:11px; }
  .balance-row .bal-net{ font-weight:800; min-width:80px; text-align:right; }

<script>
// ---------------------------------------------------------------
// Config
// ---------------------------------------------------------------
const GH_OWNER = 'geonul22';
const GH_REPO = 'osaka-trip-2026';
const GH_BRANCH = 'main';
const TRIPS_INDEX_PATH = 'trips.json';
// Fallback used only if trips.json can't be loaded yet (e.g. very first
// deploy before it's been committed) — keeps the Osaka trip working.
const DEFAULT_TRIP = {
  id: 'osaka-2026',
  dataFile: 'itinerary-data.json',
  eyebrow: 'OSAKA · 11.13 – 11.15',
  title: '오사카 3박4일 여행 노선도',
  desc: '고등학교 친구 6인, 난바 · 신사이바시 숙소 기준. 날짜별로 탭을 눌러 확인하세요.'
};

const CLOUDINARY_CLOUD = 'p9iuxejh';
const CLOUDINARY_PRESET = 'osaka-trip';
const FIRESTORE_PROJECT = 'osaka-trip-2026-6a2a4';
const FIREBASE_API_KEY = 'AIzaSyCqQ5IOKFRMHRQLRj_pvs1SFAJKACyN3GI';

// ---------------------------------------------------------------
// State
// ---------------------------------------------------------------
let TRIPS = [];       // [{id, dataFile, eyebrow, title, desc}]
let currentTrip = null;
let DATA = [];
let BUDGET = { items: [], notes: [] };
let PHOTOS = {}; // itemId -> [{url, name, ownerId, createdAt, publicId}]
let activeIdx = 0;
let hasUnsaved = false;
const AUTH = { idToken: null, uid: null };
let currentLightboxPhoto = null;
let selectedPhotoNames = new Set();
let filterOwnOnly = false;
let galleryViewMode = 'album'; // 'album' (날짜별) | 'grid' (최신순)
let galleryFlatPhotos = [];  // flat, view-ordered list backing gallery-item img[data-flat-idx]
let currentPhotoList = [];   // ordered list backing the open lightbox, for prev/next
let currentPhotoIndex = -1;
let MEMBERS = [];      // [name, ...] shared per-trip member roster for 정산
let EXPENSES = [];     // [{name(docPath), payer, amount, memo, participants, tripId, ownerId, createdAt}]
let editingExpenseId = null; // Firestore doc path of expense being edited, or null for "add"

const ICONS = {
  map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3z"/><path d="M9 4v13"/><path d="M15 7v13"/></svg>',
  dir: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
};

const CAT_COLOR = { "교통":"var(--move)", "입장료":"var(--sight)", "식사":"var(--food)", "기타":"var(--shop)" };

const CATS = {
  "이동":  { color: "var(--move)",  label:"이동" },
  "식사":  { color: "var(--food)",  label:"식사" },
  "관광":  { color: "var(--sight)", label:"관광" },
  "술집":  { color: "var(--drink)", label:"술집" },
  "쇼핑":  { color: "var(--shop)",  label:"쇼핑" },
  "숙소":  { color: "var(--stay)",  label:"숙소" },
};

function catKey(type){
  for(const k of Object.keys(CATS)){ if(type.startsWith(k)) return k; }
  return "이동";
}

function minutesBetween(t1, t2){
  const [h1,m1] = t1.split(':').map(Number);
  const [h2,m2] = t2.split(':').map(Number);
  if([h1,m1,h2,m2].some(isNaN)) return null;
  return (h2*60+m2) - (h1*60+m1);
}

function formatMins(mins){
  const h = Math.floor(mins/60);
  const m = mins % 60;
  if(h > 0 && m > 0) return `${h}시간 ${m}분 후`;
  if(h > 0) return `${h}시간 후`;
  return `${m}분 후`;
}

function genId(prefix){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function toast(msg, ms=2400){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=> t.classList.remove('show'), ms);
}

// ---------------------------------------------------------------
// Photo row rendering
// ---------------------------------------------------------------
function photoRowHtml(itemId){
  const photos = PHOTOS[itemId] || [];
  if(!photos.length) return '';
  const thumbs = photos.map(p => `<img class="photo-thumb" src="${p.url}" data-url="${p.url}" data-name="${p.name || ''}" data-owner="${p.ownerId || ''}" loading="lazy" alt="여행 사진">`).join('');
  const countBadge = photos.length > 4 ? `<span class="photo-count">${photos.length}장</span>` : '';
  return `<div class="photo-row" data-item-id="${itemId}">${thumbs}${countBadge}</div>`;
}

// ---------------------------------------------------------------
// Main render
// ---------------------------------------------------------------
const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');

function renderAll(){
  tabsEl.innerHTML = '';
  panelsEl.innerHTML = '';

  const days = [...new Set(DATA.map(d => d.day))];

  days.forEach((day, i) => {
    const [label, date] = day.split(' · ');
    const tab = document.createElement('div');
    tab.className = 'tab' + (i === activeIdx ? ' active' : '');
    tab.dataset.idx = i;
    tab.innerHTML = `<span class="d">${label}</span>${date || ''}`;
    tab.onclick = () => selectDay(i);
    tabsEl.appendChild(tab);

    const items = DATA.filter(d => d.day === day);
    const panel = document.createElement('div');
    panel.className = 'day-panel' + (i === activeIdx ? ' active' : '');
    panel.dataset.idx = i;

    const meta = document.createElement('div');
    meta.className = 'day-meta';
    meta.innerHTML = `<b>${date || ''}</b><span>일정 ${items.length}건</span>`;
    panel.appendChild(meta);

    const tl = document.createElement('div');
    tl.className = 'timeline';

    items.forEach((item, idx) => {
      if(idx > 0){
        const mins = minutesBetween(items[idx-1].time, item.time);
        if(mins !== null && mins > 0){
          const gap = document.createElement('div');
          gap.className = 'gap';
          gap.innerHTML = `<span class="glabel">${formatMins(mins)}</span>`;
          tl.appendChild(gap);
        }
      }
      const key = catKey(item.type);
      const cat = CATS[key];
      const isAlt = item.priority === '대안';

      const stop = document.createElement('div');
      stop.className = 'stop' + (isAlt ? ' alt' : '');
      stop.style.setProperty('--dot-color', cat.color);

      let tagHtml = '';
      if(item.priority === '대표') tagHtml = '<span class="tag">대표</span>';
      else if(item.priority === '대안') tagHtml = '<span class="tag alt">대안</span>';

      let priceHtml = '';
      if(item.price !== null && item.price !== undefined){
        if(item.price === 0){
          priceHtml = `<span class="price-chip free">${item.priceLabel || '무료'}</span>`;
        } else {
          priceHtml = `<span class="price-chip">1인 ¥${item.price.toLocaleString()}</span>`;
        }
      } else if(item.priceLabel){
        priceHtml = `<span class="price-chip free">${item.priceLabel}</span>`;
      }

      let linksHtml = `<a class="lnk primary" href="${item.map}" target="_blank" rel="noopener">${ICONS.map}지도</a>`;
      linksHtml += `<a class="lnk" href="${item.dir}" target="_blank" rel="noopener">${ICONS.dir}길찾기</a>`;
      if(item.home){ linksHtml += `<a class="lnk" href="${item.home}" target="_blank" rel="noopener">${ICONS.home}홈페이지</a>`; }

      const adminBtns = `<div class="card-admin-btns admin-only flex">
        <button type="button" class="icon-btn edit-item-btn" data-id="${item.id}" title="수정">✎</button>
        <button type="button" class="icon-btn danger del-item-btn" data-id="${item.id}" title="삭제">✕</button>
      </div>`;

      stop.innerHTML = `
        <div class="time">${item.time}</div>
        <div class="dot"></div>
        <div class="card">
          <div class="card-top">
            <span class="badge">${item.type}</span>
            ${tagHtml}
            ${priceHtml}
            ${adminBtns}
          </div>
          <div class="name">${item.name}</div>
          <div class="addr">${item.addr}</div>

  summary.innerHTML = `
    <div class="bs-row">
      <div class="bs-label">1인 예상 총액</div>
      <div class="bs-value">¥${total1.toLocaleString()}</div>
    </div>
    <div class="bs-row">
      <div class="bs-label">6인 예상 총액</div>
      <div class="bs-value">¥${total6.toLocaleString()}</div>
    </div>
  `;

  const addBudgetBtn = document.createElement('button');
  addBudgetBtn.type = 'button';
  addBudgetBtn.className = 'add-item-btn admin-only block';
  addBudgetBtn.textContent = '+ 예산 항목 추가';
  addBudgetBtn.onclick = () => openBudgetModal(null);

  const catsPresent = [...new Set(BUDGET.items.map(i => i.cat))];

    const catItems = BUDGET.items.filter(i => i.cat === cat);
    const subtotal = catItems.reduce((s,i) => s + (i.price || 0), 0);

    const section = document.createElement('div');
    section.className = 'budget-section';
    section.innerHTML = `
      <div class="bsec-head">
        <span class="badge" style="background:${CAT_COLOR[cat] || 'var(--shop)'}">${cat}</span>
        <span class="bsec-sub">소계 ¥${subtotal.toLocaleString()}</span>
      </div>
    `;
    catItems.forEach(item => {
      const row = document.createElement('div');
      row.className = 'budget-row';
      row.innerHTML = `
        <div class="br-name">${item.name}${item.note ? `<span class="br-note">${item.note}</span>` : ''}</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="br-price">¥${(item.price||0).toLocaleString()}</div>
          <div class="admin-only flex" style="gap:4px;">
            <button type="button" class="icon-btn edit-budget-btn" data-id="${item.id}" title="수정">✎</button>
            <button type="button" class="icon-btn danger del-budget-btn" data-id="${item.id}" title="삭제">✕</button>

  sTab.onclick = () => selectDay(stayIdx);

  const sPanel = document.createElement('div');
  sPanel.className = 'day-panel' + (activeIdx === stayIdx ? ' active' : '');
  sPanel.dataset.idx = stayIdx;
  sPanel.innerHTML = `<div style="text-align:center;color:var(--muted);font-size:12.5px;padding:30px 0;">불러오는 중…</div>`;
  panelsEl.appendChild(sPanel);

  loadStayPanel(sPanel);

  // 사진첩 탭
  const galleryIdx = stayIdx + 1;
  const gTab = document.createElement('div');
  gTab.className = 'tab' + (activeIdx === galleryIdx ? ' active' : '');
  gTab.dataset.idx = galleryIdx;
  gTab.innerHTML = `<span class="d">사진첩</span>다같이 공유`;
  gTab.onclick = () => selectDay(galleryIdx);
  tabsEl.appendChild(gTab);

  const gPanel = document.createElement('div');
  gPanel.className = 'day-panel' + (activeIdx === galleryIdx ? ' active' : '');
  gPanel.dataset.idx = galleryIdx;

  const itemNameById = {};
  const itemDayById = {};
  DATA.forEach(d => { itemNameById[d.id] = d.name; itemDayById[d.id] = d.day; });
  const dayOrder = [...new Set(DATA.map(d => d.day))]; // itinerary (chronological) order

  // Only photos attached to an item in THIS trip — PHOTOS is loaded
  // globally, but item ids are unique per trip so this keeps trips'
  // photo galleries from bleeding into each other.
  const currentItemIds = new Set(DATA.map(d => d.id));
  const allPhotos = [];
  Object.keys(PHOTOS).forEach(itemId => {
    if(!currentItemIds.has(itemId)) return;
    (PHOTOS[itemId] || []).forEach(p => allPhotos.push({ ...p, itemId }));
  });
  allPhotos.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

  const dlBtn = document.createElement('button');
  dlBtn.type = 'button';
  dlBtn.className = 'add-item-btn';
  dlBtn.style.marginBottom = '14px';
  dlBtn.textContent = `⬇ 전체 사진 다운로드 (${allPhotos.length}장, zip)`;
  dlBtn.onclick = () => downloadAllPhotos(allPhotos, dlBtn);
  gPanel.appendChild(dlBtn);

  const viewToggle = document.createElement('div');
  viewToggle.className = 'gallery-view-toggle';
  viewToggle.innerHTML = `
    <button type="button" class="gv-btn${galleryViewMode === 'album' ? ' active' : ''}" data-view="album">📖 날짜별 앨범</button>
    <button type="button" class="gv-btn${galleryViewMode === 'grid' ? ' active' : ''}" data-view="grid">🕒 최신순</button>
  `;
  gPanel.appendChild(viewToggle);

  const filterRow = document.createElement('label');
  filterRow.className = 'gallery-filter';
  filterRow.innerHTML = `<input type="checkbox" id="ownOnlyFilter" ${filterOwnOnly ? 'checked' : ''}> 내가 올린 사진만 보기 (체크하면 골라서 지울 수 있어요)`;
  gPanel.appendChild(filterRow);

  const bulkBar = document.createElement('div');
  bulkBar.className = 'bulk-delete-bar';
  bulkBar.style.display = selectedPhotoNames.size > 0 ? 'flex' : 'none';
  bulkBar.innerHTML = `<span>${selectedPhotoNames.size}장 선택됨</span><button type="button" id="bulkDeleteBtn">선택 삭제</button>`;
  gPanel.appendChild(bulkBar);

  const displayPhotos = filterOwnOnly ? allPhotos.filter(p => AUTH.uid && p.ownerId === AUTH.uid) : allPhotos;

  const photoCellHtml = (p, flatIdx) => {
    const isMine = AUTH.uid && p.ownerId === AUTH.uid;
    return `<div class="gallery-item">
        ${isMine ? `<input type="checkbox" class="gallery-checkbox" data-name="${p.name || ''}" ${selectedPhotoNames.has(p.name) ? 'checked' : ''}>` : ''}
        <img src="${p.url}" data-flat-idx="${flatIdx}" loading="lazy" alt="여행 사진">
        <div class="gallery-cap">${itemNameById[p.itemId] || ''}</div>
      </div>`;
  };

  if(displayPhotos.length === 0){
    galleryFlatPhotos = [];
    const empty = document.createElement('div');
    empty.className = 'gallery-empty';
    empty.textContent = filterOwnOnly
      ? '아직 내가 올린 사진이 없어요.'
      : '아직 올라온 사진이 없어요. 일정 카드의 카메라 버튼으로 올려보세요.';
    gPanel.appendChild(empty);
  } else if(galleryViewMode === 'album'){
    // Group by itinerary day (chronological order), oldest photo first within
    // each day, so flipping through feels like reliving the trip in order.
    const byDay = {};
    displayPhotos.forEach(p => {
      const day = itemDayById[p.itemId] || '기타';
      (byDay[day] = byDay[day] || []).push(p);
    });
    const daysWithPhotos = dayOrder.filter(d => byDay[d] && byDay[d].length);
    Object.keys(byDay).forEach(d => { if(!daysWithPhotos.includes(d)) daysWithPhotos.push(d); });

    galleryFlatPhotos = [];
    daysWithPhotos.forEach(day => {
      const photos = byDay[day].slice().sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
      const section = document.createElement('div');
      section.className = 'album-section';
      const grid = document.createElement('div');
      grid.className = 'gallery-grid';
      grid.innerHTML = photos.map(p => photoCellHtml(p, galleryFlatPhotos.push(p) - 1)).join('');
      section.innerHTML = `<div class="album-header"><span class="ah-day">${day}</span><span class="ah-count">${photos.length}장</span></div>`;
      section.appendChild(grid);
      gPanel.appendChild(section);
    });
  } else {
    galleryFlatPhotos = displayPhotos.slice();
    const grid = document.createElement('div');
    grid.className = 'gallery-grid';
    grid.innerHTML = displayPhotos.map((p, i) => photoCellHtml(p, i)).join('');
    gPanel.appendChild(grid);
  }

  panelsEl.appendChild(gPanel);

  // 정산 탭
  const settleIdx = galleryIdx + 1;
  const stlTab = document.createElement('div');
  stlTab.className = 'tab' + (activeIdx === settleIdx ? ' active' : '');
  stlTab.dataset.idx = settleIdx;
  stlTab.innerHTML = `<span class="d">정산</span>누가 얼마`;
  stlTab.onclick = () => selectDay(settleIdx);
  tabsEl.appendChild(stlTab);

  const stlPanel = document.createElement('div');
  stlPanel.className = 'day-panel' + (activeIdx === settleIdx ? ' active' : '');
  stlPanel.dataset.idx = settleIdx;
  renderSettlementPanel(stlPanel);
  panelsEl.appendChild(stlPanel);

  updatePhotoFabVisibility();
}

// ---------------------------------------------------------------
// Settlement (정산) panel: member roster, expense ledger, balances,
// and the minimal-transfer suggestion for squaring up at the end.
// ---------------------------------------------------------------
function renderSettlementPanel(panel){
  panel.innerHTML = '';

  // ---- Member roster ----
  const memberChips = document.createElement('div');
  memberChips.className = 'member-chips';
  if(MEMBERS.length === 0){
    memberChips.innerHTML = `<span style="font-size:12.5px;color:var(--muted);">아직 등록된 인원이 없어요. 아래에서 추가해보세요.</span>`;
  } else {
    memberChips.innerHTML = MEMBERS.map(name => `
      <span class="member-chip">${name}<button type="button" class="member-remove-btn" data-name="${name}" title="삭제">✕</button></span>
    `).join('');
  }
  panel.appendChild(memberChips);

  const addRow = document.createElement('div');
  addRow.className = 'member-add-row';
  addRow.innerHTML = `
    <input type="text" id="newMemberName" placeholder="이름 추가 (예: 건우)">
    <button type="button" id="addMemberBtn">+ 추가</button>
  `;
  panel.appendChild(addRow);

  const tripExpenses = EXPENSES.filter(e => e.tripId === currentTrip.id);

  if(MEMBERS.length < 2){
    const empty = document.createElement('div');
    empty.className = 'settle-empty';
    empty.textContent = '정산을 시작하려면 먼저 인원을 2명 이상 등록해주세요.';
    panel.appendChild(empty);
    return;
  }

  const addExpenseBtn = document.createElement('button');
  addExpenseBtn.type = 'button';
  addExpenseBtn.className = 'add-item-btn';
  addExpenseBtn.style.marginBottom = '16px';
  addExpenseBtn.textContent = '+ 경비 추가';
  addExpenseBtn.onclick = () => openExpenseModal(null);
  panel.appendChild(addExpenseBtn);

  // ---- Balances ----
  const totalSpent = tripExpenses.reduce((s,e) => s + e.amount, 0);
  const balances = MEMBERS.map(name => {
    const paid = tripExpenses.filter(e => e.payer === name).reduce((s,e) => s + e.amount, 0);
    const owed = tripExpenses.reduce((s,e) => {
      if(!e.participants.includes(name) || e.participants.length === 0) return s;
      return s + e.amount / e.participants.length;
    }, 0);
    return { name, paid, owed, net: paid - owed };
  });

  const summary = document.createElement('div');
  summary.className = 'settle-summary';
  summary.innerHTML = `
    <div class="ss-card"><div class="ss-label">총 지출</div><div class="ss-value">¥${Math.round(totalSpent).toLocaleString()}</div></div>
    <div class="ss-card"><div class="ss-label">항목 수</div><div class="ss-value">${tripExpenses.length}건</div></div>
  `;
  panel.appendChild(summary);

  if(tripExpenses.length > 0){
    const balTitle = document.createElement('div');
    balTitle.className = 'bn-title';
    balTitle.style.margin = '0 4px 8px';
    balTitle.textContent = '인당 정산 잔액 (+ 받을 돈 · − 보낼 돈)';
    panel.appendChild(balTitle);

    const balTable = document.createElement('div');
    balTable.className = 'balance-table';
    balTable.innerHTML = balances.map(b => `
      <div class="balance-row">
        <div class="bal-name">${b.name}<div class="bal-detail">낸 돈 ¥${Math.round(b.paid).toLocaleString()} · 분담액 ¥${Math.round(b.owed).toLocaleString()}</div></div>
        <div class="bal-net ${b.net >= 0 ? 'pos' : 'neg'}">${b.net >= 0 ? '+' : '−'}¥${Math.round(Math.abs(b.net)).toLocaleString()}</div>
      </div>
    `).join('');
    panel.appendChild(balTable);

    const transferTitle = document.createElement('div');
    transferTitle.className = 'bn-title';
    transferTitle.style.margin = '0 4px 8px';
    transferTitle.textContent = '최소 송금 정산';
    panel.appendChild(transferTitle);

    const transfers = computeSettlementTransfers(balances);
    const transferList = document.createElement('div');
    transferList.className = 'transfer-list';
    if(transfers.length === 0){
      transferList.innerHTML = `<div class="settle-done">모두 정산이 맞아요 🎉</div>`;
    } else {
      transferList.innerHTML = transfers.map(t => `
        <div class="transfer-row">
          <span>${t.from}</span><span class="t-arrow">→</span><span>${t.to}</span>
          <span class="t-amount">¥${t.amount.toLocaleString()}</span>
        </div>
      `).join('');
    }
    panel.appendChild(transferList);
  }

  // ---- Expense ledger ----
  const ledgerTitle = document.createElement('div');
  ledgerTitle.className = 'bn-title';
  ledgerTitle.style.margin = '0 4px 8px';
  ledgerTitle.textContent = '경비 내역';
  panel.appendChild(ledgerTitle);

  if(tripExpenses.length === 0){
    const empty = document.createElement('div');
    empty.className = 'settle-empty';
    empty.textContent = '아직 등록된 경비가 없어요. 위의 "경비 추가" 버튼으로 시작해보세요.';
    panel.appendChild(empty);
  } else {
    const ledger = document.createElement('div');
    ledger.className = 'balance-table';
    ledger.innerHTML = tripExpenses.map(e => {
      const isMine = AUTH.uid && e.ownerId === AUTH.uid;
      const dateLabel = new Date(e.createdAt).toLocaleDateString('ko-KR', { month:'numeric', day:'numeric' });
      const participantsLabel = e.participants.length === MEMBERS.length ? '전원' : e.participants.join(', ');
      return `
        <div class="expense-row">
          <div class="expense-main">
            <div class="expense-memo">${e.memo || '(내용 없음)'}</div>
            <div class="expense-sub">${e.payer} 결제 · ${participantsLabel} 분담 · ${dateLabel}</div>
          </div>
          <div style="text-align:right;">
            <div class="expense-amount">¥${e.amount.toLocaleString()}</div>
            ${isMine ? `<div class="expense-actions">
              <button type="button" class="icon-btn edit-expense-btn" data-id="${e.name}" title="수정">✎</button>
              <button type="button" class="icon-btn danger del-expense-btn" data-id="${e.name}" title="삭제">✕</button>
            </div>` : ''}
          </div>
        </div>
      `;
    }).join('');
    panel.appendChild(ledger);
  }
}

function openExpenseModal(id){
  if(MEMBERS.length < 2){ toast('먼저 인원을 등록해주세요'); return; }
  editingExpenseId = id;
  const modal = document.getElementById('expenseModal');
  const title = document.getElementById('expenseModalTitle');
  const payerSel = document.getElementById('ef-payer');
  payerSel.innerHTML = MEMBERS.map(m => `<option value="${m}">${m}</option>`).join('');

  const partWrap = document.getElementById('ef-participants');
  partWrap.innerHTML = MEMBERS.map(m => `
    <label class="participant-check"><input type="checkbox" value="${m}" checked> ${m}</label>
  `).join('');

  if(id){
    const exp = EXPENSES.find(e => e.name === id);
    if(!exp) return;
    title.textContent = '경비 수정';
    payerSel.value = exp.payer;
    document.getElementById('ef-amount').value = exp.amount;
    document.getElementById('ef-memo').value = exp.memo;
    partWrap.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.checked = exp.participants.includes(cb.value);
    });
  } else {
    title.textContent = '경비 추가';
    document.getElementById('ef-amount').value = '';
    document.getElementById('ef-memo').value = '';
  }
  modal.classList.add('show');
}

document.getElementById('expenseModalCancel').addEventListener('click', () => {
  document.getElementById('expenseModal').classList.remove('show');
});

document.getElementById('expenseModalSave').addEventListener('click', async () => {
  const payer = document.getElementById('ef-payer').value;
  const amount = Number(document.getElementById('ef-amount').value);
  const memo = document.getElementById('ef-memo').value.trim();
  const participants = [...document.querySelectorAll('#ef-participants input:checked')].map(cb => cb.value);

  if(!amount || amount <= 0){ alert('금액을 입력해주세요'); return; }
  if(participants.length === 0){ alert('나눠 낸 사람을 1명 이상 선택해주세요'); return; }

  const saveBtn = document.getElementById('expenseModalSave');
  saveBtn.disabled = true; saveBtn.textContent = '저장 중…';
  try{
    if(editingExpenseId){
      const ok = await updateExpenseDoc(editingExpenseId, payer, amount, memo, participants);
      if(ok){
        const idx = EXPENSES.findIndex(e => e.name === editingExpenseId);
        if(idx > -1) EXPENSES[idx] = { ...EXPENSES[idx], payer, amount: Math.round(amount), memo, participants };
      } else {
        toast('수정하지 못했어요'); return;
      }
    } else {
      const created = await addExpenseDoc(currentTrip.id, payer, amount, memo, participants);
      EXPENSES.unshift(created);
    }
    document.getElementById('expenseModal').classList.remove('show');
    renderAll();
    toast('저장했어요');
  }catch(e){
    toast('저장 중 오류가 발생했어요');
  }finally{
    saveBtn.disabled = false; saveBtn.textContent = '저장';
  }
});

// ---- Member roster: add/remove (writes straight to Firestore, no
// GitHub admin token needed — anyone in the group can set this up) ----
async function addMember(){
  const input = document.getElementById('newMemberName');
  if(!input) return;
  const name = input.value.trim();
  if(!name) return;
  if(MEMBERS.includes(name)){ toast('이미 등록된 이름이에요'); input.value = ''; return; }
  const updated = [...MEMBERS, name];
  input.disabled = true;
  try{
    const ok = await saveMembers(currentTrip.id, updated);
    if(ok){ MEMBERS = updated; renderAll(); toast(`${name}님을 추가했어요`); }
    else toast('추가하지 못했어요');
  }catch(e){
    toast('추가 중 오류가 발생했어요');
  }finally{
    if(input) input.disabled = false;
  }
}

async function removeMember(name){
  if(!confirm(`${name}님을 인원 목록에서 삭제할까요? (기존 경비 내역은 남아있어요)`)) return;
  const updated = MEMBERS.filter(m => m !== name);
  try{
    const ok = await saveMembers(currentTrip.id, updated);
    if(ok){ MEMBERS = updated; renderAll(); toast('삭제했어요'); }
    else toast('삭제하지 못했어요');
  }catch(e){
    toast('삭제 중 오류가 발생했어요');
  }
}

// ---- Expense delete (only the device that added it can delete —
// same ownerId check the photo gallery uses) ----
async function deleteExpense(docName){
  if(!confirm('이 경비 내역을 삭제할까요? 되돌릴 수 없어요.')) return;
  try{
    const ok = await deleteExpenseDoc(docName);
    if(ok){
      EXPENSES = EXPENSES.filter(e => e.name !== docName);
      renderAll();
      toast('삭제했어요');
    } else {
      toast('삭제하지 못했어요');
    }
  }catch(e){
    toast('삭제 중 오류가 발생했어요');
  }
}

function ddayInfo(targetDateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(targetDateStr + 'T00:00:00');
  const diffDays = Math.round((target - today) / 86400000);
  let cls = 'normal', label;
  if(diffDays < 0){ cls = 'past'; label = '마감 지남'; }
  else if(diffDays === 0){ cls = 'urgent'; label = 'D-DAY'; }
  else if(diffDays <= 3){ cls = 'urgent'; label = `D-${diffDays}`; }
  else if(diffDays <= 7){ cls = 'soon'; label = `D-${diffDays}`; }
  else { cls = 'normal'; label = `D-${diffDays}`; }
  return { diffDays, cls, label };
}

// Firebase anonymous auth (gives each device a stable uid so
// "delete my own photos" can be enforced by Firestore rules)
// ---------------------------------------------------------------
async function ensureAuth(){
  const refreshToken = localStorage.getItem('anon_refresh_token');
  if(refreshToken){
    try{
      const res = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FIREBASE_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(refreshToken)}`
      });
      if(res.ok){
        const data = await res.json();
        AUTH.idToken = data.id_token;
        AUTH.uid = data.user_id;
        localStorage.setItem('anon_refresh_token', data.refresh_token);
        return;
      }
    }catch(e){ /* fall through to fresh sign-up */ }
  }
  const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_API_KEY}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ returnSecureToken: true })
  });
  const data = await res.json();
  AUTH.idToken = data.idToken;
  AUTH.uid = data.localId;
  localStorage.setItem('anon_refresh_token', data.refreshToken);
}

// ---- Minimal EXIF reader (JPEG only): pulls just DateTimeOriginal and
// GPS lat/lng, which is all we display. Reading only the first 256KB
// keeps this fast — EXIF headers sit right after the JPEG SOI marker. ----
function readPhotoExif(file){
  return new Promise((resolve) => {
    if(!file){ resolve(null); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      try{ resolve(parseExifFromArrayBuffer(e.target.result)); }
      catch(err){ resolve(null); }
    };
    reader.onerror = () => resolve(null);
    reader.readAsArrayBuffer(file.slice(0, 262144));
  });
}

function parseExifFromArrayBuffer(buf){
  const view = new DataView(buf);
  if(view.byteLength < 4 || view.getUint16(0, false) !== 0xFFD8) return null; // not a JPEG
  let offset = 2;
  while(offset < view.byteLength - 1){
    const marker = view.getUint16(offset, false);
    offset += 2;
    if(marker === 0xFFE1){
      const segStart = offset + 2;
      if(segStart + 4 > view.byteLength || view.getUint32(segStart, false) !== 0x45786966) return null; // "Exif"
      return exifParseTiff(view, segStart + 6);
    } else if((marker & 0xFF00) !== 0xFF00){
      break; // hit image scan data — no EXIF segment found
    } else {
      if(offset + 2 > view.byteLength) break;
      offset += view.getUint16(offset, false);
    }
  }
  return null;
}

function exifParseTiff(view, tiffStart){
  const little = view.getUint16(tiffStart, false) === 0x4949;
  const firstIfdOffset = view.getUint32(tiffStart + 4, little);
  const ifd0 = exifReadIfd(view, tiffStart, tiffStart + firstIfdOffset, little);

  let dateTimeOriginal = null;
  let gps = null;

  if(ifd0.tags[0x8769]){ // Exif sub-IFD pointer
    const exifIfd = exifReadIfd(view, tiffStart, tiffStart + ifd0.tags[0x8769].value, little);
    const dt = exifIfd.tags[0x9003] || exifIfd.tags[0x9004]; // DateTimeOriginal / DateTimeDigitized
    if(dt && dt.ascii) dateTimeOriginal = dt.ascii.replace(/\0+$/, '');
  }
  if(ifd0.tags[0x8825]){ // GPS IFD pointer
    const gpsIfd = exifReadIfd(view, tiffStart, tiffStart + ifd0.tags[0x8825].value, little);
    const latRef = gpsIfd.tags[1] && gpsIfd.tags[1].ascii;
    const lat = gpsIfd.tags[2] && gpsIfd.tags[2].rationals;
    const lngRef = gpsIfd.tags[3] && gpsIfd.tags[3].ascii;
    const lng = gpsIfd.tags[4] && gpsIfd.tags[4].rationals;
    if(lat && lng && lat.length === 3 && lng.length === 3){
      let latDeg = exifDmsToDeg(lat);
      let lngDeg = exifDmsToDeg(lng);
      if(latRef && latRef[0] === 'S') latDeg = -latDeg;
      if(lngRef && lngRef[0] === 'W') lngDeg = -lngDeg;
      gps = { lat: latDeg, lng: lngDeg };
    }
  }
  return { dateTimeOriginal, gps };
}

function exifDmsToDeg(rationals){
  const [d, m, s] = rationals.map(r => r.den ? r.num / r.den : 0);
  return d + m / 60 + s / 3600;
}

function exifReadIfd(view, tiffStart, ifdOffset, little){
  const numEntries = view.getUint16(ifdOffset, little);
  const tags = {};
  const typeSizes = {1:1,2:1,3:2,4:4,5:8,7:1,9:4,10:8};
  for(let i = 0; i < numEntries; i++){
    const entryOffset = ifdOffset + 2 + i * 12;
    const tag = view.getUint16(entryOffset, little);
    const type = view.getUint16(entryOffset + 2, little);
    const count = view.getUint32(entryOffset + 4, little);
    const valueOffsetField = entryOffset + 8;
    const size = (typeSizes[type] || 1) * count;
    const dataOffset = size <= 4 ? valueOffsetField : tiffStart + view.getUint32(valueOffsetField, little);

    let entry = {};
    if(type === 2){ // ASCII
      let str = '';
      for(let k = 0; k < count; k++) str += String.fromCharCode(view.getUint8(dataOffset + k));
      entry.ascii = str;
    } else if(type === 5 || type === 10){ // RATIONAL / SRATIONAL
      const rationals = [];
      for(let k = 0; k < count; k++){
        const num = type === 5 ? view.getUint32(dataOffset + k*8, little) : view.getInt32(dataOffset + k*8, little);
        const den = type === 5 ? view.getUint32(dataOffset + k*8 + 4, little) : view.getInt32(dataOffset + k*8 + 4, little);
        rationals.push({ num, den });
      }
      entry.rationals = rationals;
    } else if(type === 4){
      entry.value = view.getUint32(size <= 4 ? valueOffsetField : dataOffset, little);
    } else if(type === 3){
      entry.value = view.getUint16(size <= 4 ? valueOffsetField : dataOffset, little);
    } else {
      entry.value = view.getUint32(valueOffsetField, little);
    }
    tags[tag] = entry;
  }
  return { tags };
}

// EXIF dates look like "2026:11:13 14:32:10" (no timezone) — treat as local time.
function exifDateToIso(s){
  const m = s.match(/^(\d{4}):(\d{2}):(\d{2})\s+(\d{2}):(\d{2}):(\d{2})/);
  return m ? `${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}` : null;
}

async function uploadPhoto(itemId, file){
  await ensureAuth();
  const exif = await readPhotoExif(file).catch(() => null);

  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', CLOUDINARY_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, { method:'POST', body: fd });
  if(!res.ok) throw new Error('Cloudinary upload failed');
  const cdata = await res.json();
  const url = cdata.secure_url;
  const publicId = cdata.public_id || '';

  if(!localStorage.getItem('uploader_asked')){
    const name = prompt('사진 올릴 때 표시할 이름을 알려주세요 (안 적어도 괜찮아요)');
    localStorage.setItem('uploader_asked', '1');
    if(name) localStorage.setItem('uploader_name', name);
  }
  const uploader = localStorage.getItem('uploader_name') || '';
  const takenAt = (exif && exif.dateTimeOriginal) ? exifDateToIso(exif.dateTimeOriginal) : null;
  const lat = (exif && exif.gps) ? exif.gps.lat : null;
  const lng = (exif && exif.gps) ? exif.gps.lng : null;

  const fields = {
    itemId: { stringValue: itemId },
    url: { stringValue: url },
    createdAt: { timestampValue: new Date().toISOString() },
    uploader: { stringValue: uploader },
    ownerId: { stringValue: AUTH.uid },
    publicId: { stringValue: publicId },
  };
  if(takenAt) fields.takenAt = { stringValue: takenAt };
  if(lat != null && lng != null){
    fields.lat = { doubleValue: lat };
    fields.lng = { doubleValue: lng };
  }

  const fsRes = await fetch(`https://firestore.googleapis.com/v1/projects/${FIRESTORE_PROJECT}/databases/(default)/documents/photos`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${AUTH.idToken}` },
    body: JSON.stringify({ fields })
  });
  if(!fsRes.ok) throw new Error('사진 정보를 저장하지 못했어요');
  const fsData = await fsRes.json();

  return { url, name: fsData.name, ownerId: AUTH.uid, publicId, uploader, takenAt, lat, lng, createdAt: new Date().toISOString() };
}

// Greedy min-transaction settlement: repeatedly match the biggest creditor
// with the biggest debtor until every balance is (near) zero.
function computeSettlementTransfers(balances){
  const creditors = balances.filter(b => b.net > 0.5).map(b => ({ ...b })).sort((a,b) => b.net - a.net);
  const debtors = balances.filter(b => b.net < -0.5).map(b => ({ name: b.name, net: -b.net })).sort((a,b) => b.net - a.net);
  const transfers = [];
  let i = 0, j = 0;
  while(i < debtors.length && j < creditors.length){
    const pay = Math.min(debtors[i].net, creditors[j].net);
    if(pay > 0.5) transfers.push({ from: debtors[i].name, to: creditors[j].name, amount: Math.round(pay) });
    debtors[i].net -= pay;
    creditors[j].net -= pay;
    if(debtors[i].net <= 0.5) i++;
    if(creditors[j].net <= 0.5) j++;
  }
  return transfers;
}

async function bulkDeletePhotos(){

  toast('삭제 중…');

// Opens the lightbox on `list[index]`, keeping the rest of `list` around
// so lbPrev/lbNext (or swipe/arrow keys) can slideshow through it in order.
let lbInfoOpen = false;

function openLightboxAt(list, index){
  if(!list || !list.length) return;
  currentPhotoList = list;
  currentPhotoIndex = Math.max(0, Math.min(index, list.length - 1));
  lbInfoOpen = false;
  renderLightboxPhoto();
  document.getElementById('lightbox').classList.add('show');
}
function renderLightboxPhoto(){
  const photo = currentPhotoList[currentPhotoIndex];
  if(!photo) return;
  currentLightboxPhoto = photo;
  document.getElementById('lightboxImg').src = photo.url;
  const delBtn = document.getElementById('lbDelete');
  delBtn.style.display = (AUTH.uid && photo.ownerId && photo.ownerId === AUTH.uid) ? 'inline-flex' : 'none';
  const multi = currentPhotoList.length > 1;
  document.getElementById('lbPrev').classList.toggle('hidden', !multi);
  document.getElementById('lbNext').classList.toggle('hidden', !multi);
  document.getElementById('lbCounter').textContent = multi ? `${currentPhotoIndex + 1} / ${currentPhotoList.length}` : '';
  renderLightboxInfoPanel(photo);
}

// Photo metadata panel: uploader, when it was actually taken (EXIF, falling
// back to upload time if the phone/browser didn't hand us EXIF), and a map
// link when GPS was present in the file. Most direct camera-capture photos
// on iOS won't have GPS (iOS strips it for that flow) — we just omit the
// row rather than showing an error when a field is missing.
function renderLightboxInfoPanel(photo){
  const panel = document.getElementById('lbInfoPanel');
  panel.classList.toggle('show', lbInfoOpen);
  if(!lbInfoOpen) return;

  const takenDate = photo.takenAt ? new Date(photo.takenAt) : (photo.createdAt ? new Date(photo.createdAt) : null);
  const dateLabel = takenDate && !isNaN(takenDate)
    ? takenDate.toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }) + (photo.takenAt ? ' (촬영)' : ' (업로드)')
    : '정보 없음';
  const uploaderLabel = photo.uploader ? photo.uploader : '이름 미입력';
  const rows = [
    `<div class="lbi-row"><b>올린 사람</b> ${uploaderLabel}</div>`,
    `<div class="lbi-row"><b>일시</b> ${dateLabel}</div>`,
  ];
  if(photo.lat != null && photo.lng != null){
    const mapUrl = `https://www.google.com/maps/search/?api=1&query=${photo.lat},${photo.lng}`;
    rows.push(`<div class="lbi-row"><b>위치</b> <a href="${mapUrl}" target="_blank" rel="noopener">지도에서 보기 ↗</a></div>`);
  } else {
    rows.push(`<div class="lbi-row"><b>위치</b> 정보 없음</div>`);
  }
  panel.innerHTML = rows.join('');
}

async function githubSaveFile(path, obj, message){
  const pat = localStorage.getItem('gh_pat');
  if(!pat) throw new Error('토큰이 없어요');
  const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${encodeURIComponent(path)}`;

  const getRes = await fetch(url, {
    headers: { Authorization: `token ${pat}`, Accept: 'application/vnd.github+json' }
  });
  let sha; // left undefined when the file doesn't exist yet — creates it
  if(getRes.status === 404){
    sha = undefined;
  } else if(!getRes.ok){
    throw new Error('파일 정보를 가져오지 못했어요 (토큰 확인 필요)');
  } else {
    sha = (await getRes.json()).sha;
  }

  const jsonStr = JSON.stringify(obj, null, 2);
  const content = btoa(unescape(encodeURIComponent(jsonStr)));

  const body = { message, content, branch: GH_BRANCH };
  if(sha) body.sha = sha;

  const putRes = await fetch(url, {
    method: 'PUT',
    headers: { Authorization: `token ${pat}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if(!putRes.ok){
    const err = await putRes.json().catch(() => ({}));
    throw new Error(err.message || '저장에 실패했어요');
  }
  return true;
}

let editingItemId = null;

// Adds a brand new date group. Days are derived from the unique "day"
// label on each item (see renderAll), so this just opens the item
// modal pre-filled with a new day label — saving the first item for
// that day is what makes its tab appear.
function promptNewDay(){
  const existingDays = [...new Set(DATA.map(d => d.day))];
  const dayLabel = prompt(`새 날짜의 이름을 입력하세요 (예: Day4)\n이미 있는 날짜: ${existingDays.map(d => d.split(' · ')[0]).join(', ') || '없음'}`, `Day${existingDays.length + 1}`);
  if(!dayLabel || !dayLabel.trim()) return;
  const dateLabel = prompt('날짜를 입력하세요 (예: 11/16(월))', '');
  const day = dateLabel && dateLabel.trim() ? `${dayLabel.trim()} · ${dateLabel.trim()}` : dayLabel.trim();
  if(existingDays.includes(day)){
    toast('이미 있는 날짜예요. 해당 탭에서 일정을 추가해주세요.');
    return;
  }
  openItemModal(null, day);
}

function openItemModal(id, dayForNew){
  editingItemId = id;
  const modal = document.getElementById('itemModal');
  const title = document.getElementById('itemModalTitle');

    const item = DATA.find(d => d.id === id);
    if(!item) return;

    document.getElementById('f-price').value = (item.price === null || item.price === undefined) ? '' : item.price;
    document.getElementById('f-priceLabel').value = item.priceLabel || '';

    title.textContent = '일정 추가';
    document.getElementById('f-day').value = dayForNew || '';
    document.getElementById('f-time').value = '';
    document.getElementById('f-type').value = '';
    document.getElementById('f-priority').value = '-';

    document.getElementById('f-addr').value = '';
    document.getElementById('f-memo').value = '';
    document.getElementById('f-home').value = '';

document.getElementById('itemModalSave').addEventListener('click', () => {
  const day = document.getElementById('f-day').value.trim();
  const time = document.getElementById('f-time').value.trim();
  const name = document.getElementById('f-name').value.trim();
  if(!day || !time || !name){ alert('날짜 그룹 · 시간 · 장소명은 필수예요'); return; }

  const addr = document.getElementById('f-addr').value.trim();
  const type = document.getElementById('f-type').value.trim() || '기타';
  const priority = document.getElementById('f-priority').value;
  const memo = document.getElementById('f-memo').value.trim();
  const home = document.getElementById('f-home').value.trim();
  const priceRaw = document.getElementById('f-price').value;
  const price = priceRaw === '' ? null : Number(priceRaw);
  const priceLabel = document.getElementById('f-priceLabel').value.trim();

  const q = encodeURIComponent(addr || name);
  const map = `https://www.google.com/maps/search/?api=1&query=${q}`;
  const dir = `https://www.google.com/maps/dir/?api=1&destination=${q}`;

  if(editingItemId){
    const idx = DATA.findIndex(d => d.id === editingItemId);

    DATA.push({ id: genId('i'), day, time, type, priority, name, addr, memo, home, price, priceLabel, map, dir });

    activeIdx = newDays.indexOf(day); // jump to the (possibly brand new) day tab

  renderAll();

async function loadTripsIndex(){
  try{
    const res = await fetch(TRIPS_INDEX_PATH, { cache: 'no-store' });
    if(!res.ok) throw new Error('no trips.json');
    const list = await res.json();
    if(Array.isArray(list) && list.length) return list;
    throw new Error('empty trips.json');
  }catch(e){
    return [DEFAULT_TRIP];
  }
}

function renderTripSwitcher(){
  const el = document.getElementById('tripSwitcher');
  el.innerHTML = '';
  el.classList.toggle('hidden', TRIPS.length <= 1 && !document.body.classList.contains('admin-mode'));

  TRIPS.forEach(trip => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'trip-chip' + (currentTrip && trip.id === currentTrip.id ? ' active' : '');
    chip.textContent = trip.title;
    chip.onclick = () => { if(!currentTrip || trip.id !== currentTrip.id) selectTrip(trip.id); };
    el.appendChild(chip);
  });

  const addChip = document.createElement('button');
  addChip.type = 'button';
  addChip.className = 'trip-chip add-trip admin-only flex';
  addChip.textContent = '＋ 새 여행';
  addChip.onclick = () => promptNewTrip();
  el.appendChild(addChip);
}

function applyHero(trip){
  document.getElementById('heroEyebrow').textContent = trip.eyebrow || '';
  document.getElementById('heroTitle').textContent = trip.title || '';
  document.getElementById('heroDesc').textContent = trip.desc || '';
}

// Switch the active trip: updates hero + remembered choice, loads that
// trip's itinerary/budget, and re-renders. Photos stay loaded globally
// (item ids are unique per trip already, so no cross-trip mixing).
async function selectTrip(tripId, opts){
  opts = opts || {};
  const trip = TRIPS.find(t => t.id === tripId) || TRIPS[0];
  if(!trip) return;
  currentTrip = trip;
  localStorage.setItem('current_trip_id', trip.id);
  applyHero(trip);
  activeIdx = 0;
  hasUnsaved = false;
  document.getElementById('saveBar').classList.add('hidden');
  renderTripSwitcher();

  try{
    const itinerary = await fetch(trip.dataFile, { cache: 'no-store' }).then(r => r.json());
    DATA = itinerary.days || [];
    BUDGET = itinerary.budget || { items: [] };
  }catch(e){
    DATA = [];
    BUDGET = { items: [] };
    if(!opts.silent) toast('이 여행의 일정 파일을 불러오지 못했어요');
  }
  renderAll();
}

function slugify(text){
  return text.trim().toLowerCase()
    .replace(/[^a-z0-9가-힣]+/g, '-')
    .replace(/^-+|-+$/g, '') || genId('trip');
}

// Admin-only: create a brand new trip (new empty data file + a new
// entry in trips.json), then switch to it. This is what lets the same
// app/site be reused for the next trip instead of overwriting this one.
async function promptNewTrip(){
  const title = prompt('새 여행 이름을 입력하세요 (예: 후쿠오카 4박5일 여행 노선도)');
  if(!title || !title.trim()) return;
  const eyebrow = prompt('상단에 짧게 표시할 문구 (예: FUKUOKA · 4.29–5.7)', '') || '';
  const desc = prompt('한 줄 설명 (선택)', '') || '';

  let id = slugify(title);
  if(TRIPS.some(t => t.id === id)) id = id + '-' + Date.now().toString(36).slice(-4);
  const dataFile = `trips/${id}.json`;

  if(!localStorage.getItem('gh_pat')){
    toast('먼저 관리자 모드로 GitHub 토큰을 등록해주세요');
    return;
  }

  toast('새 여행을 만들고 있어요…');
  try{
    await githubSaveFile(dataFile, { days: [], budget: { items: [] } }, `새 여행 추가: ${title}`);
    TRIPS.push({ id, dataFile, eyebrow, title: title.trim(), desc });
    await githubSaveFile(TRIPS_INDEX_PATH, TRIPS, `trips.json: ${title} 추가`);
    toast('새 여행을 만들었어요! 이제 날짜와 일정을 추가해보세요');
    await selectTrip(id);
  }catch(err){
    // Roll back the in-memory trip entry if trips.json save failed after
    // the data file succeeded, so the switcher doesn't show a ghost trip.
    TRIPS = TRIPS.filter(t => t.id !== id);
    renderTripSwitcher();
    toast('여행 추가 실패: ' + err.message);
  }
}

// ---------------------------------------------------------------
// Boot / data refresh
// ---------------------------------------------------------------
async function loadInitial(){
  TRIPS = await loadTripsIndex();
  const savedId = localStorage.getItem('current_trip_id');
  const startTrip = TRIPS.find(t => t.id === savedId) || TRIPS[0];

  try{
    await Promise.all([
      selectTrip(startTrip.id, { silent: true }),
      loadPhotos().then(p => { PHOTOS = p; renderAll(); }),
      loadMembers(startTrip.id).then(m => { MEMBERS = m; renderAll(); }),
      loadExpenses().then(ex => { EXPENSES = ex; renderAll(); }),
      ensureAuth().catch(() => {})
    ]);
  }catch(e){
    panelsEl.innerHTML = `<div style="text-align:center;color:var(--muted);font-size:12.5px;padding:40px 20px;">일정 데이터를 불러오지 못했어요.</div>`;
  }
}

// Re-fetch the trip list + current trip's itinerary/photos without
// disturbing the current tab/scroll. Skips silently while there are
// unsaved admin edits so a background refresh can't clobber work in
// progress.
async function refreshData(opts){
  opts = opts || {};
  if(hasUnsaved){
    if(opts.manual) toast('저장하지 않은 수정사항이 있어요. 먼저 저장하거나 취소해주세요.');
    return;
  }
  try{
    const [trips, itinerary, photos] = await Promise.all([
      loadTripsIndex(),
      fetch(currentTrip.dataFile, { cache: 'no-store' }).then(r => r.json()),
      loadPhotos()
    ]);
    const [members, expenses] = await Promise.all([
      loadMembers(currentTrip.id),
      loadExpenses()
    ]);
    const changed = JSON.stringify(TRIPS) !== JSON.stringify(trips)
      || JSON.stringify(DATA) !== JSON.stringify(itinerary.days)
      || JSON.stringify(BUDGET) !== JSON.stringify(itinerary.budget)
      || JSON.stringify(PHOTOS) !== JSON.stringify(photos)
      || JSON.stringify(MEMBERS) !== JSON.stringify(members)
      || JSON.stringify(EXPENSES) !== JSON.stringify(expenses);
    TRIPS = trips;
    currentTrip = TRIPS.find(t => t.id === currentTrip.id) || currentTrip;
    DATA = itinerary.days;
    BUDGET = itinerary.budget;
    PHOTOS = photos;
    MEMBERS = members;
    EXPENSES = expenses;
    renderTripSwitcher();
    renderAll();
    if(opts.manual) toast(changed ? '최신 내용으로 업데이트했어요' : '이미 최신 상태예요');
    else if(changed) toast('일정이 업데이트됐어요');
  } catch(e){
    if(opts.manual) toast('새로고침에 실패했어요');
  }
}

loadInitial();

const refreshBtn = document.getElementById('refreshBtn');
refreshBtn.addEventListener('click', async () => {
  refreshBtn.classList.add('spin');
  await refreshData({ manual: true });
  setTimeout(() => refreshBtn.classList.remove('spin'), 600);
});

// Auto-refresh whenever the app regains focus/visibility — this is what
// makes a homescreen-bookmarked PWA pick up changes without a manual
// reload, since standalone PWAs otherwise just resume their last state.
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') refreshData();
});
window.addEventListener('pageshow', (e) => {
  if(e.persisted) refreshData();
});
window.addEventListener('focus', () => refreshData());

// Also poll periodically while the tab stays open/active.
setInterval(() => {
  if(document.visibilityState === 'visible') refreshData();
}, 5 * 60 * 1000);

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      // A worker is already waiting (e.g. updated while app was closed).
      if(reg.waiting) showUpdateBanner(reg);

      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', () => {
          if(nw.state === 'installed' && navigator.serviceWorker.controller){
            showUpdateBanner(reg);
          }
        });
      });

      // Check for a new sw.js whenever the app becomes visible again.
      document.addEventListener('visibilitychange', () => {
        if(document.visibilityState === 'visible') reg.update().catch(() => {});
      });
      setInterval(() => reg.update().catch(() => {}), 5 * 60 * 1000);
    }).catch(() => {});
  });

  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(reloading) return;
    reloading = true;
    window.location.reload();
  });
}

function showUpdateBanner(reg){
  const banner = document.getElementById('updateBanner');
  banner.classList.add('show');
  document.getElementById('updateBannerBtn').onclick = () => {
    if(reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
  };
}
</script>
