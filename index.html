<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>오사카 3박4일 · 여행 노선도</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오사카 여행">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg: #12172a;
    --bg-soft: #171d34;
    --surface: #1d2440;
    --surface-alt: #232b4d;
    --line: #323b60;
    --cream: #f3ede0;
    --muted: #92a0c4;
    --amber: #e0a458;
    --amber-dim: #4a3a26;
    --move: #7ea6d8;
    --food: #e0a458;
    --sight: #8fc08a;
    --drink: #c98cc9;
    --shop: #5fc4bb;
    --stay: #9aa0b8;
    --alt-line: #4a5378;
    --danger: #e07a7a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;background:var(--bg); color:var(--cream); font-family:'Noto Sans KR',sans-serif;}
  body{padding-bottom:48px;}

  .hero{
    position:relative;
    padding: calc(28px + env(safe-area-inset-top)) 20px 18px;
    background:
      radial-gradient(circle at 85% -10%, rgba(224,164,88,0.16), transparent 55%),
      var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .hero .eyebrow{
    font-size: 12px; letter-spacing: 0.18em; color: var(--amber); font-weight:700;
    text-transform: uppercase;
  }
  .hero h1{
    font-family:'Noto Serif KR', serif; font-weight:700;
    font-size: 26px; margin: 6px 0 8px; line-height:1.3;
  }
  .hero p{ margin:0; color:var(--muted); font-size:13.5px; line-height:1.6;}

  .admin-toggle{
    position:absolute; top: calc(14px + env(safe-area-inset-top)); right:14px;
    width:34px; height:34px; border-radius:50%;
    background: var(--surface); border:1px solid var(--line); color:var(--muted);
    display:flex; align-items:center; justify-content:center; font-size:16px;
    cursor:pointer;
  }
  body.admin-mode .admin-toggle{ background: var(--amber-dim); border-color:var(--amber); color:var(--amber); }

  .tabs{
    position: sticky; top:0; z-index: 20;
    display:flex; gap:0;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--line);
    padding: 0 12px;
    overflow-x:auto;
  }
  .tab{
    flex:1; text-align:center; padding: 14px 4px 12px;
    font-size: 13.5px; font-weight:700; color: var(--muted);
    border-bottom: 3px solid transparent;
    cursor:pointer; user-select:none; white-space:nowrap;
    transition: color .2s, border-color .2s;
  }
  .tab .d{ display:block; font-family:'Noto Serif KR',serif; font-size:17px; margin-bottom:2px; }
  .tab.active{ color: var(--cream); border-bottom-color: var(--amber); }

  .day-panel{ display:none; padding: 22px 16px 8px; }
  .day-panel.active{ display:block; }

  .day-meta{
    display:flex; justify-content:space-between; align-items:baseline;
    margin: 0 4px 18px;
    color: var(--muted); font-size:12.5px;
  }
  .day-meta b{ color:var(--cream); font-family:'Noto Serif KR',serif; font-size:15px; font-weight:600;}

  .timeline{ position:relative; padding-left: 68px; }
  .timeline::before{
    content:""; position:absolute; left: 46px; top:6px; bottom: 6px; width:2px;
    background: repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 11px);
  }

  .stop{ position:relative; margin-bottom: 16px; }
  .stop .time{
    position:absolute; left:-68px; top:6px; width:32px; text-align:right;
    font-size:12.5px; font-weight:800; color:var(--cream); font-variant-numeric: tabular-nums;
    line-height:1.15;
  }
  .stop .dot{
    position:absolute; left:-29px; top:7px; width:14px; height:14px; border-radius:50%;
    background: var(--dot-color, var(--move));
    border: 3px solid var(--bg);
    box-shadow: 0 0 0 2px var(--dot-color, var(--move));
    z-index:2;
  }
  .stop.alt .dot{ box-shadow: 0 0 0 2px var(--dot-color, var(--move)); opacity:.55; }
  .stop.alt::after{
    content:""; position:absolute; left:-37px; top:24px; bottom:-16px; width:0;
    border-left: 2px dashed var(--alt-line);
  }

  .gap{ position:relative; height: 24px; margin: -6px 0 -2px; }
  .gap .glabel{
    position:absolute; left:-22px; top:50%; transform:translate(-50%,-50%);
    background: var(--bg); color: var(--muted);
    font-size:10.5px; font-weight:700; white-space:nowrap;
    padding: 3px 9px; border-radius:999px; border:1px solid var(--line);
    z-index:1;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 13px 14px 12px;
  }
  .stop.alt .card{ background: transparent; border-style:dashed; padding: 10px 14px; }

  .card-top{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:6px; }
  .badge{
    font-size:11px; font-weight:700; padding: 3px 9px; border-radius: 999px;
    color: var(--bg); background: var(--dot-color, var(--move));
    letter-spacing: .01em;
  }
  .tag{
    font-size: 10.5px; font-weight:700; padding: 2px 7px; border-radius:6px;
    border:1px solid var(--amber); color: var(--amber);
  }
  .tag.alt{ border-color: var(--muted); color: var(--muted); }
  .price-chip{
    margin-left:auto; font-size:11.5px; font-weight:800; color:var(--amber);
    font-variant-numeric: tabular-nums; white-space:nowrap;
  }
  .price-chip.free{ color: var(--muted); font-weight:700; }

  .name{ font-size: 15.5px; font-weight:700; color:var(--cream); margin: 2px 0 3px; line-height:1.4;}
  .stop.alt .name{ font-size:14px; font-weight:500; color: var(--muted); }
  .addr{ font-size:12.5px; color: var(--muted); margin-bottom:4px; }
  .memo{ font-size:12.5px; color:#c7cde4; line-height:1.55; margin: 4px 0 10px; }

  .links{ display:flex; gap:6px; flex-wrap:wrap; }
  .lnk{
    display:inline-flex; align-items:center; gap:4px;
    font-size:11.5px; font-weight:700; color: var(--cream);
    background: var(--surface-alt); border:1px solid var(--line);
    padding: 6px 10px; border-radius: 8px; text-decoration:none;
  }
  .lnk svg{ width:12px; height:12px; }
  .lnk.primary{ background: var(--amber-dim); border-color: var(--amber); color: var(--amber); }

  .legend{
    display:flex; flex-wrap:wrap; gap: 10px 14px; margin: 4px 4px 20px;
    font-size:11px; color:var(--muted);
  }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:8px; height:8px; border-radius:50%; display:inline-block; }

  footer{ text-align:center; color: var(--muted); font-size:11.5px; padding: 20px 20px 4px; }

  .budget-summary{
    display:flex; gap:10px; margin: 0 4px 20px;
  }
  .bs-row{
    flex:1; background: var(--surface); border:1px solid var(--amber); border-radius:14px;
    padding: 14px 12px; text-align:center;
  }
  .bs-label{ font-size:11.5px; color:var(--muted); font-weight:700; margin-bottom:6px; }
  .bs-value{ font-family:'Noto Serif KR',serif; font-size:20px; font-weight:700; color:var(--amber); }

  .budget-section{ margin: 0 4px 18px; }
  .bsec-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .bsec-sub{ font-size:12px; color:var(--muted); font-weight:700; }

  .budget-row{
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    padding: 9px 12px; background: var(--surface); border:1px solid var(--line);
    border-radius:10px; margin-bottom:6px;
  }
  .br-name{ font-size:13px; color:var(--cream); }
  .br-note{ display:block; font-size:11px; color:var(--muted); margin-top:2px; font-weight:400; }
  .br-price{ font-size:13px; font-weight:700; color:var(--cream); white-space:nowrap; font-variant-numeric: tabular-nums; }

  .budget-notes{
    margin: 20px 4px 4px; padding: 14px 14px 12px; background: var(--surface-alt);
    border:1px dashed var(--line); border-radius:14px;
  }
  .bn-title{ font-size:12.5px; font-weight:800; color:var(--amber); margin-bottom:8px; }
  .bn-item{ font-size:12.5px; color:#c7cde4; line-height:1.7; padding-left:14px; position:relative; }
  .bn-item::before{ content:"·"; position:absolute; left:2px; color:var(--muted); }

  .dday-badge{
    font-size:11.5px; font-weight:800; padding: 4px 10px; border-radius:999px;
    white-space:nowrap; font-variant-numeric: tabular-nums;
  }
  .dday-badge.urgent{ background:#5a2020; color:#ff9b9b; }
  .dday-badge.soon{ background: var(--amber-dim); color: var(--amber); }
  .dday-badge.normal{ background: var(--surface-alt); color: var(--muted); border:1px solid var(--line); }
  .dday-badge.past{ background: var(--surface-alt); color: var(--muted); opacity:.6; }

  .stay-card{
    background: var(--surface); border:1px solid var(--line); border-radius:14px;
    padding: 13px 14px 12px; margin: 0 4px 12px;
  }
  .stay-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .stay-status{
    font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:6px;
    border:1px solid var(--sight); color: var(--sight);
  }
  .stay-status.candidate{ border-color: var(--muted); color: var(--muted); }
  .stay-name{ font-size:15px; font-weight:700; color:var(--cream); margin:2px 0 4px; }
  .stay-dates{ font-size:12px; color:var(--muted); margin-bottom:8px; }
  .stay-row{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:#c7cde4; padding:5px 0; border-top:1px dashed var(--line); }
  .stay-row:first-of-type{ border-top:none; }
  .stay-note{ font-size:11.5px; color:var(--muted); margin-top:6px; line-height:1.5; }

  .section-title{ font-size:12.5px; font-weight:800; color:var(--amber); margin: 18px 4px 10px; letter-spacing:.02em; }
  .section-title:first-child{ margin-top:2px; }

  .check-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding: 10px 12px; background: var(--surface); border:1px solid var(--line);
    border-radius:10px; margin: 0 4px 6px;
  }
  .check-row.done{ opacity:.5; }
  .check-name{ font-size:12.5px; color:var(--cream); }
  .check-date{ display:block; font-size:10.5px; color:var(--muted); margin-top:2px; font-weight:400; }

  /* ---- Photos ---- */
  .photo-row{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .photo-thumb{
    width:52px; height:52px; object-fit:cover; border-radius:8px;
    border:1px solid var(--line); cursor:pointer;
  }
  .photo-add{
    width:52px; height:52px; border-radius:8px;
    background: var(--surface-alt); border:1px dashed var(--line); color:var(--muted);
    font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center;
    cursor:pointer; text-align:center; line-height:1.3; padding:2px;
  }
  .photo-add svg{ width:16px; height:16px; }

  .lightbox-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:100;
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  .lightbox-overlay.show{ display:flex; }
  .lightbox-box{ display:flex; flex-direction:column; align-items:center; gap:12px; max-width:100%; max-height:100%; }
  .lightbox-box img{ max-width:100%; max-height:70vh; border-radius:10px; }
  .lightbox-actions{ display:flex; gap:8px; }
  .lb-btn{
    padding:9px 14px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); color:var(--cream); font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .lb-btn.danger{ color:var(--danger); border-color:var(--danger); }

  /* ---- Gallery tab ---- */
  .gallery-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin: 0 4px; }
  .gallery-item{ position:relative; }
  .gallery-item img{
    width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px;
    border:1px solid var(--line); cursor:pointer; display:block;
  }
  .gallery-checkbox{
    position:absolute; top:6px; left:6px; z-index:2;
    width:20px; height:20px; cursor:pointer; accent-color:var(--amber);
    background:rgba(0,0,0,.55); border-radius:5px;
  }
  .gallery-cap{ font-size:10px; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gallery-empty{ text-align:center; color:var(--muted); font-size:12.5px; padding:40px 0; }
  .gallery-filter{ display:flex; align-items:center; gap:7px; margin:0 4px 14px; font-size:12.5px; color:var(--muted); cursor:pointer; }
  .gallery-filter input{ accent-color:var(--amber); width:16px; height:16px; cursor:pointer; }
  .bulk-delete-bar{
    display:none; align-items:center; justify-content:space-between; gap:10px;
    margin:0 4px 14px; padding:10px 12px; background:#2a1616; border:1px solid var(--danger); border-radius:12px;
  }
  .bulk-delete-bar span{ font-size:12.5px; font-weight:700; color:var(--danger); }
  .bulk-delete-bar button{
    padding:8px 14px; border-radius:8px; border:1px solid var(--danger);
    background:#3a1f1f; color:var(--danger); font-weight:700; font-size:12.5px; cursor:pointer;
  }

  /* ---- Admin: edit/delete buttons on cards ---- */
  .admin-only{ display:none; }
  body.admin-mode .admin-only{ display:inline-flex; }
  body.admin-mode .admin-only.block{ display:block; }
  body.admin-mode .admin-only.flex{ display:flex; }

  .card-admin-btns{ margin-left:auto; display:flex; gap:4px; }
  .icon-btn{
    width:24px; height:24px; border-radius:6px; border:1px solid var(--line);
    background:var(--surface-alt); color:var(--muted); font-size:12px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn.danger{ color: var(--danger); border-color: var(--danger); }

  .add-item-btn{
    display:block; width:100%; margin-top:10px; padding:12px;
    background: var(--surface-alt); border:1px dashed var(--line); border-radius:12px;
    color:var(--amber); font-weight:700; font-size:13px; cursor:pointer;
  }

  /* ---- Modal ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:110;
    display:none; align-items:flex-end; justify-content:center;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background: var(--bg-soft); border:1px solid var(--line); border-radius:18px 18px 0 0;
    width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
  }
  .modal-box h3{ margin:0 0 14px; font-family:'Noto Serif KR',serif; font-size:17px; }
  .modal-box label{ display:block; font-size:12px; color:var(--muted); font-weight:700; margin: 12px 0 5px; }
  .modal-box input, .modal-box select, .modal-box textarea{
    width:100%; background:var(--surface); border:1px solid var(--line); color:var(--cream);
    border-radius:9px; padding:10px 11px; font-size:13.5px; font-family:inherit;
  }
  .modal-box textarea{ resize:vertical; }
  .modal-actions{ display:flex; gap:8px; margin-top:18px; }
  .modal-actions button{
    flex:1; padding:12px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--cream); font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .modal-actions button.primary{ background:var(--amber-dim); border-color:var(--amber); color:var(--amber); }

  /* ---- Save bar & toast ---- */
  .save-bar{
    position:fixed; left:12px; right:12px; bottom: calc(14px + env(safe-area-inset-bottom));
    z-index:90; background: var(--amber-dim); border:1px solid var(--amber);
    border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .save-bar.hidden{ display:none; }
  .save-bar span{ flex:1; font-size:12.5px; color:var(--amber); font-weight:700; }
  .save-bar button{
    padding:9px 14px; border-radius:9px; border:1px solid var(--amber);
    background: var(--amber); color:#2a1c0a; font-weight:800; font-size:12.5px; cursor:pointer;
  }
  .save-bar button:disabled{ opacity:.6; }

  .toast{
    position:fixed; left:50%; bottom: 90px; transform:translateX(-50%);
    background: var(--surface); border:1px solid var(--line); color:var(--cream);
    padding:10px 16px; border-radius:10px; font-size:12.5px; z-index:120;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>

<div class="hero">
  <div class="eyebrow">OSAKA · 11.13 &ndash; 11.15</div>
  <h1>오사카 3박4일 여행 노선도</h1>
  <p>고등학교 친구 6인, 난바 · 신사이바시 숙소 기준. 날짜별로 탭을 눌러 확인하세요.</p>
  <button class="admin-toggle" id="adminToggle" title="관리자 모드">⚙</button>
</div>

<div class="tabs" id="tabs"></div>
<div id="panels"></div>

<footer>지도 보기 · 길찾기 버튼은 구글맵으로 연결됩니다 · 사진은 6인 모두에게 공유돼요</footer>

<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">

<div class="lightbox-overlay" id="lightbox">
  <div class="lightbox-box" id="lightboxBox">
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-actions">
      <button type="button" class="lb-btn" id="lbDownload">⬇ 저장</button>
      <button type="button" class="lb-btn danger" id="lbDelete" style="display:none;">삭제</button>
      <button type="button" class="lb-btn" id="lbClose">✕ 닫기</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="itemModal">
  <div class="modal-box">
    <h3 id="itemModalTitle">일정 추가</h3>
    <label>날짜 그룹 (예: Day1 · 11/13(금))</label>
    <input id="f-day" placeholder="Day1 · 11/13(금)">
    <label>시간</label>
    <input id="f-time" placeholder="14:00">
    <label>유형</label>
    <input id="f-type" list="typeList" placeholder="관광">
    <datalist id="typeList">
      <option value="이동"></option><option value="식사(아침)"></option><option value="식사(점심)"></option>
      <option value="식사(저녁)"></option><option value="관광"></option><option value="술집(1차)"></option>
      <option value="술집(2차)"></option><option value="술집(3차)"></option><option value="쇼핑"></option><option value="숙소"></option>
    </datalist>
    <label>우선순위</label>
    <select id="f-priority">
      <option value="-">-</option><option value="대표">대표</option><option value="대안">대안</option>
    </select>
    <label>장소명</label>
    <input id="f-name" placeholder="장소 이름">
    <label>주소 / 위치 설명</label>
    <input id="f-addr" placeholder="지도 검색에도 쓰여요">
    <label>메모</label>
    <textarea id="f-memo" rows="2"></textarea>
    <label>홈페이지 (선택)</label>
    <input id="f-home" placeholder="https://">
    <label>가격 · 엔화 (선택)</label>
    <input id="f-price" type="number" placeholder="1200">
    <label>가격 라벨 (선택, 예: 무료)</label>
    <input id="f-priceLabel" placeholder="무료">
    <div class="modal-actions">
      <button id="itemModalCancel">취소</button>
      <button id="itemModalSave" class="primary">저장</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="budgetModal">
  <div class="modal-box">
    <h3 id="budgetModalTitle">예산 항목 추가</h3>
    <label>분류</label>
    <input id="bf-cat" list="catList" placeholder="교통">
    <datalist id="catList">

function ddayInfo(targetDateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(targetDateStr + 'T00:00:00');
  const diffDays = Math.round((target - today) / 86400000);
  let cls = 'normal', label;
  if(diffDays < 0){ cls = 'past'; label = '마감 지남'; }
  else if(diffDays === 0){ cls = 'urgent'; label = 'D-DAY'; }
  else if(diffDays <= 3){ cls = 'urgent'; label = `D-${diffDays}`; }
  else if(diffDays <= 7){ cls = 'soon'; label = `D-${diffDays}`; }
  else { cls = 'normal'; label = `D-${diffDays}`; }
  return { diffDays, cls, label };
}

function loadStayPanel(sPanel){
  fetch('notify-data.json').then(r => r.json()).then(data => {
    let html = '';

    html += `<div class="section-title">숙소 후보 · 예약 현황</div>`;
    const stays = [...data.stays].sort((a,b) => new Date(a.free_cancel_deadline) - new Date(b.free_cancel_deadline));
    stays.forEach(stay => {
      const fc = ddayInfo(stay.free_cancel_deadline);
      const statusClass = stay.status === '예약완료' ? '' : 'candidate';
      html += `
        <div class="stay-card">
          <div class="stay-top">
            <span class="stay-status ${statusClass}">${stay.status}</span>
            <span class="dday-badge ${fc.cls}">무료취소 ${fc.label}</span>
          </div>
          <div class="stay-name">${stay.name}</div>
          <div class="stay-dates">${stay.checkin} ~ ${stay.checkout}${stay.price_display ? ` · ${stay.price_display}` : ''}</div>
          <div class="stay-row"><span>무료취소 마감</span><span>${stay.free_cancel_deadline}</span></div>
          ${stay.note ? `<div class="stay-note">${stay.note}</div>` : ''}
          ${stay.url ? `<div class="links" style="margin-top:8px;"><a class="lnk primary" href="${stay.url}" target="_blank" rel="noopener">에어비앤비 열기</a></div>` : ''}
        </div>
      `;
    });

    html += `<div class="section-title">여행 준비 체크리스트</div>`;
    const tripStart = data.trip_start;
    const items = data.checklist.map(it => {
      const d = new Date(tripStart + 'T00:00:00');
      d.setDate(d.getDate() - it.days_before);
      const dateStr = d.toISOString().slice(0,10);
      return { ...it, dateStr };
    }).sort((a,b) => new Date(a.dateStr) - new Date(b.dateStr));

    items.forEach(it => {
      const info = ddayInfo(it.dateStr);
      html += `
        <div class="check-row ${info.diffDays < 0 ? 'done' : ''}">
          <div class="check-name">${it.item}<span class="check-date">완료 권장일 ${it.dateStr}</span></div>
          <span class="dday-badge ${info.cls}">${info.label}</span>
        </div>
      `;
    });

    sPanel.innerHTML = html;
  }).catch(() => {
    sPanel.innerHTML = `<div style="text-align:center;color:var(--muted);font-size:12.5px;padding:30px 0;">숙소 정보를 불러오지 못했어요. notify-data.json을 확인해주세요.</div>`;
  });
}

function selectDay(i){

// ---------------------------------------------------------------
// Firebase anonymous auth (gives each device a stable uid so
// "delete my own photos" can be enforced by Firestore rules)
// ---------------------------------------------------------------
async function ensureAuth(){
  const refreshToken = localStorage.getItem('anon_refresh_token');
  if(refreshToken){
    try{
      const res = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FIREBASE_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(refreshToken)}`
      });
      if(res.ok){
        const data = await res.json();
        AUTH.idToken = data.id_token;
        AUTH.uid = data.user_id;
        localStorage.setItem('anon_refresh_token', data.refresh_token);
        return;
      }
    }catch(e){ /* fall through to fresh sign-up */ }
  }
  const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_API_KEY}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ returnSecureToken: true })
  });
  const data = await res.json();
  AUTH.idToken = data.idToken;
  AUTH.uid = data.localId;
  localStorage.setItem('anon_refresh_token', data.refreshToken);
}

// ---------------------------------------------------------------
// Photos: Cloudinary upload + Firestore metadata
// ---------------------------------------------------------------
async function loadPhotos(){
  try{
    const res = await fetch(`https://firestore.googleapis.com/v1/projects/${FIRESTORE_PROJECT}/databases/(default)/documents/photos?pageSize=500`);
    if(!res.ok) return {};
    const data = await res.json();
    const map = {};
    (data.documents || []).forEach(doc => {
      const f = doc.fields || {};
      const itemId = f.itemId && f.itemId.stringValue;
      const url = f.url && f.url.stringValue;
      const createdAt = (f.createdAt && f.createdAt.timestampValue) || doc.createTime;
      const ownerId = f.ownerId && f.ownerId.stringValue;
      const publicId = f.publicId && f.publicId.stringValue;
      if(!itemId || !url) return;
      (map[itemId] = map[itemId] || []).push({ url, createdAt, ownerId, publicId, name: doc.name });
    });
    Object.values(map).forEach(arr => arr.sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt)));
    return map;
  }catch(e){
    return {};
  }
}

async function uploadPhoto(itemId, file){
  await ensureAuth();

  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', CLOUDINARY_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, { method:'POST', body: fd });
  if(!res.ok) throw new Error('Cloudinary upload failed');
  const cdata = await res.json();
  const url = cdata.secure_url;
  const publicId = cdata.public_id || '';

  if(!localStorage.getItem('uploader_asked')){
    const name = prompt('사진 올릴 때 표시할 이름을 알려주세요 (안 적어도 괜찮아요)');
    localStorage.setItem('uploader_asked', '1');
    if(name) localStorage.setItem('uploader_name', name);
  }
  const uploader = localStorage.getItem('uploader_name') || '';

  const fsRes = await fetch(`https://firestore.googleapis.com/v1/projects/${FIRESTORE_PROJECT}/databases/(default)/documents/photos`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${AUTH.idToken}` },
    body: JSON.stringify({ fields: {
      itemId: { stringValue: itemId },
      url: { stringValue: url },
      createdAt: { timestampValue: new Date().toISOString() },
      uploader: { stringValue: uploader },
      ownerId: { stringValue: AUTH.uid },
      publicId: { stringValue: publicId },
    }})
  });
  if(!fsRes.ok) throw new Error('사진 정보를 저장하지 못했어요');
  const fsData = await fsRes.json();

  return { url, name: fsData.name, ownerId: AUTH.uid, publicId, createdAt: new Date().toISOString() };
}

async function deletePhotoDoc(docName){
  await ensureAuth();
  const res = await fetch(`https://firestore.googleapis.com/v1/${docName}`, {
    method: 'DELETE',
    headers: { Authorization: `Bearer ${AUTH.idToken}` }
  });
  return res.ok;
}

async function downloadSinglePhoto(url){
  try{
    const res = await fetch(url);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'osaka-photo.jpg';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(e){
    toast('다운로드에 실패했어요');
  }
}

async function downloadAllPhotos(photos, btn){
  if(!photos.length) return;
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = `압축 중… (0/${photos.length})`;
  try{
    const zip = new JSZip();
    for(let i = 0; i < photos.length; i++){
      try{
        const res = await fetch(photos[i].url);
        const blob = await res.blob();
        zip.file(`osaka_photo_${String(i+1).padStart(3,'0')}.jpg`, blob);
      }catch(e){ /* skip failed one */ }
      btn.textContent = `압축 중… (${i+1}/${photos.length})`;
    }
    const content = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(content);
    a.download = 'osaka-trip-photos.zip';
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('다운로드를 시작했어요');
  }catch(e){
    toast('압축에 실패했어요');
  }finally{
    btn.disabled = false;
    btn.textContent = origText;
  }
}

let pendingUploadItemId = null;
const photoInput = document.getElementById('photoInput');

photoInput.addEventListener('change', async () => {
  const file = photoInput.files[0];
  photoInput.value = '';
  if(!file || !pendingUploadItemId) return;
  const itemId = pendingUploadItemId;
  const row = document.querySelector(`.photo-row[data-item-id="${itemId}"]`);
  const addBtn = row ? row.querySelector('.photo-add') : null;
  if(addBtn){ addBtn.disabled = true; addBtn.textContent = '…'; }
  try{
    const photo = await uploadPhoto(itemId, file);
    (PHOTOS[itemId] = PHOTOS[itemId] || []).push(photo);
    renderAll();
    toast('사진이 올라갔어요');
  }catch(err){
    toast('사진 업로드에 실패했어요. 다시 시도해주세요.');
  }finally{
    if(addBtn){ addBtn.disabled = false; addBtn.innerHTML = ICONS.camera; }
  }
});

document.addEventListener('click', (e) => {
  const addBtn = e.target.closest('.photo-add');
  if(addBtn){ pendingUploadItemId = addBtn.dataset.itemId; photoInput.click(); return; }

  const thumb = e.target.closest('.photo-thumb, .gallery-item img');
  if(thumb){
    openLightbox({ url: thumb.dataset.url, name: thumb.dataset.name, ownerId: thumb.dataset.owner });
    return;
  }

  const editItemBtn = e.target.closest('.edit-item-btn');
  if(editItemBtn){ openItemModal(editItemBtn.dataset.id); return; }

  const delItemBtn = e.target.closest('.del-item-btn');
  if(delItemBtn){ deleteItem(delItemBtn.dataset.id); return; }

  const editBudgetBtn = e.target.closest('.edit-budget-btn');
  if(editBudgetBtn){ openBudgetModal(editBudgetBtn.dataset.id); return; }

  const delBudgetBtn = e.target.closest('.del-budget-btn');
  if(delBudgetBtn){ deleteBudgetItem(delBudgetBtn.dataset.id); return; }

  const bulkDeleteBtn = e.target.closest('#bulkDeleteBtn');
  if(bulkDeleteBtn){ bulkDeletePhotos(); return; }
});

document.addEventListener('change', (e) => {
  const cb = e.target.closest('.gallery-checkbox');
  if(cb){
    const name = cb.dataset.name;
    if(cb.checked) selectedPhotoNames.add(name); else selectedPhotoNames.delete(name);
    updateBulkBar();
    return;
  }
  const filterCb = e.target.closest('#ownOnlyFilter');
  if(filterCb){
    filterOwnOnly = filterCb.checked;
    renderAll();
    return;
  }
});

function updateBulkBar(){
  const bar = document.querySelector('.bulk-delete-bar');
  if(!bar) return;
  bar.style.display = selectedPhotoNames.size > 0 ? 'flex' : 'none';
  const span = bar.querySelector('span');
  if(span) span.textContent = `${selectedPhotoNames.size}장 선택됨`;
}

async function bulkDeletePhotos(){
  if(selectedPhotoNames.size === 0) return;
  const names = [...selectedPhotoNames];
  if(!confirm(`선택한 ${names.length}장을 삭제할까요? 되돌릴 수 없어요.`)) return;
  toast('삭제 중…');
  let successCount = 0;
  for(const name of names){
    try{
      const ok = await deletePhotoDoc(name);
      if(ok) successCount++;
    }catch(e){ /* skip failed one */ }
  }
  Object.keys(PHOTOS).forEach(k => { PHOTOS[k] = PHOTOS[k].filter(p => !names.includes(p.name)); });
  selectedPhotoNames.clear();
  renderAll();
  toast(`${successCount}장 삭제했어요`);
}

function openLightbox(photo){
  currentLightboxPhoto = photo;
  document.getElementById('lightboxImg').src = photo.url;
  const delBtn = document.getElementById('lbDelete');
  delBtn.style.display = (AUTH.uid && photo.ownerId && photo.ownerId === AUTH.uid) ? 'inline-flex' : 'none';
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
}
document.getElementById('lightbox').addEventListener('click', (e) => {
  if(e.target.id === 'lightbox') closeLightbox();
});
document.getElementById('lightboxBox').addEventListener('click', (e) => e.stopPropagation());
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbDownload').addEventListener('click', () => {
  if(currentLightboxPhoto) downloadSinglePhoto(currentLightboxPhoto.url);
});
document.getElementById('lbDelete').addEventListener('click', async () => {
  if(!currentLightboxPhoto || !currentLightboxPhoto.name) return;
  if(!confirm('이 사진을 삭제할까요? 되돌릴 수 없어요.')) return;
  const btn = document.getElementById('lbDelete');
  btn.disabled = true; btn.textContent = '삭제 중…';
  try{
    const ok = await deletePhotoDoc(currentLightboxPhoto.name);
    if(ok){
      const name = currentLightboxPhoto.name;
      Object.keys(PHOTOS).forEach(k => { PHOTOS[k] = PHOTOS[k].filter(p => p.name !== name); });
      closeLightbox();
      renderAll();
      toast('삭제했어요');
    } else {
      toast('삭제하지 못했어요');
    }
  }catch(e){
    toast('삭제 중 오류가 발생했어요');
  }finally{
    btn.disabled = false; btn.textContent = '삭제';
  }
});

// ---------------------------------------------------------------
// Admin mode
// ---------------------------------------------------------------
document.getElementById('adminToggle').addEventListener('click', () => {
  if(document.body.classList.contains('admin-mode')){
    document.body.classList.remove('admin-mode');
    return;
  }
  let pat = localStorage.getItem('gh_pat');
  if(!pat){
    pat = prompt('GitHub Personal Access Token을 입력하세요 (repo 권한 필요, 이 기기에만 저장돼요)');
    if(!pat) return;
    localStorage.setItem('gh_pat', pat.trim());
  }
  document.body.classList.add('admin-mode');
});

function markUnsaved(){
  hasUnsaved = true;
  document.getElementById('saveBar').classList.remove('hidden');
}

document.getElementById('saveBarBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveBarBtn');
  btn.disabled = true;
  btn.textContent = '저장 중…';
  try{
    await githubSaveFile(DATA_PATH, { days: DATA, budget: BUDGET }, '일정 업데이트');
    hasUnsaved = false;
    document.getElementById('saveBar').classList.add('hidden');
    toast('저장했어요! 1분 내로 반영돼요');
  }catch(err){
    toast('저장 실패: ' + err.message);
  }finally{
    btn.disabled = false;
    btn.textContent = 'GitHub에 저장';
  }
});

async function githubSaveFile(path, obj, message){
  const pat = localStorage.getItem('gh_pat');
  if(!pat) throw new Error('토큰이 없어요');
  const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${encodeURIComponent(path)}`;

  const getRes = await fetch(url, {
    headers: { Authorization: `token ${pat}`, Accept: 'application/vnd.github+json' }
  });
  if(!getRes.ok) throw new Error('파일 정보를 가져오지 못했어요 (토큰 확인 필요)');
  const getData = await getRes.json();
  const sha = getData.sha;

  const jsonStr = JSON.stringify(obj, null, 2);
  const content = btoa(unescape(encodeURIComponent(jsonStr)));

  const putRes = await fetch(url, {
    method: 'PUT',
    headers: { Authorization: `token ${pat}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, content, sha, branch: GH_BRANCH })
  });
  if(!putRes.ok){
    const err = await putRes.json().catch(() => ({}));
    throw new Error(err.message || '저장에 실패했어요');
  }
  return true;
}

// ---------------------------------------------------------------
// Item add/edit/delete
// ---------------------------------------------------------------
let editingItemId = null;

function openItemModal(id, dayForNew){
  editingItemId = id;
  const modal = document.getElementById('itemModal');
  const title = document.getElementById('itemModalTitle');
  if(id){
    const item = DATA.find(d => d.id === id);
    if(!item) return;
    title.textContent = '일정 수정';
    document.getElementById('f-day').value = item.day;
    document.getElementById('f-time').value = item.time;
    document.getElementById('f-type').value = item.type;
    document.getElementById('f-priority').value = item.priority || '-';
    document.getElementById('f-name').value = item.name;
    document.getElementById('f-addr').value = item.addr;
    document.getElementById('f-memo').value = item.memo || '';
    document.getElementById('f-home').value = item.home || '';
    document.getElementById('f-price').value = (item.price === null || item.price === undefined) ? '' : item.price;
    document.getElementById('f-priceLabel').value = item.priceLabel || '';
  } else {
    title.textContent = '일정 추가';
    document.getElementById('f-day').value = dayForNew || '';
    document.getElementById('f-time').value = '';
    document.getElementById('f-type').value = '';
    document.getElementById('f-priority').value = '-';
    document.getElementById('f-name').value = '';
    document.getElementById('f-addr').value = '';
    document.getElementById('f-memo').value = '';
    document.getElementById('f-home').value = '';
    document.getElementById('f-price').value = '';
    document.getElementById('f-priceLabel').value = '';
  }
  modal.classList.add('show');
}

document.getElementById('itemModalCancel').addEventListener('click', () => {
  document.getElementById('itemModal').classList.remove('show');
});

document.getElementById('itemModalSave').addEventListener('click', () => {
  const day = document.getElementById('f-day').value.trim();
  const time = document.getElementById('f-time').value.trim();
  const name = document.getElementById('f-name').value.trim();
  if(!day || !time || !name){ alert('날짜 그룹 · 시간 · 장소명은 필수예요'); return; }

  const addr = document.getElementById('f-addr').value.trim();
  const type = document.getElementById('f-type').value.trim() || '기타';
  const priority = document.getElementById('f-priority').value;
  const memo = document.getElementById('f-memo').value.trim();
  const home = document.getElementById('f-home').value.trim();
  const priceRaw = document.getElementById('f-price').value;
  const price = priceRaw === '' ? null : Number(priceRaw);
  const priceLabel = document.getElementById('f-priceLabel').value.trim();

  const q = encodeURIComponent(addr || name);
  const map = `https://www.google.com/maps/search/?api=1&query=${q}`;
  const dir = `https://www.google.com/maps/dir/?api=1&destination=${q}`;

  if(editingItemId){
    const idx = DATA.findIndex(d => d.id === editingItemId);
    if(idx > -1){
      DATA[idx] = { ...DATA[idx], day, time, type, priority, name, addr, memo, home, price, priceLabel, map, dir };
    }
  } else {
    DATA.push({ id: genId('i'), day, time, type, priority, name, addr, memo, home, price, priceLabel, map, dir });
  }

  document.getElementById('itemModal').classList.remove('show');
  markUnsaved();
  renderAll();
});

function deleteItem(id){
  if(!confirm('이 일정을 삭제할까요?')) return;
  DATA = DATA.filter(d => d.id !== id);
  markUnsaved();
  renderAll();
}

// ---------------------------------------------------------------
// Budget add/edit/delete
// ---------------------------------------------------------------
let editingBudgetId = null;

function openBudgetModal(id){
  editingBudgetId = id;
  const modal = document.getElementById('budgetModal');
  const title = document.getElementById('budgetModalTitle');
  if(id){
    const item = BUDGET.items.find(b => b.id === id);
    if(!item) return;
    title.textContent = '예산 항목 수정';
    document.getElementById('bf-cat').value = item.cat;
    document.getElementById('bf-name').value = item.name;
    document.getElementById('bf-price').value = item.price;
    document.getElementById('bf-note').value = item.note || '';
  } else {
    title.textContent = '예산 항목 추가';
    document.getElementById('bf-cat').value = '';
    document.getElementById('bf-name').value = '';
    document.getElementById('bf-price').value = '';
    document.getElementById('bf-note').value = '';
  }
  modal.classList.add('show');
}

document.getElementById('budgetModalCancel').addEventListener('click', () => {
  document.getElementById('budgetModal').classList.remove('show');
});

document.getElementById('budgetModalSave').addEventListener('click', () => {
  const cat = document.getElementById('bf-cat').value.trim() || '기타';
  const name = document.getElementById('bf-name').value.trim();
  const priceRaw = document.getElementById('bf-price').value;
  const price = priceRaw === '' ? 0 : Number(priceRaw);
  const note = document.getElementById('bf-note').value.trim();
  if(!name){ alert('이름은 필수예요'); return; }

  if(editingBudgetId){
    const idx = BUDGET.items.findIndex(b => b.id === editingBudgetId);
    if(idx > -1){ BUDGET.items[idx] = { ...BUDGET.items[idx], cat, name, price, note }; }
  } else {
    BUDGET.items.push({ id: genId('b'), cat, name, price, note });
  }

  document.getElementById('budgetModal').classList.remove('show');
  markUnsaved();
  renderAll();
});

function deleteBudgetItem(id){
  if(!confirm('이 예산 항목을 삭제할까요?')) return;
  BUDGET.items = BUDGET.items.filter(b => b.id !== id);
  markUnsaved();
  renderAll();
}

// ---------------------------------------------------------------
// Boot
// ---------------------------------------------------------------
Promise.all([
  fetch(DATA_PATH).then(r => r.json()),
  loadPhotos(),
  ensureAuth().catch(() => {})
]).then(([itinerary, photos]) => {
  DATA = itinerary.days;
  BUDGET = itinerary.budget;
  PHOTOS = photos;
  renderAll();
}).catch(() => {
  panelsEl.innerHTML = `<div style="text-align:center;color:var(--muted);font-size:12.5px;padding:40px 20px;">일정 데이터를 불러오지 못했어요. itinerary-data.json을 확인해주세요.</div>`;
});

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
